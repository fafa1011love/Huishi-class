<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参照物视角切换 —— 空中加油与列车交会</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #F1F5F9; color: #1E293B;
    padding: 18px 12px 40px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 22px; color: #1E293B; }
  header h1 span { color: #2563EB; }
  header .sub { font-size: 13px; color: #64748B; margin-top: 4px; }

  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .tabs button {
    padding: 8px 22px; border: 1.5px solid #CBD5E1; border-radius: 999px;
    background: #fff; color: #475569; font-size: 15px; cursor: pointer;
  }
  .tabs button.active { background: #2563EB; border-color: #2563EB; color: #fff; }

  .panel {
    display: none; background: #fff; border-radius: 14px;
    box-shadow: 0 2px 10px rgba(15,23,42,.08); padding: 14px 16px 16px;
  }
  .panel.active { display: block; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 10px; }
  .viewgroup { display: flex; align-items: center; gap: 6px; }
  .viewgroup .lab { font-size: 13px; color: #64748B; margin-right: 2px; }
  .viewgroup button {
    padding: 5px 14px; border-radius: 8px; border: 1.5px solid #E2E8F0;
    background: #F8FAFC; color: #334155; font-size: 13px; cursor: pointer;
  }
  .viewgroup button.active { background: #2563EB; border-color: #2563EB; color: #fff; font-weight: bold; }

  .ctl { display: flex; gap: 6px; margin-left: auto; }
  .ctl button {
    padding: 5px 14px; border-radius: 8px; border: 1.5px solid #E2E8F0;
    background: #fff; color: #334155; font-size: 13px; cursor: pointer;
  }
  .ctl button:hover { border-color: #94A3B8; }

  .slider { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .slider label { color: #475569; white-space: nowrap; }
  .slider b { min-width: 74px; color: #2563EB; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 150px; accent-color: #2563EB; }

  .chips { display: flex; gap: 8px; }
  .chips button {
    padding: 4px 12px; border-radius: 999px; border: 1px solid #FDBA74;
    background: #FFF7ED; color: #C2410C; font-size: 12.5px; cursor: pointer;
  }
  .chips button:hover { background: #FFEDD5; }

  .stage-wrap { border: 1px solid #E2E8F0; border-radius: 10px; overflow: hidden; }
  svg { display: block; width: 100%; height: auto; background: #fff; }

  .relline {
    margin-top: 10px; padding: 9px 14px; border-radius: 9px;
    background: #EFF6FF; border-left: 4px solid #2563EB;
    font-size: 14.5px; color: #1E3A8A; line-height: 1.5;
  }
  .tip {
    margin-top: 8px; padding: 8px 14px; border-radius: 9px;
    background: #FFFBEB; border-left: 4px solid #F59E0B;
    font-size: 13.5px; color: #92400E; line-height: 1.5;
  }
  .tip.ok { background: #ECFDF5; border-left-color: #10B981; color: #065F46; }

  .keybar {
    margin-top: 14px; text-align: center; padding: 10px 16px;
    background: #1E293B; color: #F8FAFC; border-radius: 12px;
    font-size: 14.5px; letter-spacing: .5px;
  }
  .keybar b { color: #FDE68A; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>参照物与运动和静止的相对性</span> · 视角切换动画</h1>
    <p class="sub">§1.2 运动的描述 · 难点：参照物改变结论 —— 同一画面，切换参照物看结果</p>
  </header>

  <nav class="tabs">
    <button id="tabA" class="active">✈ 空中加油机</button>
    <button id="tabB">🚄 列车交会</button>
  </nav>

  <!-- 场景 A：空中加油 -->
  <section id="panelA" class="panel active">
    <div class="row">
      <div class="viewgroup" id="viewA">
        <span class="lab">参照物（视角）</span>
        <button data-v="ground" class="active">地面</button>
        <button data-v="tanker">加油机</button>
        <button data-v="receiver">受油机</button>
      </div>
      <div class="ctl">
        <button id="playA">⏸ 暂停</button>
        <button id="resetA">↺ 起点</button>
      </div>
    </div>
    <div class="row">
      <div class="slider"><label>加油机</label><input type="range" id="vT" min="60" max="140" value="100"><b id="vTl">100 m/s</b></div>
      <div class="slider"><label>受油机</label><input type="range" id="vR" min="60" max="140" value="100"><b id="vRl">100 m/s</b></div>
      <div class="chips">
        <button data-p="0,1">稳定加油</button>
        <button data-p="1,0">受油机慢了</button>
      </div>
    </div>
    <div class="stage-wrap"><svg id="stageA" viewBox="0 0 800 320"></svg></div>
    <div class="relline" id="relA"></div>
    <div class="tip" id="tipA"></div>
  </section>

  <!-- 场景 B：列车交会 -->
  <section id="panelB" class="panel">
    <div class="row">
      <div class="viewgroup" id="viewB">
        <span class="lab">参照物（视角）</span>
        <button data-v="ground" class="active">地面</button>
        <button data-v="a">甲车</button>
        <button data-v="b">乙车</button>
      </div>
      <div class="ctl">
        <button id="playB">⏸ 暂停</button>
        <button id="resetB">↺ 起点</button>
      </div>
    </div>
    <div class="row">
      <div class="slider"><label>甲车</label><input type="range" id="v1" min="-30" max="30" value="18"><b id="v1l">+18 m/s</b></div>
      <div class="slider"><label>乙车</label><input type="range" id="v2" min="-30" max="30" value="-18"><b id="v2l">−18 m/s</b></div>
      <div class="chips">
        <button data-p="18,-18">相向交会</button>
        <button data-p="15,30">同向追及</button>
        <button data-p="20,20">并肩同速</button>
      </div>
    </div>
    <div class="stage-wrap"><svg id="stageB" viewBox="0 0 800 320"></svg></div>
    <div class="relline" id="relB"></div>
    <div class="tip" id="tipB"></div>
  </section>

  <div class="keybar">
    同一个运动，选不同的参照物，可以说它 <b>动</b>、也可以说它 <b>静</b> —— 运动和静止是<b>相对的</b>
  </div>
</div>

<script>
"use strict";
/* ---------- 公共工具 ---------- */
function mod(x, m){ return ((x % m) + m) % m; }
// 环形世界里的最短有向距离（防接缝重影）
function wd(d, W){ d = mod(d, W); return d > W/2 ? d - W : d; }

const WA = 1600, WB = 1000;   // 两个场景的环形世界周长（m）

/* ---------- 场景状态 ---------- */
const A = {
  view: "ground", playing: true,
  tanker:   { x: 900, v: 100 },   // 机头世界坐标
  receiver: { x: 640, v: 100 },   // 在加油机后方 260 m
};
const B = {
  view: "ground", playing: true,
  a: { x: 300, v: 18 },           // 甲车（上轨）
  b: { x: 800, v: -18 },          // 乙车（下轨）
};
const B_HOME = { a: 300, b: 800 };
const A_HOME = { tanker: 900, receiver: 640 };

/* ---------- 场景 A 渲染 ---------- */
function planeTanker(dx, dy){
  return `<g transform="translate(${dx},${dy})">
    <polygon points="-96,-3 -152,-32 -140,-32 -82,-7" fill="#94A3B8"/>
    <ellipse cx="-78" cy="0" rx="74" ry="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="-34,4 -80,27 -46,27 -12,6" fill="#CBD5E1" stroke="#94A3B8"/>
    <ellipse cx="-70" cy="24" rx="14" ry="5.5" fill="#94A3B8"/>
    <circle cx="-6" cy="-4" r="4.5" fill="#38BDF8"/>
    <rect x="-58" y="-6" width="42" height="4" rx="2" fill="#94A3B8"/>
  </g>`;
}
function planeFighter(dx, dy){
  return `<g transform="translate(${dx},${dy})">
    <path d="M0,0 L-20,-8 L-72,-8 L-90,-24 L-90,-17 L-70,-5 L-88,6 L-70,8 L-16,8 Z" fill="#2563EB"/>
    <polygon points="-30,3 -64,22 -42,22 -16,6" fill="#1D4ED8"/>
    <ellipse cx="-27" cy="-3" rx="10" ry="4" fill="#93C5FD"/>
  </g>`;
}
function renderA(){
  const cx = A.view === "ground" ? 0 : (A.view === "tanker" ? A.tanker.x : A.receiver.x);
  const CX = 400;
  let s = `<defs><linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient></defs>
    <rect width="800" height="320" fill="url(#skyA)"/>
    <circle cx="700" cy="58" r="26" fill="#FDE68A" opacity=".85"/>`;
  // 云（间距 80，n=20，恰好一个周期）
  for(let i = 0; i < 20; i++){
    const y = 48 + (i * 53) % 115, r = 15 + (i * 29) % 16;
    const x = wd(i * 80 - cx, WA) + CX;
    if (x > -90 && x < 890)
      s += `<ellipse cx="${x}" cy="${y}" rx="${r*1.8}" ry="${r}" fill="#fff" opacity=".85"/>
            <ellipse cx="${x + r*0.9}" cy="${y - r*0.55}" rx="${r*1.05}" ry="${r*0.8}" fill="#fff" opacity=".9"/>`;
  }
  // 远山（间距 200，n=8）
  for(let i = 0; i < 8; i++){
    const x = wd(i * 200 - cx, WA) + CX;
    if (x > -160 && x < 960)
      s += `<path d="M${x-85},292 Q${x},220 ${x+85},292 Z" fill="#BBF7D0"/>`;
  }
  // 地面 + 树（间距 100，n=16）
  s += `<rect y="292" width="800" height="28" fill="#DCFCE7"/><line x1="0" y1="292" x2="800" y2="292" stroke="#86EFAC" stroke-width="2"/>`;
  for(let i = 0; i < 16; i++){
    const x = wd(i * 100 - cx, WA) + CX;
    if (x > -40 && x < 840)
      s += `<rect x="${x-3}" y="264" width="6" height="28" fill="#A16207"/>
            <circle cx="${x}" cy="254" r="15" fill="#4ADE80"/><circle cx="${x-9}" cy="262" r="9" fill="#22C55E"/>`;
  }
  // 飞机
  const dxT = wd(A.tanker.x - cx, WA) + CX;
  const dxR = wd(A.receiver.x - cx, WA) + CX;
  // 输油管：受油机在加油机后方且距离不太远时画出
  const gap = wd(A.tanker.x - A.receiver.x, WA);
  if (gap > 0 && gap < 430){
    const x1 = dxT - 148, y1 = 154, x2 = dxR, y2 = 190;
    s += `<path d="M${x1},${y1} Q${(x1+x2)/2},${(y1+y2)/2 + 26} ${x2},${y2}" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="7 4"/>
          <circle cx="${x2}" cy="${y2}" r="6" fill="none" stroke="#F59E0B" stroke-width="3"/>`;
  }
  s += planeTanker(dxT, 150) + planeFighter(dxR, 192);
  return s;
}

/* ---------- 场景 B 渲染 ---------- */
function trainG(x, railY, color, dark){
  const L = 240;
  let w = `<rect x="${x-L+2}" y="${railY-84}" width="${L-4}" height="62" rx="12" fill="${color}" stroke="${dark}" stroke-width="1.5"/>
    <rect x="${x-38}" y="${railY-76}" width="24" height="26" rx="4" fill="#DBEAFE"/>`;
  for(let k = 0; k < 5; k++)
    w += `<rect x="${x-70-k*34}" y="${railY-74}" width="22" height="22" rx="3.5" fill="#DBEAFE"/>`;
  w += `<rect x="${x-L+2}" y="${railY-42}" width="${L-4}" height="8" fill="#fff" opacity=".9"/>`;
  for(const cx of [x-36, x-120, x-204])
    w += `<circle cx="${cx}" cy="${railY-10}" r="9" fill="#334155"/><circle cx="${cx}" cy="${railY-10}" r="3.5" fill="#94A3B8"/>`;
  return w;
}
function trackbed(y){
  return `<rect y="${y}" width="800" height="9" fill="#E7E5E4"/>
          <line x1="0" y1="${y}" x2="800" y2="${y}" stroke="#57534E" stroke-width="3"/>`;
}
function renderB(){
  const cx = B.view === "ground" ? 0 : (B.view === "a" ? B.a.x : B.b.x);
  const CX = 400;
  let s = `<defs><linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient></defs>
    <rect width="800" height="320" fill="url(#skyB)"/>`;
  // 远山（间距 200，n=5）
  for(let i = 0; i < 5; i++){
    const x = wd(i * 200 - cx, WB) + CX;
    if (x > -160 && x < 960)
      s += `<path d="M${x-80},140 Q${x},84 ${x+80},140 Z" fill="#C7D2FE"/>`;
  }
  s += `<rect y="140" width="800" height="180" fill="#ECFDF5"/>`;
  // 电线杆（间距 100，n=10）
  for(let i = 0; i < 10; i++){
    const x = wd(i * 100 - cx, WB) + CX;
    if (x > -40 && x < 840)
      s += `<line x1="${x}" y1="52" x2="${x}" y2="140" stroke="#B45309" stroke-width="4"/>
            <line x1="${x-18}" y1="60" x2="${x+18}" y2="60" stroke="#B45309" stroke-width="4"/>`;
  }
  s += trackbed(195) + trackbed(290);
  const dxa = wd(B.a.x - cx, WB) + CX;
  const dxb = wd(B.b.x - cx, WB) + CX;
  s += trainG(dxa, 195, "#2563EB", "#1E40AF");
  s += trainG(dxb, 290, "#F59E0B", "#B45309");
  return s;
}

/* ---------- 文案 ---------- */
const fmt = n => Math.round(n);
function vStr(v){ return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(fmt(v)); }

function relLineA(){
  const vT = A.tanker.v, vR = A.receiver.v;
  if (A.view === "ground")
    return `以<u>地面</u>为参照物：加油机 ${fmt(vT)} m/s、受油机 ${fmt(vR)} m/s，都在向前飞`;
  const me = A.view === "tanker" ? "加油机" : "受油机";
  const other = A.view === "tanker" ? "受油机" : "加油机";
  const rel = A.view === "tanker" ? vR - vT : vT - vR;
  if (rel === 0) return `以<u>${me}</u>为参照物：${other}是<b>静止</b>的 —— 两机相对静止`;
  if (rel > 0)   return `以<u>${me}</u>为参照物：${other}以 ${fmt(rel)} m/s 向前运动`;
  return `以<u>${me}</u>为参照物：${other}以 ${fmt(-rel)} m/s 向后退去`;
}
function tipA(){
  const rel = A.receiver.v - A.tanker.v;
  if (rel === 0) return { ok: true,
    t: `两机速度相同（v受 = v加 = ${fmt(A.tanker.v)} m/s）→ 相对静止，输油管稳定连接，这就是空中加油的前提` };
  return { ok: false,
    t: `两机速度不同 → 相对运动，输油管会被拉脱。想让受油机"停"在加油机旁，只能让 v受 = v加` };
}
function relLineB(){
  const v1 = B.a.v, v2 = B.b.v;
  if (B.view === "ground")
    return `以<u>地面</u>为参照物：甲车 ${vStr(v1)} m/s、乙车 ${vStr(v2)} m/s（正 = 向右，负 = 向左）`;
  const me = B.view === "a" ? "甲车" : "乙车";
  const other = B.view === "a" ? "乙车" : "甲车";
  const rel = B.view === "a" ? v2 - v1 : v1 - v2;
  if (rel === 0) return `以<u>${me}</u>为参照物：${other}是<b>静止</b>的 —— 同向同速，并排行驶互看不动`;
  const dir = rel > 0 ? "向右" : "向左";
  return `以<u>${me}</u>为参照物：${other}以 ${fmt(Math.abs(rel))} m/s ${dir}运动`;
}
function tipB(){
  const v1 = B.a.v, v2 = B.b.v, rel = v2 - v1;
  if (v1 * v2 < 0)
    return { ok: false, t: `相向而行：甲看乙的速度大小 = v甲 + v乙 = ${fmt(Math.abs(v1) + Math.abs(v2))} m/s，比地面上看到的车速快得多 —— 这就是会车时觉得对面车"冲过来"的原因` };
  if (rel === 0)
    return { ok: true, t: `v甲 = v乙 → 相对静止：并排同速行驶时，互相看对方都像停着` };
  const slow = Math.abs(v1) < Math.abs(v2) ? "甲车" : "乙车";
  const fast = slow === "甲车" ? "乙车" : "甲车";
  return { ok: false, t: `同向行驶：以${slow}为参照物，${fast}只以 ${fmt(Math.abs(v1 - v2))} m/s 缓慢超越；以${fast}为参照物，${slow}却在"倒退" —— 参照物一换，快慢结论就反了` };
}

function refresh(){
  const la = document.getElementById("relA"), ta = document.getElementById("tipA");
  la.innerHTML = relLineA(); const a = tipA();
  ta.className = "tip" + (a.ok ? " ok" : ""); ta.textContent = a.t;
  const lb = document.getElementById("relB"), tb = document.getElementById("tipB");
  lb.innerHTML = relLineB(); const b = tipB();
  tb.className = "tip" + (b.ok ? " ok" : ""); tb.textContent = b.t;
}

/* ---------- 动画循环 ---------- */
const stageA = document.getElementById("stageA");
const stageB = document.getElementById("stageB");
let active = "A", last = 0;
function loop(t){
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  if (A.playing){
    A.tanker.x   = mod(A.tanker.x   + A.tanker.v   * dt, WA);
    A.receiver.x = mod(A.receiver.x + A.receiver.v * dt, WA);
  }
  if (B.playing){
    B.a.x = mod(B.a.x + B.a.v * dt, WB);
    B.b.x = mod(B.b.x + B.b.v * dt, WB);
  }
  if (active === "A") stageA.innerHTML = renderA();
  else stageB.innerHTML = renderB();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
refresh();

/* ---------- 交互 ---------- */
function bindTabs(){
  const ta = document.getElementById("tabA"), tb = document.getElementById("tabB");
  ta.onclick = () => { active = "A"; ta.classList.add("active"); tb.classList.remove("active");
    document.getElementById("panelA").classList.add("active");
    document.getElementById("panelB").classList.remove("active"); };
  tb.onclick = () => { active = "B"; tb.classList.add("active"); ta.classList.remove("active");
    document.getElementById("panelB").classList.add("active");
    document.getElementById("panelA").classList.remove("active"); };
}
bindTabs();

function bindView(id, scene){
  const box = document.getElementById(id);
  box.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      box.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      scene.view = btn.dataset.v;
      refresh();
    };
  });
}
bindView("viewA", A);
bindView("viewB", B);

function bindPlay(id, scene, label){
  const btn = document.getElementById(id);
  btn.onclick = () => {
    scene.playing = !scene.playing;
    btn.textContent = scene.playing ? "⏸ 暂停" : "▶ 播放";
  };
}
bindPlay("playA", A);
bindPlay("playB", B);
document.getElementById("resetA").onclick = () => {
  A.tanker.x = A_HOME.tanker; A.receiver.x = A_HOME.receiver; refresh();
};
document.getElementById("resetB").onclick = () => {
  B.a.x = B_HOME.a; B.b.x = B_HOME.b; refresh();
};

function bindSlider(id, labelId, obj, sign){
  const el = document.getElementById(id), lab = document.getElementById(labelId);
  el.oninput = () => { obj.v = +el.value; lab.textContent = sign ? vStr(obj.v) + " m/s" : fmt(obj.v) + " m/s"; refresh(); };
}
bindSlider("vT", "vTl", A.tanker, false);
bindSlider("vR", "vRl", A.receiver, false);
bindSlider("v1", "v1l", B.a, true);
bindSlider("v2", "v2l", B.b, true);

// 预设：data-p="v1,v2"
document.querySelectorAll("#panelA .chips button").forEach(btn => {
  btn.onclick = () => {
    const [vt, vr] = btn.dataset.p.split(",").map(Number);
    A.tanker.v = vt; A.receiver.v = vr;
    document.getElementById("vT").value = vt; document.getElementById("vR").value = vr;
    document.getElementById("vTl").textContent = fmt(vt) + " m/s";
    document.getElementById("vRl").textContent = fmt(vr) + " m/s";
    A.tanker.x = A_HOME.tanker; A.receiver.x = A_HOME.receiver;
    refresh();
  };
});
document.querySelectorAll("#panelB .chips button").forEach(btn => {
  btn.onclick = () => {
    const [v1, v2] = btn.dataset.p.split(",").map(Number);
    B.a.v = v1; B.b.v = v2;
    document.getElementById("v1").value = v1; document.getElementById("v2").value = v2;
