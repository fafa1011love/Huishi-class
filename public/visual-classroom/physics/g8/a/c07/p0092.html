<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速度与匀速直线运动</title>
<style>
:root{
  --blue:#2563EB;
  --blue-d:#1D4ED8;
  --blue-l:#EFF4FF;
  --green:#10B981;
  --green-l:#EAFBF4;
  --red:#EF4444;
  --purple:#7C3AED;
  --amber:#F59E0B;
  --ink:#1F2937;
  --ink-2:#4B5563;
  --ink-3:#6B7280;
  --line:#E5E7EB;
  --bg:#F5F7FB;
  --card:#FFFFFF;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

/* ---------- header ---------- */
.site-header{
  background:linear-gradient(135deg,#1E40AF 0%,#2563EB 55%,#3B82F6 100%);
  color:#fff;padding:26px 0 28px;
}
.header-inner{
  max-width:1080px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.header-text h1{margin:0;font-size:25px;letter-spacing:.4px;font-weight:700;}
.header-text p{margin:6px 0 0;font-size:14px;opacity:.9;}
.header-badge{
  border:1px solid rgba(255,255,255,.4);border-radius:999px;
  padding:7px 16px;font-size:13px;background:rgba(255,255,255,.12);white-space:nowrap;
}

/* ---------- 吸顶导航 ---------- */
.sec-nav{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1080px;margin:0 auto;padding:9px 24px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.nav-chip{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  border-radius:999px;padding:6px 15px;font-size:13px;cursor:pointer;
  font-family:inherit;text-decoration:none;transition:.16s;
}
.nav-chip:hover{border-color:var(--blue);color:var(--blue);}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:24px 24px 40px;}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px;border:1px solid rgba(229,231,235,.7);
  scroll-margin-top:72px;
}
.card + .card{margin-top:18px;}
.card > h2{margin:0 0 6px;font-size:19px;font-weight:700;}
.card > h2 .no{
  display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;
  background:var(--blue);color:#fff;border-radius:8px;font-size:14px;margin-right:8px;
}
.lead{margin:0 0 16px;color:var(--ink-2);font-size:14px;}

/* ---------- 画面区 ---------- */
.stage{
  background:#F8FAFC;border:1px solid var(--line);border-radius:12px;
  padding:14px;display:flex;justify-content:center;overflow-x:auto;
}
.stage svg{display:block;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.two .stage{padding:10px;}

/* ---------- 控制 / 读数 两栏 ---------- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;}
.ctrl-block{padding:10px 0 0;}

/* ---------- 分段按钮 ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:4px;}
.seg-b{
  border:none;background:#fff;color:var(--ink-2);padding:7px 14px;font-size:13px;
  cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap;
}
.seg-b + .seg-b{border-left:1px solid var(--line);}
.seg-b:hover{background:#F8FAFC;}
.seg-b.on{background:var(--blue);color:#fff;font-weight:600;}

/* ---------- 滑块 ---------- */
.slider-row{margin-top:10px;}
.slider-row label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;}
.slider-row label b{color:var(--blue);font-variant-numeric:tabular-nums;}
.slider-row input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer;}
.slider-row input[type=range]:disabled{opacity:.45;cursor:not-allowed;}
.hint{color:var(--ink-3);font-size:12px;}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;}

/* ---------- 按钮 ---------- */
.quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.btn-sm{
  border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s;
}
.btn-sm:hover{background:var(--blue);color:#fff;}
.btn-sm.primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.25);}
.btn-sm.primary:hover{background:var(--blue-d);}
.btn-sm.on{background:var(--purple);border-color:var(--purple);color:#fff;}
.btn-sm.on:hover{background:#6D28D9;}

/* ---------- 读数 ---------- */
.ro-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.ro{display:flex;justify-content:space-between;padding:8px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
.ro:last-child{border-bottom:none;}
.ro span{color:var(--ink-3);}
.ro b{font-variant-numeric:tabular-nums;color:var(--ink);}
.ro b.ok{color:var(--green);}
.ro b.warn{color:var(--amber);}
.ro b.bad{color:var(--red);}

/* ---------- 结论 / 提示 ---------- */
.verdict{margin-top:12px;padding:10px 13px;border-radius:10px;font-size:13.5px;border:1px solid;}
.verdict.ok{background:var(--green-l);border-color:#A7F3D0;color:#065F46;}
.verdict.no{background:#FEF2F2;border-color:#FECACA;color:#991B1B;}
.calc-res{margin-top:10px;font-size:13.5px;color:var(--ink-2);}
.tag-ok{color:var(--green);font-weight:700;}
.tag-no{color:var(--red);font-weight:700;}
.formula{
  margin-top:12px;padding:9px 12px;background:#F8FAFC;border:1px dashed var(--line);
  border-radius:8px;font-size:13px;color:var(--ink-2);
}
.formula b{color:var(--purple);}
.note{color:var(--ink-3);font-size:12px;margin-top:8px;}
.note b{color:var(--ink-2);}
.play-state{color:var(--purple);font-size:12px;font-weight:700;}

/* ---------- 迷你表格 ---------- */
.mini-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
.mini-table th,.mini-table td{
  border:1px solid var(--line);padding:5px 3px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.mini-table th{background:#F8FAFC;color:var(--ink-3);font-weight:600;}
.mini-table td{color:var(--ink-2);}

/* ---------- 小结 ---------- */
.summary{list-style:none;margin:6px 0 0;padding:0;}
.summary li{
  position:relative;padding:6px 0 6px 22px;font-size:13.5px;color:var(--ink-2);
  border-bottom:1px dashed var(--line);
}
.summary li:last-child{border-bottom:none;}
.summary li::before{
  content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;
  border-radius:50%;background:var(--blue);
}
.summary b{color:var(--purple);}

/* ---------- footer ---------- */
.site-footer{text-align:center;padding:22px 0 34px;color:var(--ink-3);font-size:12.5px;}

/* ---------- 响应式 ---------- */
@media(max-width:900px){
  .two-col{grid-template-columns:1fr;}
  .two{grid-template-columns:1fr;}
  .grid6{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-text">
      <h1>探究：速度的概念与匀速直线运动</h1>
      <p>初中物理 · 机械运动　|　四步走：怎么比快慢 → 速度是什么 → 怎样才算匀速 → 照片上怎么比快慢</p>
    </div>
    <div class="header-badge">可交互探究 · 拖动看变化</div>
  </div>
</header>

<nav class="sec-nav">
  <div class="nav-inner">
    <a class="nav-chip" href="#sec-race">① 谁跑得快</a>
    <a class="nav-chip" href="#sec-speed">② 速度是个什么数</a>
    <a class="nav-chip" href="#sec-uni">③ 匀速还是变速</a>
    <a class="nav-chip" href="#sec-stro">④ 同屏两车频闪对比</a>
  </div>
</nav>

<main class="wrap">

  <!-- ① -->
  <section class="card" id="sec-race">
    <h2><span class="no">1</span>谁跑得快？——比较运动快慢的两种方法</h2>
    <div class="stage" id="raceStage"></div>
    <div class="two-col">
      <div class="ctrl" id="raceCtrl"></div>
      <div id="raceRead"></div>
    </div>
  </section>

  <!-- ② -->
  <section class="card" id="sec-speed">
    <h2><span class="no">2</span>速度到底是个什么数？——把路程按时间切开</h2>
    <div class="stage" id="speedStage"></div>
    <div class="ctrl" id="speedCtrl"></div>
  </section>

  <!-- ③ -->
  <section class="card" id="sec-uni">
    <h2><span class="no">3</span>匀速还是变速？——频闪记录说了算</h2>
    <div class="stage" id="uniStage"></div>
    <div class="two">
      <div class="stage" id="chartST"></div>
      <div class="stage" id="chartVT"></div>
    </div>
    <div class="two-col">
      <div class="ctrl" id="uniCtrl"></div>
      <div id="uniRead"></div>
    </div>
  </section>

  <!-- ④ -->
  <section class="card" id="sec-stro">
    <h2><span class="no">4</span>同屏两车频闪照片——点距就是快慢</h2>
    <div class="stage" id="stroStage"></div>
    <div class="ctrl" id="stroCtrl"></div>
  </section>

</main>

<footer class="site-footer">物理可视化模型 · 速度与匀速直线运动　|　纯静态、零依赖，双击 index.html 即可使用</footer>

<script>
/* ---------- core.js ---------- */
/* ============================================================
   core.js —— 通用工具 + SVG 绘图引擎
   专题：速度的概念与匀速直线运动

   坐标约定：SVG 内部一律用 px；物理量乘「每单位多少 px」换算成 px。
   本文件与具体实验无关，后续做「平均速度测量」「牛顿第一定律」等
   直线运动相关实验可直接复用 car / bracket / rulerX / axes。
   ============================================================ */

const FONT = "Microsoft YaHei, PingFang SC, sans-serif";

/* ---------------- 小工具 ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const fmt  = (n, d = 2) => Number(n).toFixed(d);
const fmt1 = n => Number(n).toFixed(1);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (v, d = 2) => Math.round(v * 10 ** d) / 10 ** d;

/* ---------------- 配色 ---------------- */
const CL = {
  blue: "#2563EB", blueD: "#1D4ED8", blueL: "#EFF4FF",
  green: "#10B981", greenL: "#EAFBF4",
  red: "#EF4444", amber: "#F59E0B", purple: "#7C3AED",
  ink: "#1F2937", ink2: "#4B5563", ink3: "#6B7280",
  line: "#E5E7EB", grid: "#EEF2F7", slate: "#94A3B8"
};

/* ---------------- 文字 ---------------- */
function txt(x, y, s, o = {}) {
  return `<text x="${round(x, 2)}" y="${round(y, 2)}" font-size="${o.size ?? 13}" fill="${o.fill ?? CL.ink}"`
    + ` font-weight="${o.w ?? 400}" text-anchor="${o.a ?? "start"}" font-family="${FONT}">${s}</text>`;
}

/* ---------------- 画布包装 ---------------- */
/* opt = { content, w, h, pad, padTop, padBottom, maxW, cls } */
function svgWrap(opt) {
  const pad  = opt.pad ?? 14;
  const pT   = opt.padTop ?? pad;
  const pB   = opt.padBottom ?? pad;
  const vb   = `${-pad} ${-pT} ${round(opt.w + pad * 2, 2)} ${round(opt.h + pT + pB, 2)}`;
  const scale = Math.min(1, (opt.maxW ?? 900) / (opt.w + pad * 2));
  const w = round((opt.w + pad * 2) * scale, 1);
  const h = round((opt.h + pT + pB) * scale, 1);
  return `<svg viewBox="${vb}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" role="img">${opt.content}</svg>`;
}

/* ---------------- 小车（侧视，车轮底部贴 groundY） ---------------- */
/* cx = 车身中心 x；s = 缩放；color = 主色 */
function car(cx, groundY, s, color, label) {
  s = s || 1;
  const w = 54 * s, bh = 18 * s, r = 7 * s;
  const top = groundY - bh - 3 * r;
  let g = `<g transform="translate(${round(cx - w / 2, 2)},${round(top, 2)})">`;
  g += `<rect x="0" y="0" width="${round(w, 2)}" height="${round(bh, 2)}" rx="${round(4 * s, 2)}"`
    + ` fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="${round(1.8 * s, 2)}"/>`;
  g += `<rect x="${round(w * 0.52, 2)}" y="${round(bh * 0.18, 2)}" width="${round(w * 0.34, 2)}"`
    + ` height="${round(bh * 0.52, 2)}" rx="${round(2 * s, 2)}" fill="${color}" fill-opacity=".34"/>`;
  g += `<circle cx="${round(w * 0.24, 2)}" cy="${round(bh + 2 * r, 2)}" r="${round(r, 2)}"`
    + ` fill="#fff" stroke="${color}" stroke-width="${round(1.8 * s, 2)}"/>`;
  g += `<circle cx="${round(w * 0.76, 2)}" cy="${round(bh + 2 * r, 2)}" r="${round(r, 2)}"`
    + ` fill="#fff" stroke="${color}" stroke-width="${round(1.8 * s, 2)}"/>`;
  g += `</g>`;
  if (label) g += txt(cx, top - 7, label, { size: 12 * s, w: 700, a: "middle", fill: color });
  return g;
}

/* ---------------- 距离括注（两端带竖线，文字居中在上） ---------------- */
function bracket(xA, xB, y, label, color) {
  let g = `<line x1="${round(xA, 2)}" y1="${y}" x2="${round(xB, 2)}" y2="${y}" stroke="${color}" stroke-width="1.6"/>`;
  g += `<line x1="${round(xA, 2)}" y1="${y - 6}" x2="${round(xA, 2)}" y2="${y + 6}" stroke="${color}" stroke-width="1.6"/>`;
  g += `<line x1="${round(xB, 2)}" y1="${y - 6}" x2="${round(xB, 2)}" y2="${y + 6}" stroke="${color}" stroke-width="1.6"/>`;
  if (label) g += txt((xA + xB) / 2, y - 9, label, { size: 12, w: 700, a: "middle", fill: color });
  return g;
}

/* ---------------- 水平刻度尺 ---------------- */
/* o = { x0, L(米), px, y, step, color } */
function rulerX(o) {
  const step = o.step ?? (o.L > 30 ? 10 : (o.L > 14 ? 5 : (o.L > 7 ? 2 : 1)));
  const n = Math.floor(o.L / step + 1e-9);
  let g = `<line x1="${o.x0}" y1="${o.y}" x2="${round(o.x0 + o.L * o.px, 2)}" y2="${o.y}" stroke="${CL.line}" stroke-width="1"/>`;
  for (let i = 0; i <= n; i++) {
    const m = i * step, X = o.x0 + m * o.px;
    g += `<line x1="${round(X, 2)}" y1="${o.y}" x2="${round(X, 2)}" y2="${o.y + 6}" stroke="${CL.slate}" stroke-width="1.2"/>`;
    g += txt(X, o.y + 19, String(m), { size: 11, a: "middle", fill: CL.ink3 });
  }
  g += txt(o.x0 + o.L * o.px + 10, o.y + 19, "m", { size: 11, fill: CL.ink3 });
  return g;
}

/* ---------------- 图表坐标框 ---------------- */
/* o = { x, y, w, h, xMin, xMax, yMin, yMax, xStep, yStep, xLabel, yLabel, xFmt, yFmt }
   返回 { markup, X(v), Y(v), x, y, w, h } */
function axes(o) {
  const x = o.x, y = o.y, w = o.w, h = o.h;
  const xMin = o.xMin ?? 0, xMax = o.xMax;
  const yMin = o.yMin ?? 0, yMax = o.yMax;
  const X = v => x + (v - xMin) / (xMax - xMin) * w;
  const Y = v => y + h - (v - yMin) / (yMax - yMin) * h;
  const xF = o.xFmt || (v => fmt(v, 1));
  const yF = o.yFmt || (v => fmt(v, 1));

  let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="${CL.line}"/>`;

  const nx = Math.round((xMax - xMin) / o.xStep);
  for (let i = 0; i <= nx; i++) {
    const v = xMin + i * o.xStep, X0 = X(v);
    g += `<line x1="${round(X0, 2)}" y1="${y}" x2="${round(X0, 2)}" y2="${y + h}" stroke="${CL.grid}" stroke-width="1"/>`;
    g += txt(X0, y + h + 15, xF(v), { size: 11, a: "middle", fill: CL.ink3 });
  }
  const ny = Math.round((yMax - yMin) / o.yStep);
  for (let i = 0; i <= ny; i++) {
    const v = yMin + i * o.yStep, Y0 = Y(v);
    g += `<line x1="${x}" y1="${round(Y0, 2)}" x2="${x + w}" y2="${round(Y0, 2)}" stroke="${CL.grid}" stroke-width="1"/>`;
    g += txt(x - 7, Y0 + 4, yF(v), { size: 11, a: "end", fill: CL.ink3 });
  }
  g += `<line x1="${x}" y1="${y + h}" x2="${x + w}" y2="${y + h}" stroke="${CL.ink2}" stroke-width="1.6"/>`;
  g += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + h}" stroke="${CL.ink2}" stroke-width="1.6"/>`;
  if (o.xLabel) g += txt(x + w / 2, y + h + 32, o.xLabel, { size: 12, a: "middle", fill: CL.ink2, w: 600 });
  if (o.yLabel) g += txt(x - 6, y - 8, o.yLabel, { size: 12, a: "end", fill: CL.ink2, w: 600 });

  return { markup: g, X, Y, x, y, w, h };
}

/* 折线路径 */
function polyPath(pts, X, Y) {
  return pts.map((p, i) => `${i ? "L" : "M"}${round(X(p[0]), 2)} ${round(Y(p[1]), 2)}`).join(" ");
}
</script>
<script>
/* ---------- race.js ---------- */
/* ============================================================
   race.js —— 探究①：谁跑得快？比较运动快慢的两种方法

   两种办法：
     A. 相同时间比路程 —— 都跑 T 秒，路程长的快
     B. 相同路程比时间 —— 都跑 S 米，用时短的快
   两种方法本质上都在比 s/t，所以结论必然一致 —— 这正是引入
   「速度 v = s/t」这个统一标准的理由。

   动画说明：为便于课堂观察，动画时长按比例压缩到 2.2~6 s，
   但图中计时器读的是真实物理时间。
   ============================================================ */

const RACE = {
  mode: "T",          // "T" = 相同时间比路程；"S" = 相同路程比时间
  vA: 6, vB: 4,       // m/s
  T: 4,               // 相同时间，s
  S: 20,              // 相同路程，m
  tau: 4,             // 当前显示的物理时刻
  playing: false, raf: null
};

/* 本轮运动的总物理时长 */
function raceTOT() {
  return RACE.mode === "T" ? RACE.T : Math.max(RACE.S / RACE.vA, RACE.S / RACE.vB);
}

/* 场景比例尺：让画面刚好容纳最远的那辆车 */
function raceScale() {
  const need = RACE.mode === "T" ? Math.max(RACE.vA, RACE.vB) * RACE.T : RACE.S;
  const L = Math.max(need * 1.08, 6);
  return { L, px: 470 / L };
}

/* ---------------- 场景绘制 ---------------- */
function raceScene() {
  const { vA, vB, T, S, mode, tau } = RACE;
  const { L, px } = raceScale();
  const X0 = 56, gA = 118, gB = 206, rulerY = 252;

  const posA = mode === "T" ? vA * Math.min(tau, T) : Math.min(vA * tau, S);
  const posB = mode === "T" ? vB * Math.min(tau, T) : Math.min(vB * tau, S);

  let g = "";

  /* 顶部计时牌 */
  g += `<rect x="${X0}" y="6" width="146" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>`;
  g += txt(X0 + 73, 24, `t = ${fmt(tau, 1)} s`, { size: 13.5, w: 700, a: "middle", fill: "#4338CA" });
  g += txt(X0 + 158, 24,
    mode === "T" ? `两车同时出发，运动时间都是 ${fmt1(T)} s` : `两车跑同一段 ${S} m，看谁先到`,
    { size: 12, fill: CL.ink3 });

  /* 两条赛道 */
  const lanes = [
    { name: "甲", v: vA, pos: posA, gy: gA, color: CL.blue,  arrive: S / vA },
    { name: "乙", v: vB, pos: posB, gy: gB, color: CL.amber, arrive: S / vB }
  ];
  lanes.forEach(ln => {
    const xEnd = X0 + ln.pos * px;
    g += `<line x1="${X0 - 42}" y1="${ln.gy}" x2="${round(X0 + L * px + 12, 2)}" y2="${ln.gy}"`
      + ` stroke="${CL.slate}" stroke-width="2.4"/>`;
    g += txt(X0 - 50, ln.gy + 5, ln.name, { size: 15, w: 700, fill: ln.color });
    g += txt(X0 - 52, ln.gy + 21, fmt1(ln.v) + " m/s", { size: 11, fill: CL.ink3 });
    g += car(xEnd, ln.gy, 1, ln.color);
    g += bracket(X0, xEnd, ln.gy - 60, `s = ${fmt(ln.pos, 1)} m`, ln.color);
    /* 到达终点：打勾并标出用时 */
    if (mode === "S" && ln.pos >= S - 1e-9) {
      g += txt(xEnd + 34, ln.gy - 12, `✓ 用时 ${fmt(ln.arrive, 2)} s`, { size: 12, w: 700, fill: CL.green });
    }
  });

  /* 同一终点线（办法 B） */
  if (mode === "S") {
    const X = X0 + S * px;
    g += `<line x1="${round(X, 2)}" y1="46" x2="${round(X, 2)}" y2="${rulerY}"`
      + ` stroke="${CL.red}" stroke-width="2" stroke-dasharray="6 4"/>`;
    g += txt(X, 40, `终点 ${S} m`, { size: 12, w: 700, a: "middle", fill: CL.red });
  }

  /* 共用刻度尺 */
  g += rulerX({ x0: X0, L, px, y: rulerY });

  return svgWrap({
    content: g, w: X0 + L * px + 30, h: rulerY + 30,
    pad: 16, padTop: 14, maxW: 640
  });
}

/* ---------------- 结论 ---------------- */
function raceRead() {
  const { vA, vB, T, S, mode } = RACE;
  let concl;

  if (mode === "T") {
    const sA = vA * T, sB = vB * T;
    concl = Math.abs(sA - sB) < 1e-9
      ? "相同时间内两车通过的路程一样长 → <b>一样快</b>"
      : `相同时间内，<b>${sA > sB ? "甲" : "乙"}</b>通过的路程更长 → <b>${sA > sB ? "甲" : "乙"}运动得快</b>`;
  } else {
    const tA = S / vA, tB = S / vB;
    concl = Math.abs(tA - tB) < 1e-9
      ? "通过相同路程两车用时相同 → <b>一样快</b>"
      : `通过相同路程，<b>${tA < tB ? "甲" : "乙"}</b>用时更短 → <b>${tA < tB ? "甲" : "乙"}运动得快</b>`;
  }

  return `<div class="verdict ok">${concl}</div>`;
}

/* ---------------- 重绘 ---------------- */
function raceDraw() {
  const st = $("#raceStage");
  if (!st) return;
  st.innerHTML = raceScene();
  $("#raceRead").innerHTML = raceRead();
  $("#rTv").textContent = fmt1(RACE.T);
  $("#rSv").textContent = String(RACE.S);
  $("#rAv").textContent = fmt1(RACE.vA);
  $("#rBv").textContent = fmt1(RACE.vB);

  const TOT = raceTOT();
  $("#rNote").innerHTML = RACE.playing
    ? `<span class="play-state">动画播放中…</span>　真实物理时长 ${fmt(TOT, 2)} s`
    : `为便于观察，播放时动画被压缩到 ${fmt(clamp(TOT, 2.2, 6), 1)} s（相对快慢不变）。`;
}

/* ---------------- 播放 ---------------- */
function raceStop() {
  if (RACE.raf) { cancelAnimationFrame(RACE.raf); RACE.raf = null; }
  RACE.playing = false;
  const b = $("#rPlay");
  if (b) b.textContent = "▶ 播放";
}

function racePlay() {
  if (RACE.playing) { raceStop(); RACE.tau = raceTOT(); raceDraw(); return; }
  const TOT = raceTOT();
  const wall = clamp(TOT, 2.2, 6) * 1000;
  RACE.playing = true;
  $("#rPlay").textContent = "⏸ 暂停";
  const t0 = performance.now();
  const step = now => {
    const p = clamp((now - t0) / wall, 0, 1);
    RACE.tau = p * TOT;
    raceDraw();
    if (p < 1) RACE.raf = requestAnimationFrame(step);
    else { raceStop(); RACE.tau = TOT; raceDraw(); }
  };
  RACE.raf = requestAnimationFrame(step);
}

/* ---------------- 初始化 ---------------- */
function initRace() {
  const ctrl = $("#raceCtrl");
  if (!ctrl) return;

  ctrl.innerHTML = `
    <div class="seg" id="rMode">
      <button class="seg-b on" data-m="T">办法 A：相同时间比路程</button>
      <button class="seg-b" data-m="S">办法 B：相同路程比时间</button>
    </div>
    <div class="ctrl-block" id="rRowT">
      <div class="slider-row">
        <label>运动时间 T：<b id="rTv">4.0</b> s　<span class="hint">两车跑同样久</span></label>
        <input type="range" id="rT" min="2" max="8" step="0.5" value="4">
      </div>
    </div>
    <div class="ctrl-block" id="rRowS" style="display:none">
      <div class="slider-row">
        <label>相同路程 S：<b id="rSv">20</b> m　<span class="hint">两车都跑到这一条线</span></label>
        <input type="range" id="rS" min="6" max="30" step="1" value="20">
      </div>
    </div>
    <div class="ctrl-block">
      <div class="slider-row">
        <label>甲车速度 v甲：<b id="rAv">6.0</b> m/s</label>
        <input type="range" id="rA" min="1" max="10" step="0.5" value="6">
      </div>
      <div class="slider-row">
        <label>乙车速度 v乙：<b id="rBv">4.0</b> m/s</label>
        <input type="range" id="rB" min="1" max="10" step="0.5" value="4">
      </div>
    </div>
    <div class="quick">
      <button class="btn-sm primary" id="rPlay">▶ 播放</button>
      <button class="btn-sm" id="rReset">跳到结束状态</button>
      <button class="btn-sm" data-swap="1">让乙反超</button>
    </div>
    <div class="note" id="rNote"></div>`;

  const setMode = m => {
    RACE.mode = m;
    $$("#rMode .seg-b").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    $("#rRowT").style.display = m === "T" ? "" : "none";
    $("#rRowS").style.display = m === "S" ? "" : "none";
    raceStop();
    RACE.tau = raceTOT();
    raceDraw();
  };

  $$("#rMode .seg-b").forEach(b => { b.onclick = () => setMode(b.dataset.m); });
  $("#rT").oninput = e => { raceStop(); RACE.T = +e.target.value; RACE.tau = raceTOT(); raceDraw(); };
  $("#rS").oninput = e => { raceStop(); RACE.S = +e.target.value; RACE.tau = raceTOT(); raceDraw(); };
  $("#rA").oninput = e => { raceStop(); RACE.vA = +e.target.value; RACE.tau = raceTOT(); raceDraw(); };
  $("#rB").oninput = e => { raceStop(); RACE.vB = +e.target.value; RACE.tau = raceTOT(); raceDraw(); };
  $("#rPlay").onclick = racePlay;
  $("#rReset").onclick = () => { raceStop(); RACE.tau = raceTOT(); raceDraw(); };
  $$('#raceCtrl [data-swap]').forEach(b => {
    b.onclick = () => {
      const t = RACE.vA; RACE.vA = RACE.vB; RACE.vB = t;
      $("#rA").value = RACE.vA; $("#rB").value = RACE.vB;
      raceStop(); RACE.tau = raceTOT(); raceDraw();
    };
  });

  RACE.tau = raceTOT();
  raceDraw();
}
</script>
<script>
/* ---------- speed.js ---------- */
/* ============================================================
   speed.js —— 探究②：速度到底是个什么数？

   核心可视化：把总路程 s 按时间 t 等分成 t 份，
   **每一份的长度就是 1 秒内通过的路程 —— 它就是速度 v = s/t**。

   · 只改 s（t 不变）→ 份数不变，每份变长 → v 变大
   · 只改 t（s 不变）→ 份数变多，每份变短 → v 变小
   · 锁定 v（匀速）   → 时间变几倍，路程也变几倍，每份长度纹丝不动
   最后一条直接把学生送到「匀速直线运动」的门口。
   ============================================================ */

const SPD = {
  s: 30,        // 总路程 m
  t: 5,         // 总时间 s（等分份数，整数）
  lock: false,  // 是否锁定速度（让 s 与 t 成正比）
  vLock: 6      // 锁定时的速度值
};

const SPD_MAX_S = 60;   // 画幅最多表示 60 m
const SPD_W = 470;

function spdV() { return SPD.s / SPD.t; }

/* ---------------- 场景绘制 ---------------- */
function speedScene() {
  const s = SPD.s, t = SPD.t, v = spdV();
  const X0 = 30, px = SPD_W / SPD_MAX_S;
  const bw = s * px, cell = bw / t;
  const by = 46, bh = 44;

  let g = "";
  g += txt(X0, 22, `总路程 s = ${fmt1(s)} m　÷　总时间 t = ${t} s`, { size: 13.5, w: 600, fill: CL.ink2 });

  /* 每份的长度标注（份太窄时只在第一份上标） */
  for (let i = 0; i < t; i++) {
    if (cell < 34 && i !== 0) continue;
    const xa = X0 + i * cell;
    g += txt(xa + cell / 2, 38, (i === 0 ? fmt(v, 2) + " m" : fmt(v, 2)),
      { size: 11.5, w: 700, a: "middle", fill: CL.purple });
  }

  /* 路程条 + 等分线 */
  g += `<rect x="${X0}" y="${by}" width="${round(bw, 2)}" height="${bh}" rx="6"`
    + ` fill="#EEF2FF" stroke="${CL.blue}" stroke-width="1.6"/>`;
  for (let i = 1; i < t; i++) {
    const X = X0 + i * cell;
    g += `<line x1="${round(X, 2)}" y1="${by}" x2="${round(X, 2)}" y2="${by + bh}"`
      + ` stroke="${CL.blue}" stroke-width="1.4"/>`;
  }
  if (bw > 150) {
    g += txt(X0 + bw / 2, by + bh / 2 + 5, `平均分成 ${t} 份`, { size: 12, a: "middle", fill: CL.blueD, w: 600 });
  }

  /* 时间轴 */
  const ty = by + bh + 14;
  g += `<line x1="${X0}" y1="${ty}" x2="${round(X0 + bw, 2)}" y2="${ty}" stroke="${CL.ink3}" stroke-width="1.2"/>`;
  for (let i = 0; i <= t; i++) {
    const X = X0 + i * cell;
    g += `<line x1="${round(X, 2)}" y1="${ty}" x2="${round(X, 2)}" y2="${ty + 5}" stroke="${CL.ink3}" stroke-width="1.2"/>`;
    if (i === 0) g += txt(X, ty + 18, "0", { size: 11, a: "middle", fill: CL.ink3 });
    else if (i === t || cell >= 28) g += txt(X, ty + 18, `${i} s`, { size: 11, a: "middle", fill: CL.ink3 });
  }
  g += txt(X0 + bw + 12, ty + 18, "t", { size: 12, a: "start", fill: CL.ink2, w: 600 });

  /* 结论 */
  g += txt(X0, 168, `每 1 秒通过 ${fmt(v, 2)} m　→　v = s / t = ${fmt(v, 2)} m/s`,
    { size: 14, w: 700, fill: CL.purple });
  g += txt(X0, 190, `= ${fmt(v * 3.6, 1)} km/h　（换算：1 m/s = 3.6 km/h）`, { size: 13, fill: CL.ink2 });

  return svgWrap({
    content: g, w: X0 + SPD_W + 30, h: 202,
    pad: 16, padTop: 14, maxW: 640
  });
}

/* ---------------- 重绘 ---------------- */
function speedDraw() {
  const st = $("#speedStage");
  if (!st) return;
  st.innerHTML = speedScene();
  $("#pSv").textContent = fmt1(SPD.s);
  $("#pTv").textContent = String(SPD.t);
  $("#pS").value = Math.round(SPD.s);
  $("#pT").value = SPD.t;
}

/* ---------------- 锁定速度 ---------------- */
function spdApplyLock() {
  const el = $("#pLock"), sl = $("#pS");
  el.classList.toggle("on", SPD.lock);
  el.textContent = SPD.lock ? "🔓 解除锁定" : "🔒 锁定速度（让物体匀速）";
  sl.disabled = SPD.lock;
  if (SPD.lock) {
    SPD.vLock = spdV();
    /* 保证 s = v·t 始终落在画幅内 */
    const tMin = Math.max(1, Math.ceil(5 / SPD.vLock));
    const tMax = Math.min(10, Math.floor(SPD_MAX_S / SPD.vLock));
    $("#pT").min = Math.max(1, tMin);
    $("#pT").max = Math.max(tMin, tMax);
    if (SPD.t < tMin) SPD.t = tMin;
    if (SPD.t > tMax) SPD.t = tMax;
    SPD.s = SPD.vLock * SPD.t;
    $("#spdHint").innerHTML = `已锁定 v = <b>${fmt(SPD.vLock, 2)} m/s</b>：现在拖动时间 t，路程 s 会自动跟着变，注意每一份的长度不动。`;
  } else {
    $("#pT").min = 1; $("#pT").max = 10;
    $("#spdHint").innerHTML = "";
  }
  speedDraw();
}

/* ---------------- 初始化 ---------------- */
function initSpeed() {
  const ctrl = $("#speedCtrl");
  if (!ctrl) return;

  ctrl.innerHTML = `
    <div class="ctrl-block">
      <div class="slider-row">
        <label>路程 s：<b id="pSv">30</b> m　<span class="hint">把条子拉长</span></label>
        <input type="range" id="pS" min="5" max="60" step="1" value="30">
      </div>
      <div class="slider-row">
        <label>时间 t：<b id="pTv">5</b> s　<span class="hint">把条子切成几份</span></label>
        <input type="range" id="pT" min="1" max="10" step="1" value="5">
      </div>
    </div>
    <div class="quick">
      <button class="btn-sm primary" id="pLock">🔒 锁定速度（让物体匀速）</button>
      <button class="btn-sm" data-spd="1.1">步行 1.1</button>
      <button class="btn-sm" data-spd="5">自行车 5.0</button>
      <button class="btn-sm" data-spd="8.3">市区汽车 8.3</button>
    </div>
    <div class="note" id="spdHint"></div>`;

  $("#pS").oninput = e => { SPD.s = +e.target.value; speedDraw(); };
  $("#pT").oninput = e => {
    SPD.t = +e.target.value;
    if (SPD.lock) SPD.s = SPD.vLock * SPD.t;   // 锁定时路程随成正比变化
    speedDraw();
  };
  $("#pLock").onclick = () => { SPD.lock = !SPD.lock; spdApplyLock(); };
  $$("#speedCtrl [data-spd]").forEach(b => {
    b.onclick = () => {
      const v = +b.dataset.spd;
      /* 选一对整数（s, t），使 s/t 恰好等于该速度 */
      const cand = [[11, 10], [30, 6], [50, 6], [25, 5], [12, 5], [22, 4]];
      let best = cand[0], err = Infinity;
      cand.forEach(c => { const e = Math.abs(c[0] / c[1] - v); if (e < err) { err = e; best = c; } });
      SPD.lock = false; SPD.s = best[0]; SPD.t = best[1];
      spdApplyLock();
    };
  });

  speedDraw();
}
</script>
<script>
/* ---------- uniform.js ---------- */
/* ============================================================
   uniform.js —— 探究③：匀速还是变速？

   模型：把 3 s 分成 6 个 0.5 s，每一段内速度恒定（v1…v6 可单独拖动）。
     Δs_i = v_i · Δt        x_i = Σ Δs        S = x_6
   于是可以三处对照看同一件事：
     · 轨道上的频闪点：相邻点间距是否相等
     · s-t 图：是「一条倾斜直线」还是「折线」
     · v-t 图：是「一条水平直线」还是「台阶」，且围成的面积 = 路程

   任意相等时间内通过的路程都相等 → 匀速直线运动（沿直线、快慢不变）
   ============================================================ */

const UNI = {
  v: [3, 3, 3, 3, 3, 3],   // 6 段速度，m/s
  DT: 0.5,                 // 每段时间，s
  tau: 3,                  // 当前时刻；默认停在终态
  playing: false, raf: null
};
const UNI_N = 6;
const UNI_T = () => UNI_N * UNI.DT;          // 总时间 3.0 s

/* 各时刻的位置：X[0]=0 … X[6]=总路程 */
function uniPos() {
  const X = [0];
  for (let i = 0; i < UNI_N; i++) X.push(X[i] + UNI.v[i] * UNI.DT);
  return X;
}
function uniS() { return uniPos()[UNI_N]; }

/* 任意时刻的位置（分段匀速积分） */
function uniPosAt(tau) {
  const X = uniPos();
  const k = clamp(Math.floor(tau / UNI.DT + 1e-9), 0, UNI_N - 1);
  const rem = clamp(tau - k * UNI.DT, 0, UNI.DT);
  return X[k] + UNI.v[k] * rem;
}

function uniIsUniform() {
  return UNI.v.every(x => Math.abs(x - UNI.v[0]) < 1e-6);
}

/* ---------------- 轨道 + 频闪点 ---------------- */
function uniScene() {
  const X = uniPos(), S = X[UNI_N], tau = UNI.tau;
  const L = Math.max(S * 1.10, 6);
  const X0 = 56, W = 470, px = W / L, gy = 104;
  const uni = uniIsUniform();
  const dotCol = uni ? CL.green : CL.purple;

  let g = "";
  g += txt(X0 - 52, 22, "频闪记录：每隔 0.5 s 记一次位置", { size: 12.5, w: 600, fill: CL.ink2 });

  /* 轨道（直线路径） */
  g += `<line x1="${X0 - 44}" y1="${gy}" x2="${round(X0 + L * px + 10, 2)}" y2="${gy}" stroke="${CL.slate}" stroke-width="2.4"/>`;
  g += `<line x1="${X0}" y1="${gy - 16}" x2="${X0}" y2="${gy + 8}" stroke="${CL.ink}" stroke-width="2"/>`;
  g += txt(X0, gy - 22, "起点", { size: 11, a: "middle", fill: CL.ink3 });

  /* 频闪点：只显示已经发生的时刻 */
  const shown = [];
  for (let i = 0; i <= UNI_N; i++) if (i * UNI.DT <= tau + 1e-9) shown.push(i);
  const lastShown = shown[shown.length - 1];
  shown.forEach(i => {
    const cx = X0 + X[i] * px;
    g += `<circle cx="${round(cx, 2)}" cy="${gy}" r="5" fill="${dotCol}" stroke="#fff" stroke-width="1.6"/>`;
    const wide = i < UNI_N && (X[i + 1] - X[i]) * px >= 26;
    if (i === 0 || i === lastShown || wide) {
      g += txt(cx, gy + 20, String(i), { size: 10.5, a: "middle", fill: CL.ink3 });
    }
  });

  /* 相邻点间距括注 */
  for (let i = 1; i < shown.length; i++) {
    const xa = X0 + X[i - 1] * px, xb = X0 + X[i] * px, d = X[i] - X[i - 1];
    const y = gy + 40;
    g += `<line x1="${round(xa, 2)}" y1="${y}" x2="${round(xb, 2)}" y2="${y}" stroke="${dotCol}" stroke-width="1.5"/>`;
    g += `<line x1="${round(xa, 2)}" y1="${y - 5}" x2="${round(xa, 2)}" y2="${y + 5}" stroke="${dotCol}" stroke-width="1.5"/>`;
    g += `<line x1="${round(xb, 2)}" y1="${y - 5}" x2="${round(xb, 2)}" y2="${y + 5}" stroke="${dotCol}" stroke-width="1.5"/>`;
    if (d * px >= 34) g += txt((xa + xb) / 2, y - 8, fmt(d, 2), { size: 10.5, a: "middle", fill: dotCol, w: 700 });
  }

  /* 小车 */
  g += car(X0 + uniPosAt(tau) * px, gy, 1, CL.blue);

  /* 总路程 */
  g += bracket(X0, X0 + S * px, gy + 74, `总路程 S = ${fmt(S, 2)} m`, CL.blue);

  /* 匀速时点一下题 */
  if (uni && tau >= UNI_T() - 1e-9) {
    g += txt(X0 + S * px / 2, gy + 96, "各段间距都相等 → 任意相等时间内路程相等", { size: 12, a: "middle", fill: CL.green, w: 700 });
  }

  return svgWrap({ content: g, w: X0 + L * px + 30, h: gy + 108, pad: 16, padTop: 14, maxW: 640 });
}

/* ---------------- s-t 图 ---------------- */
function uniChartST() {
  const X = uniPos(), T = UNI_T(), S = X[UNI_N], tau = UNI.tau;
  const uni = uniIsUniform();
  const yMax = Math.max(4, Math.ceil(S * 1.15 * 2) / 2);
  const yStep = yMax > 12 ? 4 : (yMax > 6 ? 2 : 1);
  const A = axes({
    x: 48, y: 18, w: 218, h: 148,
    xMin: 0, xMax: T, yMin: 0, yMax: yMax,
    xStep: 0.5, yStep,
    xLabel: "t / s", yLabel: "s / m",
    xFmt: v => fmt(v, 1), yFmt: v => fmt(v, 0)
  });

  /* 折线（只画到当前时刻） */
  const pts = [[0, 0]];
  let lastT = 0;
  for (let i = 1; i <= UNI_N; i++) {
    if (i * UNI.DT <= tau + 1e-9) { pts.push([i * UNI.DT, X[i]]); lastT = i * UNI.DT; }
  }
  if (tau > lastT + 1e-9) pts.push([tau, uniPosAt(tau)]);

  let g = A.markup;
  g += `<path d="${polyPath(pts, A.X, A.Y)}" fill="none" stroke="${uni ? CL.green : CL.blue}" stroke-width="2.4" stroke-linejoin="round"/>`;
  pts.forEach(p => {
    g += `<circle cx="${round(A.X(p[0]), 2)}" cy="${round(A.Y(p[1]), 2)}" r="3.2" fill="${uni ? CL.green : CL.blue}"/>`;
  });
  g += txt(A.x + A.w / 2, A.y - 2, "s-t 图像", { size: 12, a: "middle", fill: CL.ink2, w: 700 });
  if (uni && tau >= T - 1e-9) {
    g += txt(A.x + A.w / 2, A.y + A.h - 10, "一条过原点直线，斜率 = v", { size: 10.5, a: "middle", fill: CL.green, w: 700 });
  }
  return svgWrap({ content: g, w: A.x + A.w + 30, h: A.y + A.h + 46, pad: 14, padTop: 14, maxW: 330 });
}

/* ---------------- v-t 图 ---------------- */
function uniChartVT() {
  const T = UNI_T(), tau = UNI.tau, uni = uniIsUniform();
  const A = axes({
    x: 48, y: 18, w: 218, h: 148,
    xMin: 0, xMax: T, yMin: 0, yMax: 6.5,
    xStep: 0.5, yStep: 1,
    xLabel: "t / s", yLabel: "v /(m·s⁻¹)",
    xFmt: v => fmt(v, 1), yFmt: v => fmt(v, 0)
  });

  let g = A.markup;

  /* 面积（= 路程）：逐段矩形 */
  for (let i = 0; i < UNI_N; i++) {
    const t1 = i * UNI.DT, t2 = Math.min((i + 1) * UNI.DT, tau);
    if (t2 <= t1 + 1e-9) continue;
    const xa = A.X(t1), xb = A.X(t2), yv = A.Y(UNI.v[i]);
    g += `<rect x="${round(xa, 2)}" y="${round(yv, 2)}" width="${round(xb - xa, 2)}"`
      + ` height="${round(A.Y(0) - yv, 2)}" fill="${uni ? CL.green : CL.amber}" fill-opacity=".22"/>`;
  }

  /* 阶梯线 */
  const pts = [];
  for (let i = 0; i < UNI_N; i++) {
    const t1 = i * UNI.DT, t2 = (i + 1) * UNI.DT;
    if (t1 > tau + 1e-9) break;
    pts.push([t1, UNI.v[i]]);
    if (t2 <= tau + 1e-9) pts.push([t2, UNI.v[i]]);
    else pts.push([tau, UNI.v[i]]);
  }
  if (pts.length) {
    g += `<path d="${polyPath(pts, A.X, A.Y)}" fill="none" stroke="${uni ? CL.green : CL.amber}" stroke-width="2.4"/>`;
  }

  g += txt(A.x + A.w / 2, A.y - 2, "v-t 图像", { size: 12, a: "middle", fill: CL.ink2, w: 700 });
  if (uni && tau >= T - 1e-9) {
    g += txt(A.x + A.w / 2, A.y + A.h - 10, "一条水平直线", { size: 10.5, a: "middle", fill: CL.green, w: 700 });
  }
  return svgWrap({ content: g, w: A.x + A.w + 30, h: A.y + A.h + 46, pad: 14, padTop: 14, maxW: 330 });
}

/* ---------------- 判定 ---------------- */
function uniRead() {
  const uni = uniIsUniform();
  return uni
    ? `<div class="verdict ok">✔ 各段间距都相等 → <b>任意相等时间内通过的路程都相等</b> → 这是<b>匀速直线运动</b>（路径是直线，快慢也不变）。</div>`
    : `<div class="verdict no">✘ 各段间距不相等 → 相等时间内通过的路程不等 → 这是<b>变速直线运动</b>。s-t 图不再是直线，v-t 图不再是水平线。</div>`;
}

/* ---------------- 重绘 / 播放 ---------------- */
function uniDraw() {
  const st = $("#uniStage");
  if (!st) return;
  st.innerHTML = uniScene();
  $("#chartST").innerHTML = uniChartST();
  $("#chartVT").innerHTML = uniChartVT();
  $("#uniRead").innerHTML = uniRead();
  $("#uTau").textContent = fmt(UNI.tau, 2);
}

function uniStop() {
  if (UNI.raf) { cancelAnimationFrame(UNI.raf); UNI.raf = null; }
  UNI.playing = false;
  const b = $("#uPlay");
  if (b) b.textContent = "▶ 播放一遍";
}

function uniPlay() {
  if (UNI.playing) { uniStop(); UNI.tau = UNI_T(); uniDraw(); return; }
  const T = UNI_T(), wall = 4500;   // 3 s 物理时间慢放成 4.5 s
  UNI.playing = true;
  $("#uPlay").textContent = "⏸ 暂停";
  UNI.tau = 0;
  const t0 = performance.now();
  const step = now => {
    const p = clamp((now - t0) / wall, 0, 1);
    UNI.tau = p * T;
    uniDraw();
    if (p < 1) UNI.raf = requestAnimationFrame(step);
    else { uniStop(); UNI.tau = T; uniDraw(); }
  };
  UNI.raf = requestAnimationFrame(step);
}

/* ---------------- 初始化 ---------------- */
function initUniform() {
  const ctrl = $("#uniCtrl");
  if (!ctrl) return;

  ctrl.innerHTML = `
    <div class="quick">
      <button class="btn-sm" data-pre="3,3,3,3,3,3">匀速</button>
      <button class="btn-sm" data-pre="1,2,3,4,5,6">越来越快</button>
      <button class="btn-sm" data-pre="6,5,4,3,2,1">越来越慢</button>
      <button class="btn-sm" data-pre="6,6,3,3,6,6">快—慢—快</button>
    </div>
    <div class="quick">
      <button class="btn-sm primary" id="uPlay">▶ 播放一遍</button>
      <button class="btn-sm" id="uEnd">跳到结束状态</button>
      <span class="note" style="margin:0;align-self:center">当前时刻 <b id="uTau">3.00</b> s</span>
    </div>`;

  $$("#uniCtrl [data-pre]").forEach(b => {
    b.onclick = () => {
      UNI.v = b.dataset.pre.split(",").map(Number);
      uniStop(); UNI.tau = UNI_T(); uniDraw();
    };
  });
  $("#uPlay").onclick = uniPlay;
  $("#uEnd").onclick = () => { uniStop(); UNI.tau = UNI_T(); uniDraw(); };

  uniDraw();
}
</script>
<script>
/* ---------- strobe.js ---------- */
/* ============================================================
   strobe.js —— 探究④：同屏两车的频闪照片，点距就是快慢

   模型：A、B 两车各自做匀速直线运动，速度 vA / vB 恒定。
   频闪照相机每隔 Δt 闪一次光（全程 T = 3 s），把每次曝光瞬间
   小车的位置叠在同一张底片上 → 相邻两点间距 Δs = v · Δt。

   教学落点（对着本节难点：比值定义法 + "速度不变"的含义）：
     · Δt 被闪光间隔固定成一样 → 照片上只剩长度可比：点距大的跑得快
     · 点距之比 = 速度之比：Δs_B / Δs_A = v_B / v_A，与 Δt 取多少无关
     · 改闪光间隔，两条点距一起变长变短，但比值不变
       → 快慢是物体本身的性质，不随拍照方式改变，所以要用 s/t 定义速度
   ============================================================ */

const STR = { vA: 2, vB: 5, dt: 0.5, tau: 3, playing: false, raf: null };
const STR_T = 3;                                        // 拍摄总时长，s
/* 曝光时刻：t = 0, Δt, 2Δt …（含起点这一次），照片上有几个点就是曝光了几次 */
const strShots = () => Math.floor(STR_T / STR.dt + 1e-9) + 1;
const strDS   = () => ({ a: STR.vA * STR.dt, b: STR.vB * STR.dt });

/* ---------------- 一条轨道：轨道线 + 频闪点 + 点距 + 小车 ---------------- */
function stroTrack(o) {
  const { v, gy, color, name, tau, dt, x0, px, W } = o;
  const d = v * dt, dpx = d * px;
  const nmax = Math.floor(tau / dt + 1e-9);
  const pos = i => x0 + v * dt * i * px;

  let g = "";
  /* 轨道 */
  g += `<line x1="${x0 - 46}" y1="${gy}" x2="${round(x0 + W + 8, 2)}" y2="${gy}" stroke="${CL.slate}" stroke-width="2.2"/>`;
  g += `<line x1="${x0}" y1="${gy - 13}" x2="${x0}" y2="${gy + 7}" stroke="${CL.ink}" stroke-width="2"/>`;
  g += txt(x0 - 52, gy + 4, name, { size: 12.5, w: 700, fill: color });

  /* 点距括注（点太密就只留最后一段） */
  const by = gy + 26;
  for (let i = 1; i <= nmax; i++) {
    const last = i === nmax;
    if (!last && dpx < 12) continue;
    const xa = pos(i - 1), xb = pos(i);
    const wd = last ? 2 : 1.4;
    g += `<line x1="${round(xa, 2)}" y1="${by}" x2="${round(xb, 2)}" y2="${by}" stroke="${color}" stroke-width="${wd}"/>`;
    g += `<line x1="${round(xa, 2)}" y1="${by - 5}" x2="${round(xa, 2)}" y2="${by + 5}" stroke="${color}" stroke-width="${wd}"/>`;
    g += `<line x1="${round(xb, 2)}" y1="${by - 5}" x2="${round(xb, 2)}" y2="${by + 5}" stroke="${color}" stroke-width="${wd}"/>`;
    if (last || dpx >= 34) g += txt((xa + xb) / 2, by - 8, fmt(d, 2), { size: 10.5, a: "middle", fill: color, w: 700 });
  }

  /* 频闪点：只显示已经闪光过的时刻 */
  for (let i = 0; i <= nmax; i++) {
    g += `<circle cx="${round(pos(i), 2)}" cy="${gy}" r="5" fill="${color}" stroke="#fff" stroke-width="1.6"/>`;
  }

  /* 小车（停在 tau 时刻的位置） */
  g += car(x0 + v * tau * px, gy, 1, color);
  return g;
}

/* ---------------- 主画面 ---------------- */
function stroScene() {
  const tau = STR.tau, dt = STR.dt, T = STR_T;
  const vmax = Math.max(STR.vA, STR.vB, 0.5);
  const L = Math.max(vmax * T * 1.05, 3);
  const x0 = 62, W = 470, px = W / L;
  const gyA = 96, gyB = 168;
  const d = strDS();

  let g = "";
  g += txt(x0 - 56, 20, `频闪照相机：每隔 ${fmt(dt, 2)} s 闪一次光，全程 ${fmt(T, 1)} s 共曝光 ${strShots()} 次`,
    { size: 12.5, w: 600, fill: CL.ink2 });

  /* 闪光瞬间的提示：tau 刚跨过某次闪光时亮一下 */
  const n = Math.floor(tau / dt + 1e-9);
  const vis = clamp(1 - (tau - n * dt) / Math.min(0.25, dt * 0.7), 0, 1);
  if (vis > 0.02) {
    g += `<rect x="${x0 - 56}" y="28" width="${round(W + 66, 2)}" height="${gyB - 28 + 12}" rx="12"`
      + ` fill="${CL.amber}" fill-opacity="${round(0.13 * vis, 2)}"/>`;
    g += txt(x0 - 46, 46, `⚡ 第 ${n + 1} 次闪光　t = ${fmt(n * dt, 2)} s`, { size: 12, w: 700, fill: CL.amber });
  }

  /* 两条轨道 */
  g += stroTrack({ v: STR.vA, gy: gyA, color: CL.blue,  name: "A 车", tau, dt, x0, px, W });
  g += stroTrack({ v: STR.vB, gy: gyB, color: CL.amber, name: "B 车", tau, dt, x0, px, W });

  /* 同屏对比：同一次闪光间隔内两车各走了多远 */
  g += txt(x0 - 56, 226, "同屏对比：同样一次闪光间隔 Δt 内，两车各走了多远", { size: 12, w: 600, fill: CL.ink2 });
  const bars = [
    { y: 236, len: d.a * px, color: CL.blue,  tag: "A", s: d.a },
    { y: 260, len: d.b * px, color: CL.amber, tag: "B", s: d.b }
  ];
  bars.forEach(b => {
    g += `<rect x="${x0}" y="${b.y}" width="${round(Math.max(b.len, 2), 2)}" height="15" rx="7"`
      + ` fill="${b.color}" fill-opacity=".9"/>`;
    g += txt(x0 - 8, b.y + 12, b.tag, { size: 12, w: 700, a: "end", fill: b.color });
    g += txt(x0 + b.len + 9, b.y + 12, `Δs = ${fmt(b.s, 2)} m`, { size: 11.5, w: 700, fill: b.color });
  });

  /* 比值一句话 */
  const k = STR.vA > 0 ? STR.vB / STR.vA : 0;
  g += txt(x0 - 56, 296,
    `点距比 Δs_B : Δs_A = ${fmt(d.b, 2)} : ${fmt(d.a, 2)} = ${fmt(k, 2)} : 1，正好等于速度比 v_B : v_A`,
    { size: 12, w: 700, fill: CL.purple });

  return svgWrap({ content: g, w: x0 + W + 30, h: 302, pad: 16, padTop: 14, maxW: 640 });
}

/* ---------------- 重绘 / 播放 ---------------- */
function stroDraw() {
  const st = $("#stroStage");
  if (!st) return;
  st.innerHTML = stroScene();
  $("#sVA").value = STR.vA;  $("#sLA").textContent = fmt1(STR.vA);
  $("#sVB").value = STR.vB;  $("#sLB").textContent = fmt1(STR.vB);
  $("#sDt").value = STR.dt;  $("#sLD").textContent = fmt(STR.dt, 2);
  $("#sLN").textContent = strShots();
  $("#sTau").textContent = fmt(STR.tau, 2);
}

function stroStop() {
  if (STR.raf) { cancelAnimationFrame(STR.raf); STR.raf = null; }
  STR.playing = false;
  const b = $("#sPlay");
  if (b) b.textContent = "▶ 播放一遍";
}

function stroPlay() {
  if (STR.playing) { stroStop(); STR.tau = STR_T; stroDraw(); return; }
  const T = STR_T, wall = 4500;      // 3 s 物理时间慢放成 4.5 s
  STR.playing = true;
  $("#sPlay").textContent = "⏸ 暂停";
  STR.tau = 0;
  const t0 = performance.now();
  const step = now => {
    const p = clamp((now - t0) / wall, 0, 1);
    STR.tau = p * T;
    stroDraw();
    if (p < 1) STR.raf = requestAnimationFrame(step);
    else { stroStop(); STR.tau = T; stroDraw(); }
  };
  STR.raf = requestAnimationFrame(step);
}

/* ---------------- 初始化 ---------------- */
function initStrobe() {
  const ctrl = $("#stroCtrl");
  if (!ctrl) return;

  ctrl.innerHTML = `
    <div class="slider-row">
      <label>A 车速度：<b id="sLA">2.0</b> m/s</label>
      <input type="range" id="sVA" min="0.5" max="6" step="0.5" value="2">
    </div>
    <div class="slider-row">
      <label>B 车速度：<b id="sLB">5.0</b> m/s</label>
      <input type="range" id="sVB" min="0.5" max="6" step="0.5" value="5">
    </div>
    <div class="slider-row">
      <label>闪光间隔 Δt：<b id="sLD">0.50</b> s　（全程 3 s 共曝光 <b id="sLN">7</b> 次）</label>
      <input type="range" id="sDt" min="0.25" max="1" step="0.25" value="0.5">
    </div>
    <div class="quick">
      <button class="btn-sm primary" id="sPlay">▶ 播放一遍</button>
      <button class="btn-sm" id="sEnd">跳到结束状态</button>
      <button class="btn-sm" data-pre="3,3">一样快</button>
      <button class="btn-sm" data-pre="1,6">快慢悬殊</button>
      <span class="note" style="margin:0;align-self:center">当前时刻 <b id="sTau">3.00</b> s</span>
    </div>
    <div class="formula">
      读照片的口诀：<b>闪光间隔相同 → 时间已经相等 → 只比点距</b>。
      点距 Δs = v · Δt，所以 <b>点距之比 = 速度之比</b>，与闪光间隔取多少无关。
    </div>`;

  $$("#stroCtrl [data-pre]").forEach(b => {
    b.onclick = () => {
      const [a, c] = b.dataset.pre.split(",").map(Number);
      STR.vA = a; STR.vB = c;
      stroStop(); STR.tau = STR_T; stroDraw();
    };
  });
  $("#sVA").oninput = e => { STR.vA = +e.target.value; stroStop(); STR.tau = STR_T; stroDraw(); };
  $("#sVB").oninput = e => { STR.vB = +e.target.value; stroStop(); STR.tau = STR_T; stroDraw(); };
  $("#sDt").oninput = e => { STR.dt = +e.target.value; stroStop(); STR.tau = STR_T; stroDraw(); };
  $("#sPlay").onclick = stroPlay;
  $("#sEnd").onclick  = () => { stroStop(); STR.tau = STR_T; stroDraw(); };

  stroDraw();
}
</script>
<script>
/* ---------- main.js ---------- */
/* ============================================================
   main.js —— 入口：初始化三个探究环节 + 导航跳转
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {

  initRace();     // ① 谁跑得快：比较快慢的两种方法
  initSpeed();    // ② 速度是个什么数：把路程按时间等分
  initUniform();  // ③ 匀速还是变速：频闪 + s-t / v-t 图像
  initStrobe();   // ④ 同屏两车频闪照片：点距就是快慢

  /* 顶部导航平滑滚动（scroll-margin-top 已在 CSS 里避开吸顶条） */
  $$(".nav-chip").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      const target = $(a.getAttribute("href"));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
});
</script>
