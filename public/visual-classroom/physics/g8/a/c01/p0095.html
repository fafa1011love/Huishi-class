<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音色与波形特征 · 交互式探究实验（人教版八年级 §2.2）</title>
<style>
:root{
  --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#EFF4FF;
  --green:#10B981; --amber:#F59E0B;
  --ink:#1F2937; --ink-2:#4B5563; --ink-3:#6B7280;
  --line:#E5E7EB; --bg:#F5F7FB; --card:#FFFFFF;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;
}

/* ---------- header ---------- */
.site-header{background:linear-gradient(120deg,#1D4ED8,#2563EB 55%,#3B82F6);color:#fff;padding:22px 0 24px;}
.header-inner{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.header-text h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.5px;}
.header-text p{margin:6px 0 0;font-size:13.5px;color:rgba(255,255,255,.86);}
.header-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.header-link{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 16px;font-size:13px;color:#fff;text-decoration:none;background:rgba(255,255,255,.08);white-space:nowrap;transition:.16s;}
.header-link:hover{background:rgba(255,255,255,.2);}
.header-badge{border-radius:999px;padding:7px 14px;font-size:12.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);white-space:nowrap;}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 30px;display:flex;flex-direction:column;gap:18px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;border:1px solid rgba(229,231,235,.7);}
.card h2{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;}
.card h2 .step{
  width:24px;height:24px;flex:none;border-radius:8px;background:var(--blue);color:#fff;
  font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;
}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start;}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr);}}

/* ---------- controls ---------- */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.seg button{flex:1;border:none;background:#fff;padding:11px 0;font-size:14.5px;cursor:pointer;font-family:inherit;color:var(--ink-2);border-right:1px solid var(--line);transition:.16s;}
.seg button:last-child{border-right:none;}
.seg button:hover{background:#F8FAFC;}
.seg button.active{color:#fff;font-weight:600;}
.seg button.active[data-inst="piano"]{background:#2563EB;}
.seg button.active[data-inst="guitar"]{background:#10B981;}
.seg button.active[data-inst="harmonica"]{background:#F59E0B;}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;padding:9px 18px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.16s;}
.btn:hover{background:var(--blue-l);}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 1px 2px rgba(37,99,235,.25);}
.btn.primary:hover{background:var(--blue-d);}

.note{font-size:12.5px;color:var(--ink-3);margin-top:12px;}
.note b{color:var(--ink-2);font-weight:600;}

/* ---------- 泛音配比条 ---------- */
.spec-box{margin-top:16px;}
.spec-title{font-size:12.5px;color:var(--ink-3);margin-bottom:8px;}
.spectrum{display:flex;align-items:flex-end;gap:8px;height:74px;}
.spectrum .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
.spectrum .bar{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .18s, background .18s;}
.spectrum .lb{font-size:10.5px;color:var(--ink-3);}

/* ---------- 波形屏 ---------- */
.scope-col svg{display:block;width:100%;height:auto;background:#F8FAFC;border:1px solid var(--line);border-radius:12px;}

/* ---------- 听音辨器（模块②） ---------- */
.quiz{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start;}
@media(max-width:820px){.quiz{grid-template-columns:minmax(0,1fr);}}
.quiz-opts{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
.quiz-opts button{
  flex:1;min-width:92px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px 0;
  font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink-2);transition:.16s;
}
.quiz-opts button:hover{background:#F8FAFC;}
.quiz-opts button.pick-ok{background:#ECFDF5;border-color:var(--green);color:#047857;font-weight:600;}
.quiz-opts button.pick-no{background:#FEF2F2;border-color:#FCA5A5;color:#B91C1C;}
.quiz-fb{font-size:13.5px;color:var(--ink-2);min-height:26px;}
.quiz-fb .ok{color:#047857;font-weight:600;}
.quiz-fb .no{color:#B91C1C;font-weight:600;}
.quiz-score{font-size:12.5px;color:var(--ink-3);margin-top:4px;}

.site-footer{text-align:center;padding:4px 0 30px;color:var(--ink-3);font-size:12.5px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-text">
      <h1>音色与波形特征</h1>
      <p>音调一样、响度一样，为什么还能听出是钢琴、吉他还是口琴？</p>
    </div>
    <div class="header-nav">
      <a class="header-link" href="#">« 返回实验目录</a>
      <span class="header-badge">八年级物理 · §2.2 声音的特性</span>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- 模块① -->
  <section class="card">
    <h2><span class="step">1</span>三种乐器：同音调、同响度，波形比一比</h2>
    <div class="grid2">
      <div>
        <div class="seg" id="seg1">
          <button data-inst="piano" class="active">钢琴</button>
          <button data-inst="guitar">吉他</button>
          <button data-inst="harmonica">口琴</button>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="play1">&#9654; 听这个音</button>
          <button class="btn" id="playSeq">&#9654; 依次听三个</button>
        </div>
        <div class="note">基音都是 <b>440 Hz</b>，响度调到一样大，波形也按<b>相同幅度</b>显示 —— 只剩<b>形状</b>不同。</div>
        <div class="spec-box">
          <div class="spec-title" id="specTitle">泛音配比 · 钢琴</div>
          <div class="spectrum" id="spec1"></div>
        </div>
      </div>
      <div class="scope-col">
        <svg id="scope1" viewBox="0 0 560 292"></svg>
      </div>
    </div>
  </section>

  <!-- 模块② -->
  <section class="card">
    <h2><span class="step">2</span>听音辨器：先听，猜完再认波形</h2>
    <div class="quiz">
      <div>
        <div class="btn-row" style="margin-top:0">
          <button class="btn primary" id="qPlay">&#9654; 随机播放一个音</button>
          <button class="btn" id="qReplay">&#128266; 再听一次</button>
        </div>
        <div class="quiz-opts" id="qOpts">
          <button data-inst="piano">钢琴</button>
          <button data-inst="guitar">吉他</button>
          <button data-inst="harmonica">口琴</button>
        </div>
        <div class="quiz-fb" id="qFb">先<b>听</b>声音，凭耳朵判断是哪种乐器，选完再看右边的波形。</div>
        <div class="quiz-score" id="qScore"></div>
      </div>
      <div class="scope-col">
        <svg id="scope3" viewBox="0 0 300 170"></svg>
      </div>
    </div>
  </section>

</div>

<footer class="site-footer">纯静态单文件 · 手写 SVG · 双击即可在浏览器中运行，无需服务器</footer>

<script>
/* ============================================================
   音色与波形特征（人教版八上 §2.2 声音的特性）
   三种乐器统一 f=440 Hz、统一显示幅度 —— 只让「波形形状」这一个量不同。
   ① 三条波形同屏对比  ② 先听后看（音色是听觉感受） ③ 拖动泛音配比连续改变音色
   发声：Web Audio 可加合成，每个泛音一个正弦振荡器 + 独立衰减包络。
   ============================================================ */
(function () {
"use strict";

/* ---------- 基础工具 ---------- */
function $(id) { return document.getElementById(id); }
var NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  if (attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
function clearN(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
function hh(id, html) { var e = $(id); if (e) e.innerHTML = html; }
function tx(id, v) { var e = $(id); if (e) e.textContent = v; }

/* ---------- 乐器数据：前 5 个分音（1f~5f）----------
   amps 决定分音强弱，phs 决定波形形状（同一组配比，相位不同形状也不同）*/
var NH = 5;
var KEYS = ["piano", "guitar", "harmonica"];
var INST = {
  piano:     { name: "钢琴", color: "#2563EB", amps: [1, 0.72, 0.50, 0.34, 0.22], phs: [0, 0, 0, 0, 0] },
  guitar:    { name: "吉他", color: "#10B981", amps: [1, 0.62, 0.38, 0.24, 0.15], phs: [0, -0.60, -1.20, -1.80, -2.40] },
  harmonica: { name: "口琴", color: "#F59E0B", amps: [1, 0.12, 0.55, 0.08, 0.30], phs: [0, 0, 0, 0, 0] }
};
var F0 = 440;                  // 统一音调：440 Hz
var PER = 2.5;                 // 波形窗口：显示 2.5 个周期
var NPTS = 360;                // 采样点数

/* ---------- 波形采样 + 路径 ---------- */
function sample(amps, phs, ph) {
  var ys = new Array(NPTS), mx = 1e-9, i, n, y, a;
  for (i = 0; i < NPTS; i++) {
    var th = ph + PER * 2 * Math.PI * i / (NPTS - 1);
    y = 0;
    for (n = 0; n < amps.length; n++) {
      a = amps[n];
      if (!a) continue;
      y += a * Math.sin((n + 1) * th + (phs ? phs[n] : 0));
    }
    ys[i] = y;
    a = Math.abs(y);
    if (a > mx) mx = a;
  }
  return { ys: ys, max: mx };
}
function pathOf(s, x0, x1, mid, amp) {
  var k = amp / s.max, d = "", i, x;
  for (i = 0; i < NPTS; i++) {
    x = x0 + (x1 - x0) * i / (NPTS - 1);
    d += (i ? "L" : "M") + x.toFixed(1) + " " + (mid - s.ys[i] * k).toFixed(1);
  }
  return d;
}

/* ---------- 泛音配比条 ---------- */
function makeBars(box, n) {
  box.innerHTML = "";
  var bars = [], i;
  for (i = 0; i < n; i++) {
    var col = document.createElement("div"); col.className = "col";
    var bar = document.createElement("div"); bar.className = "bar";
    var lb = document.createElement("div"); lb.className = "lb"; lb.textContent = (i + 1) + "f";
    col.appendChild(bar); col.appendChild(lb); box.appendChild(col);
    bars.push(bar);
  }
  return {
    set: function (vals, color) {
      var mx = 0, i;
      for (i = 0; i < n; i++) if (vals[i] > mx) mx = vals[i];
      if (mx < 1e-6) mx = 1;
      for (i = 0; i < n; i++) {
        bars[i].style.height = Math.max(3, vals[i] / mx * 56) + "px";
        bars[i].style.background = color;
      }
    }
  };
}

/* ============================================================
   发声引擎：每个分音一个正弦振荡器 + 独立衰减包络
   乐器辨识度 = ① 各分音强弱配比  ② 起音瞬态（带通噪声）
                ③ 高次分音衰减更快 ④ 口琴的颤音/振音
   ============================================================ */
var AE = (function () {
  var ctx = null, nb = null;
  function ac() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function noiseSrc(c) {
    if (!nb) {
      var L = Math.floor(c.sampleRate * 2);
      nb = c.createBuffer(1, L, c.sampleRate);
      var d = nb.getChannelData(0);
      for (var i = 0; i < L; i++) d[i] = Math.random() * 2 - 1;
    }
    var s = c.createBufferSource();
    s.buffer = nb; s.loop = true;
    return s;
  }
  var PEAK = 0.30;
  var PRESETS = {
    piano:     { dur: 2.2, attack: 0.004, tau: function (n) { return 3.6 / (1 + 0.45 * (n - 1)); }, noise: { lv: 0.20, f: 2600, q: 0.8, dec: 0.10 } },
    guitar:    { dur: 1.9, attack: 0.006, tau: function (n) { return 2.4 / (1 + 0.85 * (n - 1)); }, noise: { lv: 0.15, f: 1500, q: 1.2, dec: 0.06 } },
    harmonica: { dur: 2.4, attack: 0.050, tau: function () { return 1e6; },                noise: { lv: 0.05, f: 1100, q: 0.7, dec: null }, vib: { rate: 5.6, cents: 14 }, trem: { rate: 5.6, depth: 0.10 } }
  };

  function note(key, freq) {
    try {
    var c = ac(); if (!c) return;
    var cfg = PRESETS[key] || PRESETS.piano;
    var amps = INST[key] ? INST[key].amps : [1, 0, 0, 0, 0];
    var sum = 0, i;
    for (i = 0; i < amps.length; i++) sum += amps[i];
    if (sum < 1e-6) sum = 1;

    var out = c.createGain(); out.gain.value = 1; out.connect(c.destination);
    var bus = out;
    var garbage = [out];
    var dur = cfg.dur, t = c.currentTime;

    if (cfg.trem) {
      var tr = c.createGain(); tr.gain.value = 1; tr.connect(out); bus = tr; garbage.push(tr);
      var lfo = c.createOscillator(); lfo.frequency.value = cfg.trem.rate;
      var lg = c.createGain(); lg.gain.value = cfg.trem.depth;
      lfo.connect(lg); lg.connect(tr.gain); lfo.start(); garbage.push(lfo, lg);
    }

    var oscs = [], gs = [];
    for (i = 0; i < NH; i++) {
      var o = c.createOscillator(); o.type = "sine";
      o.frequency.value = freq * (i + 1);
      var g = c.createGain(); g.gain.value = 0.0001;
      o.connect(g); g.connect(bus); o.start();
      oscs.push(o); gs.push(g);
      var a = Math.max(0.0004, PEAK * amps[i] / sum);
      var atk = cfg.attack * (1 + 0.15 * i);
      var tail = Math.max(0.0001, a * Math.exp(-(dur - atk) / cfg.tau(i + 1)));
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(a, t + atk);
      g.gain.exponentialRampToValueAtTime(Math.max(0.00008, tail), t + dur);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.18);
    }
    if (cfg.vib) {
      var vlfo = c.createOscillator(); vlfo.frequency.value = cfg.vib.rate;
      var vg = c.createGain(); vg.gain.value = cfg.vib.cents;
      vlfo.connect(vg);
      for (i = 0; i < oscs.length; i++) vg.connect(oscs[i].detune);
      vlfo.start(); garbage.push(vlfo, vg);
    }
    if (cfg.noise) {
      var ns = noiseSrc(c);
      var bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = cfg.noise.f; bp.Q.value = cfg.noise.q;
      var ng = c.createGain(); ng.gain.value = 0.0001;
      ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start();
      var na = Math.max(0.0002, PEAK * cfg.noise.lv);
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.linearRampToValueAtTime(na, t + 0.005);
      if (cfg.noise.dec != null) {
        ng.gain.exponentialRampToValueAtTime(0.0001, t + cfg.noise.dec);
      } else {
        ng.gain.exponentialRampToValueAtTime(Math.max(0.0001, na * 0.5), t + dur);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.15);
      }
      garbage.push(ns, bp, ng);
    }
    setTimeout(function () {
      try {
        for (var j = 0; j < oscs.length; j++) { oscs[j].stop(); oscs[j].disconnect(); gs[j].disconnect(); }
        for (var k2 = 0; k2 < garbage.length; k2++) {
          var nd = garbage[k2];
          if (nd.stop) { try { nd.stop(); } catch (e2) {} }
          try { nd.disconnect(); } catch (e3) {}
        }
      } catch (e) {}
    }, (dur + 0.6) * 1000);
    } catch (e) {}
  }

  return { note: note };
})();

/* 发声容错：没有音频设备时也不能影响画面 */
function safeNote(k) { try { AE.note(k, F0); } catch (e) {} }

/* ============================================================
   模块①：三条波形同屏对比
   ============================================================ */
var S1 = (function () {
  var svg = $("scope1"), W = 560, H = 292, X0 = 62, X1 = 548;
  if (!svg) return { draw: function () {} };
  var TOP = 22, BOT = 278;
  var rows = KEYS.map(function (k, i) { return { k: k, y: 58 + i * 96, i: i }; });

  /* 周期标线：每条竖线间隔 1 个周期，三条波形共用同一套刻度 */
  var i2;
  for (i2 = 0; i2 <= 3; i2++) {
    var gx = X0 + (X1 - X0) * i2 / PER;
    if (gx > X1 + 0.5) break;
    svgEl("line", { x1: gx, y1: TOP, x2: gx, y2: BOT, stroke: "#DDE5EF", "stroke-width": 1, "stroke-dasharray": "4 4" }, svg);
  }
  svgEl("text", { x: X0 + (X1 - X0) / PER / 2, y: TOP - 6, "text-anchor": "middle", "font-size": 11, fill: "#94A3B8" }, svg).textContent = "一个周期 T = 1/440 s";

  var paths = {}, bgs = {}, labels = {};
  rows.forEach(function (r) {
    bgs[r.k] = svgEl("rect", {
      x: X0, y: r.y - 42, width: X1 - X0, height: 84, rx: 6,
      fill: r.i % 2 ? "#FBFCFE" : "#FFFFFF", stroke: "#EDF1F7"
    }, svg);
    labels[r.k] = svgEl("text", { x: 12, y: r.y + 4, "font-size": 12.5, fill: INST[r.k].color, "font-weight": 600 }, svg);
    labels[r.k].textContent = INST[r.k].name;
    svgEl("line", { x1: X0, y1: r.y, x2: X1, y2: r.y, stroke: "#CBD5E1", "stroke-width": 1, "stroke-dasharray": "5 5" }, svg);
    paths[r.k] = svgEl("path", { fill: "none", stroke: INST[r.k].color, "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  });
  svgEl("text", { x: X1, y: 14, "text-anchor": "end", "font-size": 11.5, fill: "#6B7280" }, svg).textContent = "f = 440 Hz ｜ 周期相同、幅度相同，只有形状不同";

  return {
    draw: function (activeKey) {
      rows.forEach(function (r) {
        var A = INST[r.k];
        var s = sample(A.amps, A.phs, 0);
        paths[r.k].setAttribute("d", pathOf(s, X0, X1, r.y, 33));
        var on = (r.k === activeKey);
        paths[r.k].setAttribute("stroke-width", on ? 2.9 : 1.8);
        paths[r.k].setAttribute("opacity", on ? 1 : 0.45);
        bgs[r.k].setAttribute("fill", on ? A.color + "14" : (r.i % 2 ? "#FBFCFE" : "#FFFFFF"));
        labels[r.k].setAttribute("font-size", on ? 13.5 : 12.5);
      });
    }
  };
})();

var bars1 = makeBars($("spec1"), NH);
var cur1 = "piano";
function setInst1(k) {
  cur1 = k;
  var bs = $("seg1").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("active", bs[i].getAttribute("data-inst") === k);
  bars1.set(INST[k].amps, INST[k].color);
  tx("specTitle", "泛音配比 · " + INST[k].name);
  try { S1.draw(cur1); } catch (e) {}
}
$("seg1").addEventListener("click", function (e) {
  var b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (!b) return;
  var k = b.getAttribute("data-inst");
  if (!INST[k]) return;
  setInst1(k);
  safeNote(k);
});
$("play1").addEventListener("click", function () { safeNote(cur1); });
var seqTimer = null;
$("playSeq").addEventListener("click", function () {
  clearTimeout(seqTimer);
  var i = 0;
  (function step() {
    if (i >= KEYS.length) return;
    safeNote(KEYS[i]);
    setInst1(KEYS[i]);
    i++;
    seqTimer = setTimeout(step, 1400);
  })();
});

/* ============================================================
   模块②：听音辨器（揭示前不显示波形）
   ============================================================ */
var S3 = (function () {
  var svg = $("scope3"), W = 300, H = 170;
  if (!svg) return { mask: function () {}, show: function () {} };
  svgEl("rect", { x: 0, y: 0, width: W, height: H, rx: 8, fill: "#F8FAFC" }, svg);
  var X0 = 26, X1 = 276, MID = 96;

  var gMask = svgEl("g", {}, svg);
  svgEl("rect", { x: X0, y: 34, width: X1 - X0, height: 84, rx: 8, fill: "#FFFFFF", stroke: "#DDE5EF", "stroke-width": 1.2, "stroke-dasharray": "6 5" }, gMask);
  svgEl("text", { x: (X0 + X1) / 2, y: 78, "text-anchor": "middle", "font-size": 30, fill: "#CBD5E1", "font-weight": 700 }, gMask).textContent = "?";
  svgEl("text", { x: (X0 + X1) / 2, y: 104, "text-anchor": "middle", "font-size": 11.5, fill: "#94A3B8" }, gMask).textContent = "猜完之后才揭晓";
  svgEl("text", { x: (X0 + X1) / 2, y: 148, "text-anchor": "middle", "font-size": 11, fill: "#94A3B8" }, gMask).textContent = "同样是 440 Hz，波形形状才是它的「指纹」";

  var gWave = svgEl("g", {}, svg);
  gWave.setAttribute("opacity", "0");
  svgEl("rect", { x: X0, y: 24, width: X1 - X0, height: 100, rx: 8, fill: "#FFFFFF", stroke: "#EDF1F7" }, gWave);
  svgEl("line", { x1: X0, y1: MID, x2: X1, y2: MID, stroke: "#CBD5E1", "stroke-width": 1, "stroke-dasharray": "5 5" }, gWave);
  var p = svgEl("path", { fill: "none", "stroke-width": 2.4, "stroke-linejoin": "round", "stroke-linecap": "round" }, gWave);
  var nm = svgEl("text", { x: (X0 + X1) / 2, y: 148, "text-anchor": "middle", "font-size": 13, "font-weight": 600 }, gWave);

  return {
    mask: function () { gWave.setAttribute("opacity", "0"); gMask.setAttribute("opacity", "1"); },
    show: function (k) {
      if (!INST[k]) return;
      var s = sample(INST[k].amps, INST[k].phs, 0);
      p.setAttribute("d", pathOf(s, X0 + 4, X1 - 4, MID, 38));
      p.setAttribute("stroke", INST[k].color);
      nm.setAttribute("fill", INST[k].color);
      nm.textContent = INST[k].name + "的波形（这就是音色）";
      gWave.setAttribute("opacity", "1");
      gMask.setAttribute("opacity", "0");
    }
  };
})();

var qAns = null, qRight = 0, qTotal = 0, qOpen = false;
function newRound() {
  qAns = KEYS[Math.floor(Math.random() * KEYS.length)];
  qOpen = true;
  S3.mask();
  var bs = $("qOpts").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) { bs[i].classList.remove("pick-ok"); bs[i].classList.remove("pick-no"); }
  hh("qFb", "正在播放其中一种乐器 —— 先<b>听</b>，再选答案。");
  safeNote(qAns);
}
$("qPlay").addEventListener("click", newRound);
$("qReplay").addEventListener("click", function () {
  if (qAns) safeNote(qAns);
  else newRound();
});
$("qOpts").addEventListener("click", function (e) {
  var b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (!b || !qOpen || !qAns) return;
  var pick = b.getAttribute("data-inst");
  var ok = (pick === qAns);
  qOpen = false;
  qTotal++;
  if (ok) qRight++;
  b.classList.add(ok ? "pick-ok" : "pick-no");
  if (!ok) {
    var cb = $("qOpts").querySelector('button[data-inst="' + qAns + '"]');
    if (cb) cb.classList.add("pick-ok");
  }
  S3.show(qAns);
  hh("qFb", ok
    ? "<span class='ok'>&#10003; 答对了</span> —— 这就是" + INST[qAns].name + "的波形。"
    : "<span class='no'>&#10007; 答错了</span> —— 正确答案是<b>" + INST[qAns].name + "</b>，看右边它的波形。");
  tx("qScore", "共答 " + qTotal + " 题 · 答对 " + qRight + " 题");
});

/* ---------- 初始化：两块画面都先同步画一帧 ---------- */
setInst1("piano");
S3.mask();

})();
</script>
