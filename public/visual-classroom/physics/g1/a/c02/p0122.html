<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刹车陷阱 · 匀减速直线运动动态演示</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --blue:#2563eb; --red:#dc2626; --green:#059669; --amber:#d97706;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--ink);
    padding:24px; display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  h1{font-size:22px; margin-bottom:2px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:6px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.06); padding:16px 20px; width:100%; max-width:980px;
  }
  .stage{padding:10px 16px 4px;}
  canvas{display:block; width:100%; height:auto;}
  /* 控制区 */
  .controls{display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:space-between;}
  .sliders{display:flex; gap:24px; flex-wrap:wrap; flex:1; min-width:380px;}
  .sl{display:flex; flex-direction:column; gap:4px; min-width:150px;}
  .sl label{font-size:13px; color:var(--ink);}
  .sl label b{color:var(--blue); font-variant-numeric:tabular-nums;}
  input[type=range]{width:170px; accent-color:var(--blue);}
  .btns{display:flex; gap:10px;}
  button{
    border:none; border-radius:8px; padding:9px 20px; font-size:14px; cursor:pointer;
    font-family:inherit; transition:filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  #btnStart{background:var(--blue); color:#fff;}
  #btnReset{background:#e5e7eb; color:var(--ink);}
  /* 对比区 */
  .compare{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){.compare{grid-template-columns:1fr;}}
  .panel{border-radius:10px; padding:14px 16px; font-size:14px; line-height:1.9;}
  .panel h3{font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; color:#fff;}
  .panel.ok{background:#ecfdf5; border:1px solid #a7f3d0;}
  .panel.ok .tag{background:var(--green);}
  .panel.bad{background:#fef2f2; border:1px solid #fecaca;}
  .panel.bad .tag{background:var(--red);}
  .panel .formula{font-family:"Cambria Math",Georgia,serif; font-size:15px;}
  .strike{color:var(--red); font-weight:bold;}
  .res{font-weight:bold; font-variant-numeric:tabular-nums;}
  .note{font-size:12.5px; color:var(--muted); margin-top:8px; border-top:1px dashed var(--line); padding-top:8px;}
  .verdict{font-size:14px; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:12px 16px; line-height:1.8;}
  .verdict b{color:var(--amber);}
</style>
</head>
<body>

<h1>🚗 刹车陷阱：匀减速直线运动演示</h1>
<div class="sub">器材：带阻尼制动小车 + 带刻度长轨道 &nbsp;|&nbsp; 物体停止后不会反向运动！</div>

<div class="card stage">
  <canvas id="cv" width="940" height="230"></canvas>
</div>

<div class="card controls">
  <div class="sliders">
    <div class="sl">
      <label>初速度 v₀ = <b id="v0Val">10</b> m/s</label>
      <input type="range" id="v0" min="4" max="16" step="1" value="10">
    </div>
    <div class="sl">
      <label>加速度大小 a = <b id="aVal">2</b> m/s²</label>
      <input type="range" id="a" min="1" max="5" step="0.5" value="2">
    </div>
    <div class="sl">
      <label>演示时间 t = <b id="tVal">8.0</b> s</label>
      <input type="range" id="t" min="2" max="10" step="0.5" value="8">
    </div>
  </div>
  <div class="btns">
    <button id="btnStart">▶ 开始制动</button>
    <button id="btnReset">↺ 重置</button>
  </div>
</div>

<div class="card compare">
  <div class="panel ok">
    <h3><span class="tag">✔ 正确解法</span>先求停止时间 t停 = v₀/a</h3>
    <div class="formula">t停 = v₀ / a = <span id="tStop"></span> s</div>
    <div>比较：演示时间 t 与 t停 → 实际运动时间 <b id="tEff"></b> s</div>
    <div class="formula">位移 x = v₀t − ½at² = <span class="res" id="xTrue" style="color:var(--green)"></span> m</div>
    <div class="note">小车在 t停 时刻停下，之后保持静止。</div>
  </div>
  <div class="panel bad">
    <h3><span class="tag">✘ 错误解法</span>直接把 t 代入位移公式</h3>
    <div class="formula">x' = v₀t − ½at² = <span class="res" id="xWrong" style="color:var(--red)"></span> m</div>
    <div id="wrongDesc"></div>
    <div class="note">若 x' &lt; 真实位移：说明小车早已停下，公式算出的"倒车距离"纯属虚构。</div>
  </div>
</div>

<div class="card verdict" id="verdict"></div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const v0In=document.getElementById('v0'), aIn=document.getElementById('a'), tIn=document.getElementById('t');
const W=cv.width, H=cv.height;
let running=false, tNow=0, raf=null, lastTs=null;

const pxPerM = 62;           // 比例尺
const railLeft = 70;         // 轨道起始像素
const carStartX = railLeft+30;

function params(){
  return {
    v0:+v0In.value, a:+aIn.value, t:+tIn.value,
    tStop:(+v0In.value)/(+aIn.value)
  };
}
function refreshLabels(){
  const p=params();
  document.getElementById('v0Val').textContent=p.v0;
  document.getElementById('aVal').textContent=p.a.toFixed(1);
  document.getElementById('tVal').textContent=p.t.toFixed(1);
  updatePanels();
}
function updatePanels(){
  const {v0,a,t,tStop}=params();
  const tEff=Math.min(t,tStop);
  const xTrue = v0*tEff - 0.5*a*tEff*tEff;
  const xWrong = v0*t - 0.5*a*t*t;
  document.getElementById('tStop').textContent=tStop.toFixed(2);
  document.getElementById('tEff').textContent=tEff.toFixed(2);
  document.getElementById('xTrue').textContent=xTrue.toFixed(2);
  document.getElementById('xWrong').textContent=xWrong.toFixed(2);
  const wd=document.getElementById('wrongDesc');
  if(t>tStop){
    wd.innerHTML='t = '+t.toFixed(1)+' s &gt; t停 = '+tStop.toFixed(2)+' s，<span class="strike">公式竟算出小车"倒退"</span>，x\' 比真实位移多算了 |x\'−x| = '+Math.abs(xWrong-xTrue).toFixed(2)+' m 的虚构"倒车"。';
  }else{
    wd.innerHTML='此时 t ≤ t停，尚未触发陷阱（试着把演示时间调大）。';
  }
  const vd=document.getElementById('verdict');
  if(t>tStop){
    vd.innerHTML='<b>⚠ 刹车陷阱触发！</b> 直接代入 t = '+t.toFixed(1)+' s 得 x\' = '+xWrong.toFixed(2)+' m，但小车早在 t = '+tStop.toFixed(2)+' s 就停下了，实际位移只有 x = '+xTrue.toFixed(2)+' m。多出的 '+Math.abs(xWrong-xTrue).toFixed(2)+' m 是公式虚构的"反向倒车"——匀减速刹车的物体停止后<b>不会反向运动</b>，必须先判断 t 与 t停 的关系！';
  }else{
    vd.innerHTML='当前 t = '+t.toFixed(1)+' s ≤ t停 = '+tStop.toFixed(2)+' s，小车仍在运动（或恰好停下），直接代公式暂时没问题。调大演示时间即可看到陷阱。';
  }
}

function draw(){
  const {v0,a,t,tStop}=params();
  const tEff = running||tNow>0 ? Math.min(tNow,t,tStop) : 0;
  const tt = running||tNow>0 ? tEff : 0;
  const x = v0*tt - 0.5*a*tt*tt;
  const v = running||tNow>0 ? Math.max(0, v0-a*tt) : v0;

  ctx.clearRect(0,0,W,H);
  // 轨道
  const railY=150, railLen=850;
  ctx.fillStyle='#d1d5db'; ctx.fillRect(railLeft,railY,railLen,10);
  ctx.fillStyle='#9ca3af'; ctx.fillRect(railLeft,railY+10,railLen,4);
  // 刻度（米）
  ctx.font='11px sans-serif'; ctx.fillStyle='#6b7280'; ctx.textAlign='center';
  ctx.strokeStyle='#9ca3af'; ctx.lineWidth=1;
  const maxM=Math.floor(railLen/pxPerM);
  for(let m=0;m<=maxM;m++){
    const X=railLeft+m*pxPerM;
    if(X>railLeft+railLen)break;
    ctx.beginPath(); ctx.moveTo(X,railY-6); ctx.lineTo(X,railY); ctx.stroke();
    ctx.fillText(m+' m',X,railY-10);
  }
  // 停止线（理论刹车位移）
  const xStop=v0*v0/(2*a);
  const sx=railLeft+xStop*pxPerM;
  if(sx<railLeft+railLen){
    ctx.strokeStyle='#059669'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(sx,railY-52); ctx.lineTo(sx,railY+14); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#059669'; ctx.textAlign='center';
    ctx.fillText('停止线 x停='+xStop.toFixed(1)+' m',sx,railY-58);
  }
  // 速度矢量箭头
  const cx=carStartX+x*pxPerM;
  if(v>0.01){
    const len=v*6;
    ctx.strokeStyle='#2563eb'; ctx.fillStyle='#2563eb'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx+52,110); ctx.lineTo(cx+52+len,110); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+52+len,110); ctx.lineTo(cx+52+len-8,105); ctx.lineTo(cx+52+len-8,115); ctx.closePath(); ctx.fill();
    ctx.font='12px sans-serif'; ctx.textAlign='left';
    ctx.fillText('v = '+v.toFixed(2)+' m/s',cx+56,98);
  }
  // 小车
  drawCar(cx,railY-8,v>0.01);
  // 状态文字
  ctx.font='13px sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#374151';
  let msg;
  if(!running && tNow===0) msg='待命：设置参数后点击"开始制动"';
  else if(tt>=tStop-1e-9) msg='✅ 小车已停止（t = '+tStop.toFixed(2)+' s 时停下），保持静止，不会反向运动！';
  else msg='制动中… t = '+tt.toFixed(2)+' s / '+tStop.toFixed(2)+' s';
  ctx.fillText(msg,railLeft,205);
  // 时间进度条
  ctx.fillStyle='#e5e7eb'; ctx.fillRect(railLeft,214,railLen,6);
  ctx.fillStyle='#2563eb'; ctx.fillRect(railLeft,214,railLen*(tt/t),6);
}

function drawCar(x,y,moving){
  ctx.save(); ctx.translate(x,y);
  // 车身
  ctx.fillStyle='#dc2626';
  roundRect(-46,-34,80,26,6); ctx.fill();
  ctx.fillStyle='#f87171';
  roundRect(-34,-50,54,20,7); ctx.fill();
  // 车窗
  ctx.fillStyle='#bfdbfe';
  roundRect(-28,-46,20,13,3); ctx.fill();
  roundRect(-4,-46,20,13,3); ctx.fill();
  // 车轮
  ctx.fillStyle='#1f2937';
  circle(-28,-4,10); circle(24,-4,10);
  ctx.fillStyle='#9ca3af';
  circle(-28,-4,4); circle(24,-4,4);
  // 制动尾灯/尘土提示
  if(moving){
    ctx.fillStyle='#fbbf24';
    circle(-50,-20,3); circle(-50,-26,2.2);
    ctx.fillStyle='rgba(180,170,150,.6)';
    circle(-56,-2,5); circle(-62,0,3.5);
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}

function loop(ts){
  if(lastTs==null)lastTs=ts;
  const dt=(ts-lastTs)/1000; lastTs=ts;
  tNow+=dt;
  const {t,tStop}=params();
  if(tNow>=Math.min(t,tStop)+1.2){ // 停稳后稍作停留
    running=false; lastTs=null;
    document.getElementById('btnStart').textContent='▶ 重新演示';
  }
  draw();
  if(running) raf=requestAnimationFrame(loop);
}

document.getElementById('btnStart').onclick=()=>{
  tNow=0; lastTs=null; running=true;
  document.getElementById('btnStart').textContent='▶ 演示中…';
  raf=requestAnimationFrame(loop);
};
document.getElementById('btnReset').onclick=()=>{
  running=false; tNow=0; lastTs=null;
  cancelAnimationFrame(raf);
  document.getElementById('btnStart').textContent='▶ 开始制动';
  draw();
};
[v0In,aIn,tIn].forEach(el=>el.addEventListener('input',()=>{refreshLabels(); draw();}));

refreshLabels(); draw();
</script>
</body>
</html>
