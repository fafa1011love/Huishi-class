<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>追及相遇 · 双小车动态模型</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","Segoe UI",sans-serif;}
  body{background:#eef2f8;color:#1f2937;padding:18px 20px 40px;}
  .wrap{max-width:1280px;margin:0 auto;}
  header{text-align:center;margin-bottom:16px;}
  header h1{font-size:22px;letter-spacing:.5px;}
  header p{font-size:13px;color:#64748b;margin-top:5px;}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(15,23,42,.07);padding:16px 18px;}
  .card h2{font-size:14px;color:#0f172a;margin-bottom:12px;padding-left:9px;border-left:4px solid #3b82f6;line-height:1.2;}
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px;align-items:start;}
  canvas{display:block;width:100%;}

  /* 控制区 */
  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;color:#475569;margin-bottom:4px;}
  .ctl label b{color:#1d4ed8;font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#e2e8f0;border-radius:3px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  button{padding:8px 15px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;transition:.15s;}
  button:hover{filter:brightness(1.08);}
  #play{background:#2563eb;} #reset{background:#64748b;}
  #toCrit{background:#f59e0b;} #toMeet{background:#16a34a;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .presets button{background:#eef2ff;color:#3730a3;font-weight:500;padding:6px 11px;font-size:12px;}
  .presets button.active{background:#3b82f6;color:#fff;}

  /* 状态板 */
  .tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;vertical-align:middle;}
  .stat{font-size:13px;line-height:1.95;color:#334155;}
  .stat .row{display:flex;justify-content:space-between;border-bottom:1px dashed #eef2f7;padding:1px 0;}
  .stat .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;color:#0f172a;}
  .kA{color:#dc2626;} .kB{color:#16a34a;} .kC{color:#b45309;}
  .note{margin-top:14px;background:#f8fafc;border:1px solid #e5eaf2;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.95;color:#334155;}
  .note b{color:#0f172a;}
  .formula{font-family:"Cambria Math","Times New Roman",serif;font-size:13.5px;color:#1e3a8a;background:#f1f5ff;border-radius:6px;padding:2px 7px;display:inline-block;margin:2px 0;}
  .legend{display:flex;gap:18px;justify-content:center;font-size:12px;color:#475569;margin-top:8px;flex-wrap:wrap;}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .areastat{font-size:12.5px;color:#475569;text-align:center;margin-top:6px;line-height:1.9;}
  .areastat b{font-variant-numeric:tabular-nums;}
  @media (max-width:960px){ .grid{grid-template-columns:1fr;} .ctrls{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>追及相遇 —— 双小车动态模型</h1>
    <p>A 车（红）在后、匀加速启动追赶 ｜ B 车（绿）在前、匀速行驶 ｜ 轨道配刻度尺</p>
  </header>

  <div class="card">
    <h2>实验轨道：两车实时位置（刻度尺随视野滚动，单位 m）</h2>
    <canvas id="track" data-h="210"></canvas>
    <div class="areastat" id="trackNote"></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>v–t 图像：两线间面积 = 两车位移差</h2>
        <canvas id="vt" data-h="290"></canvas>
        <div class="legend">
          <span><span class="sw" style="background:#ef4444"></span>v<sub>A</sub>＝v<sub>A0</sub>+at（匀加速）</span>
          <span><span class="sw" style="background:#22c55e"></span>v<sub>B</sub>（匀速）</span>
          <span><span class="sw" style="background:rgba(59,130,246,.45)"></span>S₁ 间距增大</span>
          <span><span class="sw" style="background:rgba(249,115,22,.45)"></span>S₂ 间距减小</span>
        </div>
        <div class="areastat" id="areaStat"></div>
      </div>
    </div>

    <div class="card">
      <h2>器材参数（两台独立调速小车 + 刻度轨道）</h2>
      <div class="ctrls">
        <div class="ctl"><label>B 匀速 v<sub>B0</sub> <b id="lvB">4.0 m/s</b></label>
          <input type="range" id="vB" min="2" max="6" step="0.5" value="4"></div>
        <div class="ctl"><label>A 初速 v<sub>A0</sub> <b id="lvA">0.0 m/s</b></label>
          <input type="range" id="vA" min="0" max="5" step="0.5" value="0"></div>
        <div class="ctl"><label>A 加速度 a <b id="la">2.0 m/s²</b></label>
          <input type="range" id="acc" min="0.5" max="4" step="0.5" value="2"></div>
        <div class="ctl"><label>初始间距 Δx<sub>0</sub> <b id="ld">3 m</b></label>
          <input type="range" id="d0" min="1" max="24" step="1" value="3"></div>
      </div>
      <div class="presets">
        <button data-p="0" class="active">典型：追上并超越</button>
        <button data-p="1">慢加速：相距最远很大</button>
        <button data-p="2">高速追及</button>
        <button data-p="3">a 极小：迟迟追不上</button>
      </div>
      <div class="btns">
        <button id="play">▶ 开始</button>
        <button id="toCrit">⚡ 跳到 v 相等</button>
        <button id="toMeet">🎯 跳到相遇</button>
        <button id="reset">↺ 重置</button>
      </div>
      <div class="ctl" style="margin-top:14px">
        <label>时间轴 <b id="lt">0.00 s</b></label>
        <input type="range" id="time" min="0" max="10" step="0.01" value="0">
      </div>

          </div>
  </div>
</div>

<script>
/* ============ 物理模型 ============
   A：x_A = v_A0·t + ½at²      （t=0 处在原点，后车）
   B：x_B = Δx₀ + v_B0·t        （前车，匀速）
   间距：Δx = x_B − x_A = Δx₀ + (v_B0−v_A0)t − ½at²
*/
const T_MAX = 10;
let p = { vA0:0, vB0:4, a:2, d0:3 };
let t = 0, playing = false, rate = 1, lastTs = 0;
let cam = 0;

const xA = tt => p.vA0*tt + 0.5*p.a*tt*tt;
const xB = tt => p.d0 + p.vB0*tt;
const vA = tt => p.vA0 + p.a*tt;
const gap = tt => p.d0 + (p.vB0-p.vA0)*tt - 0.5*p.a*tt*tt;
const tCrit = () => Math.max(0, (p.vB0-p.vA0)/p.a);
const tMeet = () => {                       // 解 Δx=0，取正根
  const dv = p.vB0-p.vA0;
  return (dv + Math.sqrt(dv*dv + 2*p.a*p.d0)) / p.a;
};

/* ============ 画布工具 ============ */
function setup(id, h){
  const cv = document.getElementById(id);
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = cv.clientWidth;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.height = h + 'px';          // 关键：固定 CSS 高度，避免高分屏下画布被纵向拉伸
  const c = cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  cv._w = w; cv._h = h; cv._c = c;
  return cv;
}
const CV = {};
function resizeAll(){
  CV.track = setup('track', 210);
  CV.vt = setup('vt', 290);
  draw();
}

/* ============ 轨道绘制 ============ */
function drawTrack(){
  const cv = CV.track, c = cv._c, W = cv._w, H = cv._h;
  c.clearRect(0,0,W,H);
  const ppm = Math.max(16, Math.min(34, (W-150)/30));
  const PAD = 44;                      // 左侧留白，避免 t=0 时车与标注被裁剪
  const wx = x => (x-cam)*ppm + PAD;
  const railY = 132;

  // 背景
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#f8fafc'); g.addColorStop(1,'#e8eef7');
  c.fillStyle = g; c.fillRect(0,0,W,H);

  // 刻度尺（随 cam 滚动）
  let step = 1;
  if (ppm*1 < 42) step = 2;
  if (ppm*2 < 42) step = 5;
  if (ppm*5 < 42) step = 10;
  c.font = '10px sans-serif'; c.textAlign = 'center';
  const startM = Math.floor(cam/step)*step;
  for(let m = startM; ; m += step){
    const sx = wx(m);
    if (sx > W+40) break;
    if (sx < -40) continue;
    const major = m % (step*5) === 0;
    c.strokeStyle = major ? '#94a3b8' : '#cbd5e1';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(sx, railY+10); c.lineTo(sx, railY + (major?26:18)); c.stroke();
    if (major){ c.fillStyle = '#64748b'; c.fillText(m+'', sx, railY+40); }
  }
  // 轨道
  c.fillStyle = '#b6c2d4';
  c.beginPath(); c.roundRect(0, railY, W, 9, 4); c.fill();
  c.fillStyle = '#94a3b8';
  for(let x=((cam*ppm)%28); x<W; x+=28){ c.fillRect(x, railY+2, 3, 5); }

  const sxA = wx(xA(t)), sxB = wx(xB(t));

  // 间距标注
  const yGap = 190;
  c.strokeStyle = '#3b82f6'; c.fillStyle = '#2563eb';
  c.lineWidth = 1.5; c.setLineDash([5,4]);
  c.beginPath(); c.moveTo(sxA, yGap); c.lineTo(sxB, yGap); c.stroke();
  c.beginPath(); c.moveTo(sxA, yGap-7); c.lineTo(sxA, yGap+7); c.stroke();
  c.beginPath(); c.moveTo(sxB, yGap-7); c.lineTo(sxB, yGap+7); c.stroke();
  c.setLineDash([]);
  c.font = 'bold 12px sans-serif'; c.textAlign='center';
  const midX = (sxA+sxB)/2;
  const label = 'Δx = ' + Math.abs(xB(t)-xA(t)).toFixed(2) + ' m';
  const tw = c.measureText(label).width + 12;
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(midX-tw/2, yGap-9, tw, 18, 9); c.fill();
  c.fillStyle = '#2563eb'; c.fillText(label, midX, yGap+4);

  drawCar(c, sxA, railY, '#ef4444', 'A（匀加速）', vA(t).toFixed(1)+' m/s');
  drawCar(c, sxB, railY, '#22c55e', 'B（匀速）', p.vB0.toFixed(1)+' m/s');

  // 出场箭头
  [[sxA,'#ef4444'],[sxB,'#22c55e']].forEach(([sx,col])=>{
    if(sx > W-10){ c.fillStyle=col; c.beginPath(); c.moveTo(W-4,105); c.lineTo(W-22,99); c.lineTo(W-22,111); c.fill(); }
  });
}

function drawCar(c, sx, railY, color, name, vtxt){
  const w = 52, h = 22, y = railY - 30;
  // 车轮
  c.fillStyle = '#334155';
  [sx-w/2+11, sx+w/2-11].forEach(wx=>{ c.beginPath(); c.arc(wx, railY-2, 7, 0, 7); c.fill(); });
  // 车身
  c.fillStyle = color;
  c.beginPath(); c.roundRect(sx-w/2, y, w, h, 6); c.fill();
  // 车顶
  c.fillStyle = 'rgba(255,255,255,.35)';
  c.beginPath(); c.roundRect(sx-9, y+4, 20, 9, 3); c.fill();
  // 车头
  c.fillStyle = 'rgba(255,255,255,.9)';
  c.beginPath(); c.arc(sx+w/2-6, y+h/2, 3, 0, 7); c.fill();
  // 文字
  c.fillStyle = color; c.font = 'bold 11px sans-serif'; c.textAlign='center';
  c.fillText(name, sx, y-20);
  c.fillStyle = '#475569'; c.font = '10px sans-serif';
  c.fillText(vtxt, sx, y-8);
}

/* ============ v–t 图 ============ */
function drawVT(){
  const cv = CV.vt, c = cv._c, W = cv._w, H = cv._h;
  c.clearRect(0,0,W,H);
  const L = 48, R = W-14, T = 18, B = H-30;
  const pw = R-L, ph = B-T;
  const vMax = Math.max(vA(T_MAX), p.vB0, 1)*1.1;
  const X = tt => L + tt/T_MAX*pw;
  const Y = vv => B - vv/vMax*ph;

  // 网格
  c.strokeStyle='#eef2f7'; c.lineWidth=1;
  for(let i=1;i<=5;i++){ const y=T+ph*i/5; c.beginPath(); c.moveTo(L,y); c.lineTo(R,y); c.stroke(); }
  for(let s=0;s<=T_MAX;s+=2){ const x=X(s); c.beginPath(); c.moveTo(x,T); c.lineTo(x,B); c.stroke(); }

  const tc = tCrit(), tm = tMeet();
  const tEnd = Math.min(t, T_MAX);

  // 面积：0→min(t,tc) 蓝（间距增大）；tc→t 橙（间距减小）
  const fillRegion = (t1, t2, color) => {
    if (t2 <= t1) return;
    c.beginPath();
    for(let tt=t1; tt<=t2; tt+=0.02){ const x=X(tt), y=Y(p.vB0); tt===t1?c.moveTo(x,y):c.lineTo(x,y); }
    c.lineTo(X(t2), Y(p.vB0));
    for(let tt=t2; tt>=t1; tt-=0.02){ c.lineTo(X(tt), Y(vA(tt))); }
    c.closePath(); c.fillStyle = color; c.fill();
  };
  fillRegion(0, Math.min(tEnd, tc), 'rgba(59,130,246,.30)');
  if (tEnd > tc) fillRegion(tc, tEnd, 'rgba(249,115,22,.30)');

  // 轴
  c.strokeStyle='#94a3b8'; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(L,T); c.lineTo(L,B); c.lineTo(R,B); c.stroke();
  c.fillStyle='#94a3b8'; c.font='10px sans-serif'; c.textAlign='right';
  for(let i=0;i<=5;i++){ const vv=vMax*i/5; c.fillText(vv.toFixed(1), L-6, Y(vv)+3); }
  c.textAlign='center';
  for(let s=0;s<=T_MAX;s+=2) c.fillText(s, X(s), B+15);
  c.fillStyle='#64748b'; c.font='11px sans-serif';
  c.fillText('t / s', R-10, B+26);
  c.save(); c.translate(14, T+ph/2); c.rotate(-Math.PI/2); c.textAlign='center';
  c.fillText('v / (m·s⁻¹)', 0, 0); c.restore();

  // 曲线（整段解析曲线）
  const line = (f, color) => {
    c.beginPath(); c.strokeStyle=color; c.lineWidth=2.5;
    for(let tt=0; tt<=T_MAX+1e-9; tt+=0.05){ const x=X(tt), y=Y(f(tt)); tt===0?c.moveTo(x,y):c.lineTo(x,y); }
    c.stroke();
  };
  line(vA, '#ef4444');
  line(()=>p.vB0, '#22c55e');

  // 临界时刻竖线
  const vline = (tt, color, text, dy) => {
    const x = X(tt);
    if (x < L || x > R) return;
    c.save(); c.setLineDash([5,4]); c.strokeStyle=color; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(x,T); c.lineTo(x,B); c.stroke(); c.restore();
    c.fillStyle=color; c.font='bold 10px sans-serif'; c.textAlign='center';
    c.fillText(text, x, T + (dy||9));
  };
  if (tc > 0.02) vline(tc, '#f59e0b', 'v 相等 t*', 9);
  if (tm <= T_MAX) vline(tm, '#16a34a', '相遇', 20);

  // 当前时刻游标
  const xc = X(tEnd);
  c.save(); c.strokeStyle='#1e293b'; c.lineWidth=1.4; c.globalAlpha=.75;
  c.beginPath(); c.moveTo(xc,T); c.lineTo(xc,B); c.stroke(); c.restore();
  c.fillStyle='#ef4444'; c.beginPath(); c.arc(xc, Y(vA(tEnd)), 4.5, 0, 7); c.fill();
  c.fillStyle='#22c55e'; c.beginPath(); c.arc(xc, Y(p.vB0), 4.5, 0, 7); c.fill();
}

/* ============ 状态文字 ============ */
function updateHUD(){
  const va = vA(t), vb = p.vB0, d = gap(t), tc = tCrit(), tm = tMeet(), dmax = gap(tc);

  let tag, color, desc;
  const met = t >= tMeet();      // 是否已超过相遇时刻（此时 A 在前）
  if (Math.abs(d) < 0.06 && t > 0.15){
    tag='相遇！'; color='#7c3aed';
    desc='Δx = 0，两车并排；此后 v<sub>A</sub> &gt; v<sub>B</sub>，A 领先并把距离拉开';
  } else if (!met){
    // ---- 相遇前：A 在后追赶 ----
    if (va < vb - 0.005){ tag='间距拉大'; color='#dc2626'; desc='v<sub>A</sub> &lt; v<sub>B</sub>：A 在后且更慢，间距继续增大'; }
    else if (va > vb + 0.005){ tag='间距缩小'; color='#16a34a'; desc='v<sub>A</sub> &gt; v<sub>B</sub>：A 在后但更快，间距正在缩小，接近相遇'; }
    else { tag='临界 · 最远'; color='#f59e0b'; desc='v<sub>A</sub> = v<sub>B</sub>：间距此刻达到极大值，是"拉大→缩小"的分界点'; }
  } else {
    // ---- 相遇后：A 已在 B 前方 ----
    if (va > vb + 0.005){ tag='领先拉大'; color='#dc2626'; desc='A 已在前方且更快，两车距离<b>继续增大</b>（A 越跑越远）'; }
    else if (va < vb - 0.005){ tag='领先缩小'; color='#16a34a'; desc='A 在前方但更慢，间距正在缩小（B 开始追近）'; }
    else { tag='临界 · 最近'; color='#f59e0b'; desc='v<sub>A</sub> = v<sub>B</sub>：间距此刻取极小值，是"缩小→拉大"的分界点'; }
  }

  const over = d < 0;

  // 面积统计
  const tEnd = Math.min(t, T_MAX);
  let S1 = 0, S2 = 0;
  if (tEnd <= tc){ S1 = (vb-p.vA0)*tEnd - 0.5*p.a*tEnd*tEnd; }
  else {
    S1 = (vb-p.vA0)*tc - 0.5*p.a*tc*tc;
    const dt2 = tEnd - tc;
    S2 = 0.5*p.a*dt2*dt2;   // v_A 从 v_B 起加速，面积 = ½a·Δt²
  }
  document.getElementById('areaStat').innerHTML =
    'S₁（蓝，间距增大）= <b>'+S1.toFixed(2)+'</b> m ｜ S₂（橙，间距追回）= <b>'+S2.toFixed(2)+'</b> m ｜ '+
    'Δx₀ − (S₂−S₁) = <b>'+Math.abs(p.d0 - S2 + S1).toFixed(2)+'</b> m（当前间距）';

  document.getElementById('trackNote').innerHTML =
    '<span class="tag" style="background:'+color+'">'+tag+'</span>'+
    '<span style="margin-left:8px">'+desc+'</span>'+
    (met && Math.abs(d) >= 0.06 ? '<span style="margin-left:10px;color:#94a3b8">（A 已超越 B，前后位置互换）</span>' : '');

  document.getElementById('lt').textContent = t.toFixed(2)+' s';
  document.getElementById('time').value = t;
}

/* ============ 主循环 ============ */
function draw(dtFrame){
  // 镜头：锁定最靠后的车；移动速度不超过 v_B0，避免前车视觉倒退
  const target = Math.max(0, Math.min(xA(t), xB(t)) - 2.2);
  if (target > cam) cam += Math.min(target-cam, p.vB0 * (dtFrame||0.016) * 0.98);
  drawTrack(); drawVT(); updateHUD();
}

function loop(ts){
  if(!playing) return;
  if(!lastTs) lastTs = ts;
  const dtReal = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;
  t += dtReal*rate;
  if (t >= T_MAX){ t = T_MAX; setPlaying(false); }
  if (gap(t) < -26) { setPlaying(false); }   // 追过太远就停下，保持画面可读
  draw(dtReal);
  if (playing) requestAnimationFrame(loop);
}

function setPlaying(v){
  playing = v; lastTs = 0;
  document.getElementById('play').textContent = v ? '⏸ 暂停' : '▶ 开始';
}

function recomputeCam(tt){
  // 依据解析解重算镜头（保证只前进、速度不超 v_B0）
  cam = Math.max(0, Math.min(xA(tt), xB(tt)) - 2.2);
}

function reset(){
  setPlaying(false); t = 0; recomputeCam(0); draw();
}

/* ============ 交互 ============ */
document.getElementById('play').onclick = ()=>{
  if (playing) return setPlaying(false);
  if (t >= T_MAX || gap(t) < -26) t = 0, recomputeCam(0);
  setPlaying(true); lastTs = 0; requestAnimationFrame(loop);
};
document.getElementById('reset').onclick = reset;
document.getElementById('toCrit').onclick = ()=>{ setPlaying(false); t = tCrit(); recomputeCam(t); draw(); };
document.getElementById('toMeet').onclick = ()=>{ setPlaying(false); t = Math.min(tMeet(), T_MAX); recomputeCam(t); draw(); };

const timeEl = document.getElementById('time');
timeEl.max = T_MAX;
timeEl.oninput = ()=>{ setPlaying(false); t = parseFloat(timeEl.value); recomputeCam(t); draw(); };

function bindSlider(id, key, labelId, fmt){
  const el = document.getElementById(id);
  el.oninput = ()=>{
    p[key] = parseFloat(el.value);
    document.getElementById(labelId).textContent = fmt(p[key]);
    document.querySelectorAll('.presets button').forEach(b=>b.classList.remove('active'));
    reset();
  };
}
bindSlider('vB','vB0','lvB', v=>v.toFixed(1)+' m/s');
bindSlider('vA','vA0','lvA', v=>v.toFixed(1)+' m/s');
bindSlider('acc','a','la', v=>v.toFixed(1)+' m/s²');
bindSlider('d0','d0','ld', v=>v.toFixed(0)+' m');

const PRESETS = [
  { vA0:0, vB0:4, a:2,   d0:3  },   // 典型
  { vA0:0, vB0:4, a:1.2, d0:6  },   // 慢加速，最远间距很大
  { vA0:2, vB0:5, a:3,   d0:2  },   // 高速追及
  { vA0:0, vB0:4, a:0.5, d0:14 }    // a 极小
];
document.querySelectorAll('.presets button').forEach(btn=>{
  btn.onclick = ()=>{
    const q = PRESETS[+btn.dataset.p];
    Object.assign(p, q);
    document.getElementById('vA').value = p.vA0; document.getElementById('lvA').textContent = p.vA0.toFixed(1)+' m/s';
    document.getElementById('vB').value = p.vB0; document.getElementById('lvB').textContent = p.vB0.toFixed(1)+' m/s';
    document.getElementById('acc').value = p.a;  document.getElementById('la').textContent  = p.a.toFixed(1)+' m/s²';
    document.getElementById('d0').value = p.d0;  document.getElementById('ld').textContent  = p.d0.toFixed(0)+' m';
    document.querySelectorAll('.presets button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    reset();
  };
});

window.addEventListener('resize', ()=>{ const keep = cam; resizeAll(); cam = keep; draw(); });

/* 支持 URL 参数 #t=秒数，直接跳到某时刻（便于课堂定点讲解/截图） */
const mh = location.hash.match(/t=([\d.]+)/);
if (mh){ t = Math.min(parseFloat(mh[1]), T_MAX); }

/* 初始化 */
resizeAll();
if (mh) recomputeCam(t);
document.querySelector('.presets button').classList.add('active');
</script>
</body>
</html>
