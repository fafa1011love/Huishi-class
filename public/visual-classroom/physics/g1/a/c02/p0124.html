<script>
(function(){
  'use strict';

  // ============ 物理参数 ============
  const G = 9.8, TUBE_H = 1.8;         // 重力加速度、管长(m)
  const RHO0 = 1.225;                   // 空气密度 kg/m³
  const SPEC = {
    iron:    { m:0.05,  A:0.0008, Cd:1.2, name:'铁片' },
    feather: { m:0.001, A:0.0040, Cd:1.5, name:'羽毛' }
  };

  function newTube(p){
    return {
      p: p,
      iron:    { s:0, v:0, landed:false, tl:null },
      feather: { s:0, v:0, landed:false, tl:null }
    };
  }

  const tubeA = newTube(1);   // A 管：始终有空气
  const tubeB = newTube(1);   // B 管：可抽真空

  const st = {
    mode: 'idle',      // idle | flipping | falling | done
    t: 0,
    speed: 0.4,        // 播放倍率
    pumping: false,
    flip: 0,           // 倒立角度 0 → π
    flipT: 0           // 倒立动画计时
  };

  // 采样数据（画 v-t 图）
  const series = { aFe:[], aFt:[], bFe:[], bFt:[] };

  // ============ DOM ============
  const scene = document.getElementById('scene');
  const sctx  = scene.getContext('2d');
  const chart = document.getElementById('chart');
  const cctx  = chart.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  const VW = 780, VH = 560;
  const CW = 780, CH = 240;
  [[scene,VW,VH],[chart,CW,CH]].forEach(([c,w,h])=>{ c.width = w*DPR; c.height = h*DPR; });

  const $ = id => document.getElementById(id);
  const pSlider = $('pSlider'), pText = $('pText'), banner = $('banner');
  const btnPump = $('btnPump'), btnFill = $('btnFill'), btnDrop = $('btnDrop'),
        btnReset = $('btnReset'), btnSlow = $('btnSlow');

  // ============ 工具 ============
  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  // 空气分子（视觉用）：每根管固定一批随机点
  function molecules(n){
    const a = [];
    for(let i=0;i<n;i++) a.push({ x:Math.random(), y:Math.random(), ph:Math.random()*6.28 });
    return a;
  }
  const molA = molecules(70), molB = molecules(70);

  // ============ 场景绘制 ============
  const TUBE = { w:100, h:392, top:76 };
  const CX = [232, 548];

  function drawScene(){
    sctx.setTransform(DPR,0,0,DPR,0,0);
    sctx.clearRect(0,0,VW,VH);

    // 背景网格
    sctx.fillStyle = '#f8fafc';
    roundRect(sctx,0,0,VW,VH,12); sctx.fill();

    drawTube(tubeA, CX[0], 'A 管', '有空气', '#dbeafe', '#93c5fd', molA, 1);
    drawTube(tubeB, CX[1], 'B 管', tubeB.p < 0.02 ? '真空' : '气压 ' + tubeB.p.toFixed(2) + ' atm',
             tubeB.p < 0.02 ? '#d1fae5' : '#dbeafe', tubeB.p < 0.02 ? '#6ee7b7' : '#93c5fd',
             molB, tubeB.p);

    drawPump();
    drawVerdictTag();
  }

  function drawIron(c){
    const g = c.createLinearGradient(0,-6,0,6);
    g.addColorStop(0,'#94a3b8'); g.addColorStop(.5,'#475569'); g.addColorStop(1,'#334155');
    c.fillStyle = g;
    roundRect(c,-17,-6,34,12,2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.fillRect(-14,-4,26,1.6);
  }

  function drawTube(tube, cx, title, subtitle, tint, edge, mols, showMol){
    const h = TUBE.h, w = TUBE.w;
    const cyc = TUBE.top + h/2;   // 管中心 = 旋转轴
    const theta = st.flip;

    // 支架（不随管旋转）
    sctx.fillStyle = '#cbd5e1';
    roundRect(sctx, cx-88, TUBE.top+h+20, 176, 12, 6); sctx.fill();
    sctx.fillStyle = '#94a3b8';
    roundRect(sctx, cx-62, TUBE.top+h+4, 10, 20, 3); sctx.fill();
    roundRect(sctx, cx+52, TUBE.top+h+4, 10, 20, 3); sctx.fill();

    // ---- 管体（绕中心旋转，实现倒立动画）----
    sctx.save();
    sctx.translate(cx, cyc);
    sctx.rotate(theta);
    const left = -w/2, topY = -h/2;

    // 玻璃管体
    const grd = sctx.createLinearGradient(left,0,left+w,0);
    grd.addColorStop(0,'rgba(255,255,255,.9)');
    grd.addColorStop(.25,tint);
    grd.addColorStop(.55,'rgba(255,255,255,.55)');
    grd.addColorStop(1,tint);
    sctx.fillStyle = grd;
    roundRect(sctx,left,topY,w,h,10); sctx.fill();
    sctx.strokeStyle = edge; sctx.lineWidth = 2.5; sctx.stroke();

    // 高光
    sctx.fillStyle = 'rgba(255,255,255,.75)';
    roundRect(sctx,left+10,topY+12,8,h-24,4); sctx.fill();

    // 上端封口 / 下端阀
    sctx.fillStyle = '#94a3b8';
    roundRect(sctx,left-6,topY-12,w+12,14,4); sctx.fill();
    sctx.fillStyle = '#64748b';
    roundRect(sctx,left-4,topY+h-2,w+8,12,3); sctx.fill();
    // 阀门
    sctx.fillStyle = '#475569';
    roundRect(sctx,left+w-4,topY+h-30,14,16,3); sctx.fill();

    // 空气分子（随管一起转）
    if(showMol > 0.02){
      const n = Math.round(mols.length * Math.min(1, showMol));
      const tt = performance.now()/700;
      sctx.fillStyle = 'rgba(59,130,246,.45)';
      for(let i=0;i<n;i++){
        const m = mols[i];
        const x = left+14 + m.x*(w-28) + Math.sin(tt+m.ph)*3;
        const y = topY+22 + m.y*(h-52) + Math.cos(tt*1.3+m.ph)*3;
        sctx.beginPath(); sctx.arc(x,y,1.6,0,6.283); sctx.fill();
      }
    }

    // 倒立过程中：物体贴着管底，随管一起翻转
    if(st.mode === 'flipping'){
      sctx.save(); sctx.translate(-18, h/2 - 18); drawIron(sctx); sctx.restore();
      sctx.save(); sctx.translate(20, h/2 - 24); sctx.rotate(0.35); drawFeather(sctx); sctx.restore();
    }
    sctx.restore();

    // ---- 屏幕坐标系：下落中的物体 ----
    const iron = tube.iron, fth = tube.feather;
    const airFactor = Math.min(1, tube.p);
    const innerTop = TUBE.top + 18, innerH = h - 40;
    // 正立静置：物体停在管底；倒立后：s 从顶部量起、向下落
    const oy = s => st.mode === 'idle' ? innerTop + innerH : innerTop + (s/TUBE_H)*innerH;

    if(st.mode !== 'flipping'){
      // 铁片
      sctx.save();
      sctx.translate(cx - 18, oy(iron.s));
      drawIron(sctx);
      sctx.restore();

      // 羽毛（有空气下落时飘摆）
      sctx.save();
      const wob = st.mode==='falling' ? Math.sin(st.t*9 + 1)*0.45*airFactor : 0;
      sctx.translate(cx + 20 + (st.mode==='falling'? Math.sin(st.t*7)*5*airFactor : 0), oy(fth.s));
      sctx.rotate(0.35 + wob);
      drawFeather(sctx);
      sctx.restore();
    }

    // 真空标注（屏幕坐标，保持正立可读）
    if(showMol <= 0.02){
      sctx.fillStyle = 'rgba(5,150,105,.75)';
      sctx.font = '600 12px "Microsoft YaHei"';
      sctx.textAlign = 'center';
      sctx.fillText('真 空', cx, TUBE.top + h/2 - 4);
      sctx.fillText('（无空气阻力）', cx, TUBE.top + h/2 + 14);
    }

    // 落点提示线（管底）
    sctx.strokeStyle = 'rgba(148,163,184,.55)';
    sctx.setLineDash([4,4]); sctx.lineWidth = 1;
    sctx.beginPath();
    sctx.moveTo(cx - w/2 + 4, TUBE.top + h - 16);
    sctx.lineTo(cx + w/2 - 4, TUBE.top + h - 16);
    sctx.stroke();
    sctx.setLineDash([]);

    // 标题
    sctx.textAlign = 'center';
    sctx.fillStyle = '#0f172a';
    sctx.font = '700 14px "Microsoft YaHei"';
    sctx.fillText(title, cx, TUBE.top - 26);
    sctx.fillStyle = '#64748b';
    sctx.font = '12px "Microsoft YaHei"';
    sctx.fillText(subtitle, cx, TUBE.top - 10);

    // 各自落地时间
    if(iron.tl !== null || fth.tl !== null){
      sctx.font = '11.5px "Microsoft YaHei"';
      sctx.textAlign = 'left';
      sctx.fillStyle = '#1d4ed8';
      sctx.fillText('铁片 ' + (iron.tl!==null? iron.tl.toFixed(2)+' s' : '下落中…'), cx - w/2 - 14, TUBE.top + h + 50);
      sctx.fillStyle = '#b45309';
      sctx.fillText('羽毛 ' + (fth.tl!==null? fth.tl.toFixed(2)+' s' : '下落中…'), cx - w/2 - 14, TUBE.top + h + 66);
    }
  }

  function drawFeather(c){
    // 羽轴
    c.strokeStyle = '#92400e'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(0,0); c.lineTo(2,-40); c.stroke();
    // 羽片
    const g = c.createLinearGradient(-10,-30,14,-6);
    g.addColorStop(0,'#fcd34d'); g.addColorStop(1,'#d97706');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(0,2);
    c.quadraticCurveTo(18,-14, 6,-42);
    c.quadraticCurveTo(4,-20, 0,2);
    c.fill();
    c.fillStyle = 'rgba(251,191,36,.85)';
    c.beginPath();
    c.moveTo(0,2);
    c.quadraticCurveTo(-13,-16, -2,-40);
    c.quadraticCurveTo(-1,-18, 0,2);
    c.fill();
    // 羽枝
    c.strokeStyle = 'rgba(146,64,14,.45)'; c.lineWidth = 1;
    for(let i=0;i<6;i++){
      const y = -6 - i*5.5;
      c.beginPath(); c.moveTo(1,y); c.lineTo(9-i*0.9, y-3.5); c.stroke();
      c.beginPath(); c.moveTo(1,y); c.lineTo(-6+i*0.6, y-3); c.stroke();
    }
  }

  // B 管阀门在屏幕上的位置（随倒立角度旋转）
  function valvePos(){
    const dx = TUBE.w/2 + 3, dy = TUBE.h/2 - 22;
    const c = Math.cos(st.flip), s = Math.sin(st.flip);
    return {
      x: CX[1] + dx*c - dy*s,
      y: TUBE.top + TUBE.h/2 + dx*s + dy*c
    };
  }

  function drawPump(){
    const x = 690, y = 330;
    const vp = valvePos();
    const r = st.flip / Math.PI;   // 0=正立 1=倒立
    // 软管（跟随阀门位置，倒立时绕过管顶）
    const c1 = { x: vp.x + 70 + 10*r,  y: vp.y + 10 - 90*r };
    const c2 = { x: x - 60 + 70*r,     y: y - 60 - 130*r };
    sctx.strokeStyle = st.pumping ? '#2563eb' : '#94a3b8';
    sctx.lineWidth = 5; sctx.lineCap = 'round';
    sctx.beginPath();
    sctx.moveTo(vp.x, vp.y);
    sctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, x, y);
    sctx.stroke();

    // 泵体
    sctx.fillStyle = st.pumping ? '#2563eb' : '#cbd5e1';
    roundRect(sctx, x-34, y-4, 68, 52, 8); sctx.fill();
    sctx.fillStyle = st.pumping ? '#dbeafe' : '#475569';
    sctx.font = '700 12px "Microsoft YaHei"';
    sctx.textAlign = 'center';
    sctx.fillText(st.pumping ? '抽气中' : '抽气泵', x, y + 20);
    sctx.font = '10px "Microsoft YaHei"';
    sctx.fillStyle = st.pumping ? '#dbeafe' : '#64748b';
    sctx.fillText(st.pumping ? '···' : '真空泵', x, y + 35);
  }

  function drawVerdictTag(){
    if(st.mode !== 'done') return;
    const dx = Math.abs(tubeB.iron.tl - tubeB.feather.tl);
    const ok = dx < 0.03;
    const text = ok ? '✓ B 管：同时落地' : 'B 管：仍有先后差异';
    sctx.font = '700 13px "Microsoft YaHei"';
    sctx.textAlign = 'center';
    const w = sctx.measureText(text).width + 26;
    sctx.fillStyle = ok ? 'rgba(16,185,129,.14)' : 'rgba(220,38,38,.12)';
    roundRect(sctx, CX[1]-w/2, 18, w, 28, 14); sctx.fill();
    sctx.fillStyle = ok ? '#047857' : '#b91c1c';
    sctx.fillText(text, CX[1], 37);
  }

  // ============ 图表绘制 ============
  const AX = { l:56, r:18, t:18, b:34 };
  const TMAX = 1.8, VMAX = 16;

  function drawChart(){
    cctx.setTransform(DPR,0,0,DPR,0,0);
    cctx.clearRect(0,0,CW,CH);
    cctx.fillStyle = '#fff';
    cctx.fillRect(0,0,CW,CH);

    const x0 = AX.l, y0 = CH - AX.b, x1 = CW - AX.r, y1 = AX.t;
    const px = t => x0 + (t/TMAX)*(x1-x0);
    const py = v => y0 - (v/VMAX)*(y0-y1);

    // 网格
    cctx.strokeStyle = '#eef2f7'; cctx.lineWidth = 1;
    cctx.font = '11px "Consolas",monospace'; cctx.fillStyle = '#94a3b8';
    cctx.textAlign = 'center'; cctx.textBaseline = 'top';
    for(let t=0; t<=TMAX+0.001; t+=0.2){
      const x = px(t);
      cctx.beginPath(); cctx.moveTo(x,y1); cctx.lineTo(x,y0); cctx.stroke();
      cctx.fillText(t.toFixed(1), x, y0+6);
    }
    cctx.textAlign = 'right'; cctx.textBaseline = 'middle';
    for(let v=0; v<=VMAX+0.001; v+=2){
      const y = py(v);
      cctx.beginPath(); cctx.moveTo(x0,y); cctx.lineTo(x1,y); cctx.stroke();
      cctx.fillText(String(v), x0-8, y);
    }
    // 轴
    cctx.strokeStyle = '#cbd5e1'; cctx.lineWidth = 1.5;
    cctx.beginPath(); cctx.moveTo(x0,y1); cctx.lineTo(x0,y0); cctx.lineTo(x1,y0); cctx.stroke();
    cctx.fillStyle = '#64748b'; cctx.font = '12px "Microsoft YaHei"'; cctx.textAlign = 'left';
    cctx.fillText('v /(m·s⁻¹)', x0-46, y1-6);
    cctx.textAlign = 'right';
    cctx.fillText('t /s', x1, y0+22);

    // 曲线
    const lines = [
      { key:'aFe', color:'#1d4ed8', dash:[],   w:2.4 },
      { key:'aFt', color:'#d97706', dash:[],   w:2.4 },
      { key:'bFe', color:'#64748b', dash:[6,4],w:1.8 },
      { key:'bFt', color:'#10b981', dash:[3,4],w:1.8 }
    ];
    for(const L of lines){
      const arr = series[L.key];
      if(arr.length < 2) continue;
      cctx.beginPath();
      arr.forEach((p,i)=>{
        const x = px(Math.min(p.t,TMAX)), y = py(Math.min(p.v,VMAX));
        i ? cctx.lineTo(x,y) : cctx.moveTo(x,y);
      });
      cctx.setLineDash(L.dash); cctx.lineWidth = L.w; cctx.strokeStyle = L.color; cctx.stroke();
      cctx.setLineDash([]);
      // 末端点
      const last = arr[arr.length-1];
      cctx.beginPath();
      cctx.arc(px(Math.min(last.t,TMAX)), py(Math.min(last.v,VMAX)), 3.2, 0, 6.283);
      cctx.fillStyle = L.color; cctx.fill();
    }

    // 图例
    const leg = [
      ['A 管 铁片','#1d4ed8',[]],
      ['A 管 羽毛','#d97706',[]],
      ['B 管 铁片','#64748b',[6,4]],
      ['B 管 羽毛','#10b981',[3,4]]
    ];
    let lx = x1 - 300, ly = y1 + 10;
    cctx.font = '11.5px "Microsoft YaHei"'; cctx.textAlign = 'left'; cctx.textBaseline = 'middle';
    leg.forEach(([txt,col,dash])=>{
      cctx.strokeStyle = col; cctx.lineWidth = 2.4; cctx.setLineDash(dash);
      cctx.beginPath(); cctx.moveTo(lx,ly); cctx.lineTo(lx+22,ly); cctx.stroke();
      cctx.setLineDash([]);
      cctx.fillStyle = '#475569';
      cctx.fillText(txt, lx+28, ly+0.5);
      lx += 76;
    });
  }

  // ============ 物理 ============
  function step(dtSim){
    st.t += dtSim;
    let allDone = true;

    [tubeA, tubeB].forEach((tube, ti)=>{
      ['iron','feather'].forEach(key=>{
        const o = tube[key], sp = SPEC[key];
        if(o.landed) return;
        allDone = false;

        const k = 0.5 * RHO0 * tube.p * sp.Cd * sp.A;   // 阻力系数
        const a = G - (k / sp.m) * o.v * o.v;           // 阻力 ∝ v²，方向与运动相反
        o.v += a * dtSim;
        o.s += o.v * dtSim;
        if(o.s >= TUBE_H){
          o.s = TUBE_H; o.landed = true; o.tl = st.t;
        }
        // 采样
        const kk = (ti===0?'a':'b') + (key==='iron'?'Fe':'Ft');
        series[kk].push({ t: st.t, v: o.v });
      });
    });

    if(allDone) finish();
  }

  function finish(){
    st.mode = 'done';
    syncUI();
    const aFe = tubeA.iron.tl, aFt = tubeA.feather.tl;
    const bFe = tubeB.iron.tl, bFt = tubeB.feather.tl;
    const dA = aFt - aFe, dB = Math.abs(bFt - bFe);
    let cls = 'ok', msg = '';
    if(tubeB.p < 0.05){
      msg = `✅ B 管接近真空：铁片 ${bFe.toFixed(2)} s、羽毛 ${bFt.toFixed(2)} s，<b>同时落地</b>！<br>
             而 A 管（有空气）铁片 ${aFe.toFixed(2)} s 先落，羽毛 ${aFt.toFixed(2)} s 才落，差 ${dA.toFixed(2)} s。<br>
             同一实验、只改变空气 —— 下落快慢与质量无关。`;
    } else if(dB < 0.03){
      msg = `气压已很低（${tubeB.p.toFixed(2)} atm），B 管中两物几乎同时落地（差 ${dB.toFixed(3)} s）。继续抽气，差异会完全消失。`;
      cls = 'info';
    } else {
      msg = `B 管当前仍有空气：铁片 ${bFe.toFixed(2)} s、羽毛 ${bFt.toFixed(2)} s，差 ${dB.toFixed(2)} s。<br>
             点击「抽气至真空」再释放一次，看看会发生什么。`;
      cls = 'warn';
    }
    banner.className = 'banner ' + cls;
    banner.innerHTML = msg;
  }

  // ============ UI 同步 ============
  function syncUI(){
    pSlider.value = Math.round(tubeB.p*100);
    pText.textContent = tubeB.p < 0.005 ? '≈ 0 atm（真空）' : tubeB.p.toFixed(2) + ' atm';
    pSlider.disabled = st.mode === 'falling' || st.mode === 'flipping' || st.pumping;
    btnPump.disabled = st.mode !== 'idle' || st.pumping || tubeB.p < 0.005;
    btnFill.disabled = st.mode !== 'idle' || st.pumping || tubeB.p > 0.995;
    btnDrop.disabled = st.mode === 'flipping' || st.mode === 'falling' || st.pumping;
    btnSlow.textContent = '⏱ 慢动作 ×' + st.speed.toFixed(1);

    const fmt = x => x===null ? '—' : x.toFixed(2)+' s';
    $('aFe').textContent = fmt(tubeA.iron.tl);
    $('aFt').textContent = fmt(tubeA.feather.tl);
    $('bFe').textContent = fmt(tubeB.iron.tl);
    $('bFt').textContent = fmt(tubeB.feather.tl);
    $('aD').textContent = (tubeA.iron.tl!==null && tubeA.feather.tl!==null)
      ? (tubeA.feather.tl - tubeA.iron.tl).toFixed(2)+' s' : '—';
    $('bD').textContent = (tubeB.iron.tl!==null && tubeB.feather.tl!==null)
      ? Math.abs(tubeB.feather.tl - tubeB.iron.tl).toFixed(3)+' s' : '—';
  }

  // ============ 交互 ============
  function resetAll(keepPressure){
    st.mode = 'idle'; st.t = 0;
    st.flip = 0; st.flipT = 0;
    [tubeA, tubeB].forEach(t=>{
      t.iron = { s:0, v:0, landed:false, tl:null };
      t.feather = { s:0, v:0, landed:false, tl:null };
    });
    Object.keys(series).forEach(k => series[k] = []);
    if(!keepPressure) tubeB.p = 1;
    banner.className = 'banner info';
    banner.innerHTML = tubeB.p < 0.05
      ? 'B 管已是真空。点击「同时释放」，观察铁片和羽毛。'
      : '当前两根管都充满空气。点击「同时释放」，注意铁片和羽毛。';
    syncUI();
  }

  btnDrop.addEventListener('click', ()=>{
    if(st.mode === 'flipping' || st.mode === 'falling' || st.pumping) return;
    if(st.mode === 'done') resetAll(true);
    st.mode = 'flipping'; st.flipT = 0;
    banner.className = 'banner info';
    banner.innerHTML = '倒立玻璃管中……铁片和羽毛贴着管底随管一起翻转，准备同时释放。';
    syncUI();
  });

  btnReset.addEventListener('click', ()=> resetAll(true));

  pSlider.addEventListener('input', ()=>{
    if(st.mode !== 'idle') return;
    tubeB.p = pSlider.value/100;
    syncUI();
  });

  let pumpTimer = null;
  btnPump.addEventListener('click', ()=>{
    if(st.pumping || st.mode !== 'idle') return;
    st.pumping = true; syncUI();
    pumpTimer = setInterval(()=>{
      tubeB.p = Math.max(0.001, tubeB.p - 0.045);
      syncUI();
      if(tubeB.p <= 0.001){
        clearInterval(pumpTimer); st.pumping = false;
        banner.className = 'banner info';
        banner.innerHTML = '管内空气已被抽尽（接近真空）。现在点击「同时释放」！';
        syncUI();
      }
    }, 70);
  });

  btnFill.addEventListener('click', ()=>{
    if(st.pumping || st.mode !== 'idle') return;
    tubeB.p = 1; syncUI();
  });

  btnSlow.addEventListener('click', ()=>{
    const opts = [0.4, 0.2, 1.0];
    const i = opts.indexOf(st.speed);
    st.speed = opts[(i+1) % opts.length];
    syncUI();
  });

  document.addEventListener('keydown', e=>{
    if(e.code === 'Space'){ e.preventDefault(); btnDrop.click(); }
    if(e.code === 'KeyR'){ resetAll(true); }
  });

  // ============ 主循环 ============
  let last = null;
  function loop(ts){
    if(last === null) last = ts;
    let dtReal = (ts - last)/1000;
    last = ts;
    dtReal = Math.min(dtReal, 0.05);

    if(st.mode === 'flipping'){
      // 倒立动画（实时速度，不受慢动作影响），带缓入缓出
      st.flipT += dtReal;
      const p = Math.min(st.flipT / 0.9, 1);
      st.flip = Math.PI * (p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2);
      if(p >= 1){
        st.flip = Math.PI;
        st.mode = 'falling'; st.t = 0;
        banner.innerHTML = '释放！两物同时离开管底（v₀ = 0），注意落地先后……';
      }
    }
    else if(st.mode === 'falling'){
      // 固定步长积分，保证不同帧率下结果一致
      let budget = dtReal * st.speed;
      const hStep = 1/600;
      while(budget > 0 && st.mode === 'falling'){
        const h = Math.min(hStep, budget);
        step(h);
        budget -= h;
      }
    }

    drawScene();
    drawChart();
    requestAnimationFrame(loop);
  }

  drawScene(); drawChart(); syncUI();
  requestAnimationFrame(loop);
})();
</script>


</body></html>
