<body data-page-node-id="ccAjcOFf9JbpZgHgApM4rC" style="">
<div id="left" class="card" data-page-node-id="8a1wBTTQDlynCasFBfW2JN">
  <h1 data-page-node-id="a7pp3Z5phvME9xCYrRuyQP">探究斜面上共点力平衡 —— 重力分解与平衡条件</h1>
  <canvas id="cv" width="900" height="520" data-page-node-id="9jcBFwz2iDKBgaElPQuGWw"></canvas>
  <div class="ctrl" data-page-node-id="94ak03US2eiS6cARgePHfF">
    <span data-page-node-id="GSDGSRwBLYs1a8Cy3wrK5D">斜面倾角 θ</span>
    <input id="ang" type="range" min="0" max="60" step="1" value="30" data-page-node-id="vuGV0rMXEHk2pgKVZ2yweW">
    <span class="angle-val" id="angVal" data-page-node-id="tDQOfxSAA8spcqktTSONar">30°</span>
  </div>
  <div class="note" data-page-node-id="m0DXtT7zoJaLChRAwzUJ63">拖动滑块改变倾角：重力沿斜面、垂直斜面的两个分力会<b data-page-node-id="DBoDXHdLfV8gzU0R426jcA">同步变化</b>，物块始终保持共点力平衡（合力为 0）。</div>
</div>

<div id="right" data-page-node-id="M22jQhqd9ClXd8FXcgHIX3">
  <div class="card" data-page-node-id="Vck3bkBISvQ7seb5zWMq8p">
    <h2 data-page-node-id="Df0q7jxMEOpwYVJVlT1epl">受力数据（m = 1 kg，g = 10 N/kg）</h2>
    <table data-page-node-id="u2Tu0T014EHFJXBlFu8zZK">
      <tbody data-page-node-id="fLlWTJBY9Tk2lV7suKbteL"><tr data-page-node-id="DTssqRxO8TVFmSDiRgHZYP"><td class="sw" data-page-node-id="wnTkZh5otrDK5cLWFWe8sQ"><span class="dot" style="background:var(--g)" data-page-node-id="gn3nbRbZ7yBApoDQqT6yQ1"></span></td><th data-page-node-id="YPjHztWI3x5P3n3itiw0Xq">重力 G</th><td id="vG" data-page-node-id="SAmSAgjvFE6XHt1YOsMV0i">10.0 N</td></tr>
      <tr data-page-node-id="qR5FwiHscTDKitqQ04mu99"><td class="sw" data-page-node-id="FswTnJUvqvsoCKK2t5pkd3"><span class="dot" style="background:var(--gx)" data-page-node-id="abCkuDnkBlTXiNGajTBUc8"></span></td><th data-page-node-id="ewp02OpbafwuGecALaGCcA">G₁ = G·sinθ（沿斜面向下）</th><td id="vGx" data-page-node-id="YmnOE72HpDDa8tym5wL5Ur">5.0 N</td></tr>
      <tr data-page-node-id="QF26iVkO3ypDYsCdjqURD8"><td class="sw" data-page-node-id="XpNv8EObYoB3MZzVVTVfp8"><span class="dot" style="background:var(--gy)" data-page-node-id="EVK1LZkVu8JyUu8CGYohxq"></span></td><th data-page-node-id="jQfcpVXuGIDhHlWQhYlAAw">G₂ = G·cosθ（垂直斜面向下）</th><td id="vGy" data-page-node-id="I7KwMcveFV4GSY5LUN43py">8.7 N</td></tr>
      <tr data-page-node-id="q1cUdqUHJa1jQZeWEWro2v"><td class="sw" data-page-node-id="SmFl3CSTCiiIxCIjD9V83Q"><span class="dot" style="background:var(--n)" data-page-node-id="DTBfCWCzWUCpHRIOi6r5p1"></span></td><th data-page-node-id="gAtSNdfF8pjwbt85biVrGF">支持力 N = G₂</th><td id="vN" data-page-node-id="C7IvGr9EmCmS8AQpT1d1BQ">8.7 N</td></tr>
      <tr data-page-node-id="vmmnMq7iPicelVp9ybr1qX"><td class="sw" data-page-node-id="LxQPq8VgwwGhl4mAsgRmsW"><span class="dot" style="background:#3b82f6" data-page-node-id="3kENTiLwKtgYcokRCC8tNV"></span></td><th data-page-node-id="mVTvtyutG3dzr6u69VcKFN">摩擦力 f = G₁</th><td id="vF" data-page-node-id="45PdInFXcQtJ5cJGQ8CYSr">5.0 N</td></tr>
    </tbody></table>
    <div class="eq" id="eqBox" data-page-node-id="Ebl0nUqQUCVax2UunAupiC"><span class="balance-ok">✓ 共点力平衡：F<sub>合</sub> = 0</span><br>
     沿斜面方向：f − G₁ = 0 → f = G₁ = 5.0 N<br>
     垂直斜面方向：N − G₂ = 0 → N = G₂ = 8.7 N</div>
  </div>

  
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const angEl = document.getElementById('ang');
const W = cv.width, H = cv.height;
const G = 10; // N
let angle = 30;

function setAngle(a){ angle = a; document.getElementById('angVal').textContent = a + '°';
  const rad = a*Math.PI/180;
  document.getElementById('vG').textContent = G.toFixed(1)+' N';
  document.getElementById('vGx').textContent = (G*Math.sin(rad)).toFixed(1)+' N';
  document.getElementById('vGy').textContent = (G*Math.cos(rad)).toFixed(1)+' N';
  document.getElementById('vN').textContent = (G*Math.cos(rad)).toFixed(1)+' N';
  document.getElementById('vF').textContent = (G*Math.sin(rad)).toFixed(1)+' N';
  document.getElementById('eqBox').innerHTML =
    `<span class="balance-ok">✓ 共点力平衡：F<sub>合</sub> = 0</span><br>
     沿斜面方向：f − G₁ = 0 → f = G₁ = ${(G*Math.sin(rad)).toFixed(1)} N<br>
     垂直斜面方向：N − G₂ = 0 → N = G₂ = ${(G*Math.cos(rad)).toFixed(1)} N`;
  draw();
}

function draw(){
  const rad = angle*Math.PI/180;
  ctx.clearRect(0,0,W,H);

  // ---- geometry ----
  const baseY = H-80, baseW = 620;
  const x0 = 120, x1 = x0+baseW;
  const topH = baseW*Math.tan(rad);
  const apex = {x:x0, y:baseY-topH};
  if(baseY-topH < 60) { apex.y = 60; }
  const slopeLen = Math.hypot(x1-x0, baseY-apex.y);
  // u: 沿斜面向下的单位矢量（画布坐标 y 向下为正）
  const ux = (x1-x0)/slopeLen, uy = (baseY-apex.y)/slopeLen;

  // incline triangle
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath(); ctx.moveTo(x0,baseY); ctx.lineTo(x1,baseY); ctx.lineTo(x0,apex.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#94a3b8'; ctx.fillRect(x0-40, baseY, baseW+80, 26); // ground
  ctx.fillStyle = '#64748b';
  for(let i=0;i<18;i++){ ctx.fillRect(x0-40+i*40, baseY+26, 20, 5); } // hatch

  // angle arc
  ctx.strokeStyle='#475569'; ctx.beginPath(); ctx.arc(x0, baseY, 70, -rad, 0); ctx.stroke();
  ctx.fillStyle='#475569'; ctx.font='16px sans-serif';
  ctx.fillText('θ='+angle+'°', x0+80, baseY-12);

  // ---- block on slope (center) ----
  const t=0.55;
  const cxp = x0 + ux*slopeLen*t, cyp = apex.y + uy*slopeLen*t;
  const size = 64, half=size/2;
  ctx.save();
  ctx.translate(cxp,cyp);
  ctx.rotate(Math.atan2(uy,ux));
  ctx.fillStyle='#fbbf24'; ctx.strokeStyle='#b45309'; ctx.lineWidth=2;
  ctx.fillRect(-half,-half,size,size); ctx.strokeRect(-half,-half,size,size);
  // dot marker (point where forces act)
  ctx.fillStyle='#111827'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
  ctx.restore();

  const S = 7.5; // px per N
  // u = 沿斜面向下 ; n = 垂直斜面向下（压向斜面）
  const dnx = ux, dny = uy;
  const nX = uy, nY = -ux;
  const Fnx = -nX, Fny = -nY;   // 垂直斜面向上：支持力 N 的方向
  const upx = -ux, upy = -uy;   // 沿斜面向上：摩擦力 f / 拉力 T 的方向

  const g1 = G*Math.sin(rad);   // 沿斜面向下的分力
  const g2 = G*Math.cos(rad);   // 垂直斜面向下的分力

  // ---- gravity arrow ----
  arrow(cxp,cyp, cxp, cyp+G*S, '#ef4444','G','bottom');

  // 平行四边形分解：G = G₁ + G₂（三个力矢量都从物块中心向下画）
  const p1x = cxp + dnx*g1*S, p1y = cyp + dny*g1*S;   // G₁ 末端
  const p2x = cxp + nX*g2*S,  p2y = cyp + nY*g2*S;    // G₂ 末端
  ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(p1x,p1y); ctx.lineTo(cxp,cyp+G*S); ctx.lineTo(p2x,p2y); ctx.stroke();
  ctx.restore();

  // ---- G1：沿斜面向下 ----
  arrow(cxp,cyp, p1x, p1y, '#f59e0b','G₁= '+g1.toFixed(1)+' N','', -13);
  // ---- G2：垂直斜面向下 ----
  arrow(cxp,cyp, p2x, p2y, '#10b981','G₂= '+g2.toFixed(1)+' N','', 13);

  // 平衡力：N = G₂（垂直斜面向上），静摩擦力 f = G₁（沿斜面向上）
  arrow(cxp,cyp, cxp+upx*g1*S, cyp+upy*g1*S, '#3b82f6','f = '+g1.toFixed(1)+' N','', 13);
  arrow(cxp,cyp, cxp+Fnx*g2*S, cyp+Fny*g2*S, '#8b5cf6','N = '+g2.toFixed(1)+' N','', -13);
}

function arrow(x0,y0,x1,y1,color,label,labelPos,off=0){
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy);
  if(len<2) return;
  const ox = -dy/len*off, oy = dx/len*off;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x0+ox,y0+oy); ctx.lineTo(x1+ox,y1+oy); ctx.stroke();
  const a=Math.atan2(dy,dx), hs=10;
  ctx.beginPath();
  ctx.moveTo(x1+ox,y1+oy);
  ctx.lineTo(x1+ox-hs*Math.cos(a-0.45), y1+oy-hs*Math.sin(a-0.45));
  ctx.lineTo(x1+ox-hs*Math.cos(a+0.45), y1+oy-hs*Math.sin(a+0.45));
  ctx.closePath(); ctx.fill();
  if(label){
    ctx.font='bold 15px sans-serif';
    let lx,ly;
    if(labelPos==='bottom'){ lx=x1; ly=y1+20; }
    else { lx = x1 + dx/len*20; ly = y1 + dy/len*20 + 5; }
    ctx.textAlign='center';
    ctx.fillText(label, lx+ox, ly+oy);
  }
  ctx.restore();
}

angEl.addEventListener('input', e=>setAngle(+e.target.value));
setAngle(30);
</script>
