<script>
(() => {
  'use strict';

  /* ============ 常量 ============ */
  const G = 9.8;
  const TH1 = 30 * Math.PI / 180;
  const D_FLAT = 0.15;          // 两斜面之间的连接段
  const R_BALL = 0.022;
  const DT = 0.0008;

  const MEDIA = [
    { name:'毛巾',     mu:0.25, color:'#c2705a', desc:'很粗糙' },
    { name:'棉布',     mu:0.18, color:'#cf9a42', desc:'较粗糙' },
    { name:'木板',     mu:0.12, color:'#ab8250', desc:'较光滑' },
    { name:'玻璃',     mu:0.05, color:'#6aaec4', desc:'很光滑' },
    { name:'理想光滑', mu:0.00, color:'#7a5cc0', desc:'推理：无摩擦' }
  ];

  /* ============ 状态 ============ */
  const S = {
    mi: 0,
    h0: 0.25,
    theta2: 18 * Math.PI / 180,
    speed: 0.75,
    phase: 'ready',      // ready | down | flat | up | done
    q: 0, v: 0,
    hNow: 0.25,
    stopKind: null,      // 'ramp' | 'flat'
    pan: 0,
    flags: [],
    auto: false, queue: [], timer: null,
    spin: 0
  };

  const $ = id => document.getElementById(id);
  const mu = () => MEDIA[S.mi].mu;
  const isFlat = () => S.theta2 <= 1.2 * Math.PI / 180;

  /* ============ 几何 ============ */
  function geo(){
    const W1 = S.h0 / Math.tan(TH1);
    const S1 = S.h0 / Math.sin(TH1);
    const L2 = isFlat() ? 0 : Math.min(2.6, S.h0 / Math.sin(S.theta2) * 1.16);
    return { W1, S1, L2 };
  }

  function ptOf(q){
    const g = geo();
    if (q <= g.S1){
      const u = q / g.S1;
      return { x: -g.W1 * (1 - u), y: S.h0 * (1 - u) };
    }
    const u = q - g.S1;
    if (isFlat()) return { x: u, y: 0 };
    if (u <= D_FLAT) return { x: u, y: 0 };
    const t = Math.min(u - D_FLAT, g.L2);
    return { x: D_FLAT + t * Math.cos(S.theta2), y: t * Math.sin(S.theta2) };
  }

  /* ============ 画布 ============ */
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 1000, H = 340, DPR = 1;
  const view = { k: 500, ox: 300, oy: 300 };

  function fit(){
    const cssW = Math.max(460, cv.parentElement.clientWidth - 16);
    const cssH = Math.round(Math.min(392, Math.max(296, cssW * 0.335)));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cssW * DPR);
    cv.height = Math.round(cssH * DPR);
    cv.style.height = cssH + 'px';
    W = cssW; H = cssH;

    const g = geo();
    const wW = g.W1 + D_FLAT + (isFlat() ? 1.55 : g.L2 * Math.cos(S.theta2)) + 0.16;
    const wH = Math.max(S.h0, isFlat() ? 0 : g.L2 * Math.sin(S.theta2)) + 0.11;
    view.k = Math.min((W - 92) / wW, (H - 150) / wH);
    view.ox = 60 + g.W1 * view.k;
    view.oy = H - 86;
  }
  const X = x => view.ox + (x - S.pan) * view.k;
  const Y = y => view.oy - y * view.k;

  /* ============ 物理 ============ */
  function reset(keepFlags){
    S.phase = 'ready'; S.q = 0; S.v = 0;
    S.hNow = S.h0; S.stopKind = null; S.pan = 0; S.spin = 0;
    if (!keepFlags) S.flags = [];
    fit(); sync();
  }

  function launch(){
    S.phase = 'down'; S.q = 0; S.v = 0; S.hNow = S.h0;
    S.stopKind = null; S.pan = 0; S.spin = 0;
    sync();
  }

  function step(dt){
    const g = geo(), m = mu();
    if (S.phase === 'down'){
      const a = G * (Math.sin(TH1) - m * Math.cos(TH1));
      S.v += a * dt;
      S.q += S.v * dt;
      S.spin += S.v * dt;
      if (S.q >= g.S1){ S.q = g.S1; S.phase = 'flat'; }
      S.hNow = ptOf(Math.min(S.q, g.S1)).y;
    } else if (S.phase === 'flat'){
      S.v -= m * G * dt;
      if (S.v <= 0){ S.v = 0; S.phase = 'done'; S.stopKind = 'flat'; S.hNow = 0; finish(); return; }
      S.q += S.v * dt;
      S.spin += S.v * dt;
      if (S.q >= g.S1 + D_FLAT){ S.q = g.S1 + D_FLAT; S.phase = 'up'; }
      S.hNow = 0;
    } else if (S.phase === 'up'){
      const th = isFlat() ? 0 : S.theta2;
      const a = -G * (Math.sin(th) + m * Math.cos(th));
      S.v += a * dt;
      if (S.v <= 0){
        S.v = 0;
        const p = ptOf(S.q);
        S.hNow = p.y;
        S.phase = 'done';
        S.stopKind = isFlat() ? 'flat' : 'ramp';
        finish(); return;
      }
      S.q += S.v * dt;
      S.spin += S.v * dt;
      if (!isFlat() && S.q > g.S1 + D_FLAT + g.L2) S.q = g.S1 + D_FLAT + g.L2;
      S.hNow = ptOf(S.q).y;
    }

    /* 镜头跟随（水平面无限延伸，或停得很远） */
    if (isFlat()){
      const p = ptOf(S.q);
      const anchor = (0.58 * W - view.ox) / view.k;
      S.pan = Math.max(0, p.x - anchor);
    }
  }

  function finish(){
    const p = ptOf(S.q);
    S.flags.push({
      mi: S.mi,
      x: p.x, y: p.y,
      h: Math.max(0, S.hNow),
      h0: S.h0,
      flat: S.stopKind === 'flat'
    });
    if (S.flags.length > 6) S.flags.shift();
    sync();
    nextAuto();
  }

  function nextAuto(){
    if (!S.queue.length){ S.auto = false; sync(); return; }
    const nxt = S.queue.shift();
    S.timer = setTimeout(() => {
      S.mi = nxt;
      buildMeds();
      reset(true);
      launch();
    }, 950);
  }

  /* ============ 绘制小工具 ============ */
  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ============ 场景 ============ */
  function drawBg(){
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(.55, '#f9fcff');
    bg.addColorStop(1, '#eef4fa');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // 地面
    ctx.fillStyle = '#e8eef6';
    ctx.fillRect(0, Y(0), W, H - Y(0) + 2);
    ctx.strokeStyle = '#cddbea'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, Y(0) + .5); ctx.lineTo(W, Y(0) + .5); ctx.stroke();
    ctx.strokeStyle = 'rgba(178,196,216,.45)'; ctx.lineWidth = 1;
    for (let x = -24; x < W; x += 14){
      ctx.beginPath(); ctx.moveTo(x, Y(0) + 2); ctx.lineTo(x + 9, Y(0) + 11); ctx.stroke();
    }
  }

  function trackPath(){
    const g = geo();
    const P = [];
    P.push({ x: -g.W1, y: S.h0 });
    P.push({ x: 0, y: 0 });
    P.push({ x: D_FLAT, y: 0 });
    if (!isFlat()){
      P.push({ x: D_FLAT + g.L2 * Math.cos(S.theta2), y: g.L2 * Math.sin(S.theta2) });
    }
    return P;
  }

  function drawTrack(){
    const g = geo(), m = MEDIA[S.mi];
    const P = trackPath();
    const rightEdge = S.pan + (W - view.ox) / view.k;

    // 支架
    ctx.fillStyle = '#e4ebf5'; ctx.strokeStyle = '#ccd9e8'; ctx.lineWidth = 1;
    const legTop = Y(0);
    [[X(-g.W1 * 0.45), 9], [X(0.02), 9], [X(D_FLAT + 0.35), 8]].forEach(([lx, w]) => {
      if (lx < -20 || lx > W + 20) return;
      ctx.beginPath(); ctx.rect(lx - w / 2, legTop, w, H - legTop - 6); ctx.fill(); ctx.stroke();
    });
    if (!isFlat()){
      const ex = X(D_FLAT + g.L2 * Math.cos(S.theta2)), ey = Y(g.L2 * Math.sin(S.theta2));
      ctx.beginPath(); ctx.rect(ex - 4, ey + 2, 8, Y(0) - ey - 2); ctx.fill(); ctx.stroke();
    }

    // 轨道板
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(X(P[0].x), Y(P[0].y));
    for (let i = 1; i < P.length; i++) ctx.lineTo(X(P[i].x), Y(P[i].y));
    let tailX = X(P[P.length - 1].x);
    if (isFlat()){ tailX = Math.min(W + 40, X(rightEdge)); ctx.lineTo(tailX, Y(0)); }
    ctx.lineTo(tailX, Y(P[P.length - 1].y) + 7);
    ctx.lineTo(X(P[2].x), Y(0) + 7);
    ctx.lineTo(X(P[1].x), Y(0) + 7);
    ctx.lineTo(X(P[0].x), Y(0) + 7);
    ctx.closePath();
    const grd = ctx.createLinearGradient(0, Y(S.h0 + .3), 0, Y(0));
    grd.addColorStop(0, '#f4f8fc'); grd.addColorStop(1, '#dee7f2');
    ctx.fillStyle = grd; ctx.fill();
    ctx.strokeStyle = '#ccdae9'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();

    // 材质表面
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = m.color; ctx.lineWidth = 5.5;
    ctx.beginPath();
    ctx.moveTo(X(P[0].x), Y(P[0].y));
    for (let i = 1; i < P.length; i++) ctx.lineTo(X(P[i].x), Y(P[i].y));
    if (isFlat()) ctx.lineTo(Math.min(W + 40, X(rightEdge)), Y(0));
    ctx.stroke();

    // 纹理
    drawTexture(g, m, rightEdge);

    // 端头 / 无限延伸标记
    if (!isFlat()){
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(X(P[P.length - 1].x), Y(P[P.length - 1].y), 2.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.save();
      ctx.strokeStyle = m.color; ctx.lineWidth = 1.2; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(W - 96, Y(0) - 12); ctx.lineTo(W - 22, Y(0) - 12); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = m.color; ctx.font = '600 10.5px system-ui'; ctx.textAlign = 'right';
      ctx.fillText('水平面 → ∞', W - 22, Y(0) - 17);
      ctx.restore();
    }

    // 释放点
    ctx.save();
    ctx.strokeStyle = 'rgba(43,108,176,.45)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(X(P[0].x) - 13, Y(P[0].y)); ctx.lineTo(X(P[0].x) + 26, Y(P[0].y));
    ctx.stroke(); ctx.restore();
  }

  function drawTexture(g, m, rightEdge){
    const qMax = g.S1 + D_FLAT + (isFlat() ? 60 : g.L2);
    const dir = q => {
      if (q <= g.S1) return { x: Math.cos(TH1), y: -Math.sin(TH1) };
      if (isFlat() || q <= g.S1 + D_FLAT) return { x: 1, y: 0 };
      return { x: Math.cos(S.theta2), y: -Math.sin(S.theta2) };
    };
    const nrm = q => { const d = dir(q); return { x: d.y, y: -d.x }; };

    ctx.save();
    if (m.name === '毛巾'){
      ctx.strokeStyle = 'rgba(255,255,255,.62)'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
      for (let q = 0.004; q < qMax; q += 0.0105){
        const p = ptOf(q), n = nrm(q), d = dir(q);
        if (X(p.x) < -14 || X(p.x) > W + 14) continue;
        const px = X(p.x) + n.x * 1.4, py = Y(p.y) + n.y * 1.4;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + n.x * 3.6 + d.x * .8, py + n.y * 3.6); ctx.stroke();
      }
    } else if (m.name === '棉布'){
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
      for (let q = 0.004; q < qMax; q += 0.0125){
        const p = ptOf(q), n = nrm(q);
        if (X(p.x) < -14 || X(p.x) > W + 14) continue;
        const px = X(p.x) + n.x * 1.3, py = Y(p.y) + n.y * 1.3;
        ctx.beginPath(); ctx.moveTo(px - 1.9, py + 1); ctx.lineTo(px + 1.4, py - 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px + 1.9, py + 1); ctx.lineTo(px - 1.4, py - 2); ctx.stroke();
      }
    } else if (m.name === '木板'){
      ctx.strokeStyle = 'rgba(92,62,30,.30)'; ctx.lineWidth = 1;
      for (let q = 0.006; q < qMax; q += 0.016){
        const p = ptOf(q), n = nrm(q);
        if (X(p.x) < -14 || X(p.x) > W + 14) continue;
        const px = X(p.x) + n.x * 1.2, py = Y(p.y) + n.y * 1.2;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + n.x * 2.2, py + n.y * 2.2); ctx.stroke();
      }
    } else if (m.name === '玻璃'){
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let q = 0; q < qMax; q += 0.02){
        const p = ptOf(q);
        if (q === 0) ctx.moveTo(X(p.x), Y(p.y) - 1.5); else ctx.lineTo(X(p.x), Y(p.y) - 1.5);
      }
      ctx.stroke();
    } else {
      const t = performance.now() / 900;
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.7;
      ctx.setLineDash([9, 11]); ctx.lineDashOffset = -t * 34;
      ctx.beginPath();
      for (let q = 0; q < qMax; q += 0.02){
        const p = ptOf(q);
        if (q === 0) ctx.moveTo(X(p.x), Y(p.y) - 1.5); else ctx.lineTo(X(p.x), Y(p.y) - 1.5);
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
  }

  /* 原高度参考线 + Δh 标注 */
  function drawHeights(){
    const g = geo();
    const yH = Y(S.h0);
    ctx.save();
    ctx.strokeStyle = 'rgba(217,79,79,.34)'; ctx.lineWidth = 1.2; ctx.setLineDash([7, 5]);
    ctx.beginPath(); ctx.moveTo(46, yH); ctx.lineTo(W - 14, yH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(217,79,79,.82)'; ctx.font = '600 10.5px system-ui'; ctx.textAlign = 'left';
    ctx.fillText('原高度 h₀ = ' + S.h0.toFixed(2) + ' m', 50, yH - 5);

    // 左侧 h₀ 竖标
    const hx = X(-g.W1) - 20;
    if (hx > 8){
      ctx.strokeStyle = 'rgba(43,108,176,.45)'; ctx.lineWidth = 1.1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(hx, Y(0)); ctx.lineTo(hx, yH); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#2b6cb0';
      [[yH, 1], [Y(0), -1]].forEach(([y, d]) => {
        ctx.beginPath(); ctx.moveTo(hx, y);
        ctx.lineTo(hx - 3.4, y + 6.5 * d); ctx.lineTo(hx + 3.4, y + 6.5 * d);
        ctx.closePath(); ctx.fill();
      });
    }
    ctx.restore();

    // Δh（当小球停在斜面上时）
    if (S.phase === 'done' && S.stopKind === 'ramp'){
      const p = ptOf(S.q);
      const bx = X(p.x) + 34;
      const y1 = Y(Math.max(0, S.hNow)), y2 = yH;
      ctx.save();
      ctx.strokeStyle = 'rgba(217,79,79,.75)'; ctx.fillStyle = 'rgba(217,79,79,.9)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(bx, y1); ctx.lineTo(bx, y2); ctx.stroke();
      [[y1, -1], [y2, 1]].forEach(([y, d]) => {
        ctx.beginPath(); ctx.moveTo(bx, y);
        ctx.lineTo(bx - 3.2, y - 6 * d); ctx.lineTo(bx + 3.2, y - 6 * d);
        ctx.closePath(); ctx.fill();
      });
      const dh = S.h0 - Math.max(0, S.hNow);
      if (y2 - y1 > 16){
        ctx.font = '700 10.5px ui-monospace,Consolas,monospace'; ctx.textAlign = 'left';
        ctx.fillText('Δh=' + dh.toFixed(3), bx + 6, (y1 + y2) / 2 + 3);
      }
      ctx.restore();
    }
  }

  /* 历史停止点小旗 */
  function drawFlags(){
    S.flags.forEach((f, i) => {
      const m = MEDIA[f.mi];
      const px = X(f.x), py = Y(f.y) - R_BALL * view.k - 3;
      ctx.save();
      ctx.strokeStyle = m.color; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(px, Y(f.y)); ctx.lineTo(px, py - 9); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(px, py - 10, 2.6, 0, Math.PI * 2); ctx.fill();
      // 标签
      const txt = m.mu === 0 ? 'μ=0' : m.name;
      ctx.font = '600 9.5px system-ui';
      const tw = ctx.measureText(txt).width;
      const ly = py - 16 - (i % 3) * 12;
      ctx.globalAlpha = .92;
      ctx.fillStyle = '#fff';
      rr(px - tw / 2 - 3.5, ly - 9, tw + 7, 12, 3.5); ctx.fill();
      ctx.strokeStyle = m.color + '77'; ctx.lineWidth = .9; ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = m.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, px, ly - 2.6);
      ctx.restore();
    });
  }

  function ballPos(){
    if (S.phase === 'ready') return ptOf(0);
    return ptOf(S.q);
  }

  function drawBall(){
    const p = ballPos();
    const r = R_BALL * view.k;
    const px = X(p.x), py = Y(p.y) - r;

    // 影子
    ctx.save();
    ctx.fillStyle = 'rgba(28,48,74,.12)';
    ctx.beginPath(); ctx.ellipse(px, Y(p.y) + 1, r * .95, r * .2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const moving = S.v > 0.02 && (S.phase === 'down' || S.phase === 'flat' || S.phase === 'up');
    if (moving){
      // 方向
      let dx = 1, dy = 0;
      if (S.phase === 'down'){ dx = Math.cos(TH1); dy = Math.sin(TH1); }
      else if (S.phase === 'up' && !isFlat()){ dx = Math.cos(S.theta2); dy = -Math.sin(S.theta2); }

      // 速度矢量
      const len = Math.max(20, Math.min(88, S.v * 26));
      const sx = px + dx * (r + 2), sy = py + dy * (r + 2);
      const ex = sx + dx * len, ey = sy + dy * len;
      ctx.save();
      ctx.strokeStyle = '#d94f4f'; ctx.fillStyle = '#d94f4f'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      const ang = Math.atan2(dy, dx);
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex - 8.5 * Math.cos(ang - .4), ey - 8.5 * Math.sin(ang - .4));
      ctx.lineTo(ex - 8.5 * Math.cos(ang + .4), ey - 8.5 * Math.sin(ang + .4));
      ctx.closePath(); ctx.fill();
      ctx.font = '700 11px ui-monospace,Consolas,monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('v', ex + dx * 8 + 1, ey + dy * 8);
      ctx.restore();

      // 摩擦力
      if (mu() > 0){
        const fLen = 14 + Math.min(30, mu() * 95);
        const a0x = px + dx * (r * .55), a0y = py + r * .55;
        const a1x = a0x - dx * fLen, a1y = a0y - dy * fLen;
        ctx.save();
        ctx.strokeStyle = '#0f9d8f'; ctx.fillStyle = '#0f9d8f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(a0x, a0y); ctx.lineTo(a1x, a1y); ctx.stroke();
        const a2 = Math.atan2(-dy, -dx);
        ctx.beginPath(); ctx.moveTo(a1x, a1y);
        ctx.lineTo(a1x - 6.5 * Math.cos(a2 - .42), a1y - 6.5 * Math.sin(a2 - .42));
        ctx.lineTo(a1x - 6.5 * Math.cos(a2 + .42), a1y - 6.5 * Math.sin(a2 + .42));
        ctx.closePath(); ctx.fill();
        ctx.font = '700 10.5px ui-monospace,Consolas,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('f', a1x - dx * 8, a1y - dy * 8);
        ctx.restore();
      }
    }

    // 球体
    const grd = ctx.createRadialGradient(px - r * .36, py - r * .42, r * .1, px, py, r * 1.08);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(.30, '#ffd98c');
    grd.addColorStop(.74, '#f0a02a'); grd.addColorStop(1, '#c9740f');
    ctx.save();
    ctx.shadowColor = 'rgba(140,90,20,.30)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.ellipse(px - r * .34, py - r * .40, r * .28, r * .18, -.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // 转动标记
    ctx.save();
    ctx.translate(px, py); ctx.rotate(S.spin / R_BALL);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(1.2, r * .13);
    ctx.beginPath(); ctx.arc(0, 0, r * .46, .35, Math.PI * 1.05); ctx.stroke();
    ctx.restore();
  }

  /* 地面标尺 */
  function drawRuler(){
    const y0 = Y(0) + 22;
    const xL = S.pan + (0 - view.ox) / view.k;
    const xR = S.pan + (W - view.ox) / view.k;
    ctx.save();
    ctx.strokeStyle = '#b7c8d9'; ctx.lineWidth = 1.1;
    ctx.font = '9.5px ui-monospace,Consolas,monospace'; ctx.fillStyle = '#95a8bd'; ctx.textAlign = 'center';
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
    const start = Math.floor(Math.max(0, xL) / 0.2) * 0.2;
    for (let d = start; d <= xR && d < 200; d += 0.2){
      const x = X(d);
      if (x < -6 || x > W + 6) continue;
      const big = Math.abs(d - Math.round(d)) < 1e-6;
      ctx.beginPath(); ctx.moveTo(x, y0 - (big ? 4 : 2)); ctx.lineTo(x, y0 + (big ? 4 : 2)); ctx.stroke();
      if (big) ctx.fillText(d.toFixed(0) + 'm', x, y0 + 13);
    }
    if (S.pan < 0.001){
      ctx.textAlign = 'left'; ctx.fillStyle = '#95a8bd';
      ctx.fillText('水平距离', X(0) + 1, y0 - 7);
    }
    ctx.restore();
  }

  /* 角标：材质 / 高度对比柱 */
  function drawHUD(){
    const m = MEDIA[S.mi];
    ctx.save();
    ctx.font = '600 11.5px system-ui';
    const txt = `接触面：${m.name}　μ = ${m.mu.toFixed(2)}`;
    const w = ctx.measureText(txt).width + 34;
    rr(12, 10, w, 25, 8);
    ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
    ctx.strokeStyle = 'rgba(206,221,236,.95)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(26, 22.5, 4.3, 0, Math.PI * 2); ctx.fillStyle = m.color; ctx.fill();
    ctx.fillStyle = '#33455c'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, 36, 23);
    ctx.restore();

    // 高度对比柱
    const bw = 112, bh = 64, bx = W - bw - 12, by = 10;
    const maxV = Math.max(S.h0, 0.3);
    const barH = 38, baseY = by + 11;
    const toPx = v => Math.min(1, v / (maxV * 1.05)) * barH;
    ctx.save();
    rr(bx, by, bw, bh, 10);
    ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
    ctx.strokeStyle = 'rgba(206,221,236,.95)'; ctx.stroke();
    const hv = Math.max(0, Math.min(S.hNow, 0.6));
    ctx.fillStyle = '#eef4fb'; ctx.fillRect(bx + 11, baseY, 10, barH);
    ctx.fillStyle = '#2b6cb0'; ctx.fillRect(bx + 11, baseY + barH - toPx(S.h0), 10, toPx(S.h0));
    ctx.fillStyle = '#e9f8f4'; ctx.fillRect(bx + 28, baseY, 10, barH);
    ctx.fillStyle = '#0f9d8f'; ctx.fillRect(bx + 28, baseY + barH - toPx(hv), 10, toPx(hv));
    ctx.strokeStyle = 'rgba(217,79,79,.62)'; ctx.setLineDash([3, 2]); ctx.lineWidth = 1;
    const ly = baseY + barH - toPx(S.h0);
    ctx.beginPath(); ctx.moveTo(bx + 7, ly); ctx.lineTo(bx + 42, ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#5c6f85'; ctx.font = '9.5px system-ui';
    ctx.fillText('h₀', bx + 44, baseY + 7);
    ctx.fillText('h', bx + 44, baseY + 20);
    ctx.fillStyle = '#9aaabd'; ctx.font = '8.8px system-ui';
    ctx.fillText('回升高度对比', bx + 44, baseY + 34);
    ctx.restore();
  }

  /* 底部提示条 */
  function bannerText(){
    if (S.phase === 'ready') return null;
    if (S.phase !== 'done'){
      if (mu() === 0 && isFlat()) return { t: 'μ = 0、无限长的水平面：不受力 → 速度不变 → 永远匀速直线运动', c: '#7a5cc0' };
      return null;
    }
    if (S.stopKind === 'flat'){
      if (isFlat()) return { t: '有摩擦的水平面：阻力做功，小球最终停下（摩擦力改变了运动状态）', c: '#c07a1f' };
      return { t: '小球在连接段就停下了：接触面太粗糙，它连第二个斜面都没爬上去', c: '#c07a1f' };
    }
    const pc = S.hNow / S.h0 * 100;
    if (mu() === 0) return { t: `无摩擦：小球恰好回到 h₀ —— 回升高度 100%，一个能量都没损失`, c: '#7a5cc0' };
    if (pc > 96) return { t: `几乎回到 h₀（${pc.toFixed(0)}%）：再光滑一点，就更接近了`, c: '#3f8f7f' };
    return { t: `只回到 h₀ 的 ${pc.toFixed(0)}%：差的那 ${(S.h0 - S.hNow).toFixed(3)} m 被摩擦“吃掉”了`, c: '#c07a1f' };
  }

  function drawBanner(){
    const b = bannerText();
    if (!b) return;
    ctx.save();
    ctx.font = '600 11.5px system-ui';
    const tw = ctx.measureText(b.t).width;
    const w = Math.min(W - 24, tw + 30), h = 27;
    const x = (W - w) / 2, y = H - 36;
    rr(x, y, w, h, 13);
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
    ctx.strokeStyle = b.c + '55'; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.fillStyle = b.c; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.t, x + w / 2, y + h / 2 + .5);
    ctx.restore();
  }

  function render(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBg();
    drawTrack();
    drawHeights();
    drawRuler();
    drawFlags();
    drawBall();
    drawHUD();
    drawBanner();
  }

  /* ============ 主循环 ============ */
  let last = performance.now(), acc = 0;
  function loop(now){
    const dtReal = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (S.phase === 'down' || S.phase === 'flat' || S.phase === 'up'){
      acc += dtReal * S.speed;
      let guard = 0;
      while (acc >= DT && guard++ < 5000){
        step(DT); acc -= DT;
        if (S.phase !== 'down' && S.phase !== 'flat' && S.phase !== 'up'){ acc = 0; break; }
      }
      syncLive();
    }
    render();
    requestAnimationFrame(loop);
  }

  /* ============ UI ============ */
  function buildMeds(){
    const box = $('meds');
    box.innerHTML = '';
    MEDIA.forEach((m, i) => {
      const b = document.createElement('button');
      b.className = 'med' + (i === S.mi ? ' on' : '') + (i === 4 ? ' ideal' : '');
      b.innerHTML = `<span class="sw" style="background:${m.color}"></span>
        <div class="nm">${m.name}</div>
        <div class="mu">μ = ${m.mu.toFixed(2)} · ${m.desc}</div>`;
      b.onclick = () => {
        if (S.auto) return;
        S.mi = i; buildMeds(); reset(true); sync();
      };
      box.appendChild(b);
    });
  }

  function statusText(){
    if (S.phase === 'ready') return ['静止待释放', 'rest'];
    if (S.phase === 'done') return ['已静止', 'rest'];
    if (mu() === 0 && (S.phase === 'flat' || (S.phase === 'up' && isFlat()))) return ['匀速（不受力）', 'uni'];
    if (S.phase === 'down') return ['加速', 'acc'];
    return ['减速', 'dec'];
  }

  function syncLive(){
    $('ro-h0').innerHTML = S.h0.toFixed(2) + '<span>m</span>';
    const hv = Math.max(0, Math.min(S.hNow, 0.6));
    const pc = S.h0 > 0 ? hv / S.h0 * 100 : 0;
    $('ro-h').innerHTML = hv.toFixed(3) + '<span>' + (S.phase === 'ready' ? '—' : pc.toFixed(0) + '%') + '</span>';
    $('ro-v').innerHTML = Math.abs(S.v).toFixed(2) + '<span>m/s</span>';
    const g = geo();
    const s = Math.max(0, S.q - (g.S1 + D_FLAT));
    $('ro-s').innerHTML = s.toFixed(2) + '<span>m</span>';
    $('ro-sk').textContent = isFlat() ? '水平滑行 s' : '沿斜面滑行 s';
    const [t, cls] = statusText();
    const el = $('ro-st');
    el.textContent = t; el.className = 'st ' + cls;
  }

  function sync(){
    syncLive();
    // 阶梯高亮
    let act = 2;
    if (S.mi === 4 && isFlat()) act = 4;
    else if (S.mi === 4) act = 3;
    else if (S.mi === 0) act = 1;
    document.querySelectorAll('#steps .step').forEach(b => {
      b.classList.toggle('on', +b.dataset.step === act);
    });
    // 按钮
    const running = S.phase === 'down' || S.phase === 'flat' || S.phase === 'up';
    $('btn-run').disabled = running || S.auto;
    $('btn-ideal').disabled = running || S.auto;
    $('btn-auto').disabled = running || S.auto;
    $('sl-th').disabled = running || S.auto;
    $('sl-h0').disabled = running || S.auto;
    $('btn-run').textContent = running ? '● 运行中…' : '▶ 释放小球';
  }

  /* ---- 事件 ---- */
  $('btn-run').onclick = () => { if (!S.auto) launch(); };
  $('btn-reset').onclick = () => {
    if (S.timer) clearTimeout(S.timer);
    S.auto = false; S.queue = [];
    reset(false); sync();
  };
  $('btn-ideal').onclick = () => {
    if (S.auto) return;
    S.mi = 4; buildMeds(); reset(true); launch();
  };
  $('btn-auto').onclick = () => {
    if (S.auto) return;
    S.queue = [1, 2, 3, 4];
    S.auto = true;
    S.mi = 0; buildMeds();
    reset(false); launch(); sync();
  };

  $('sl-th').oninput = e => {
    S.theta2 = parseFloat(e.target.value) * Math.PI / 180;
    $('lb-th').textContent = e.target.value === '0' ? '0°（水平面）' : e.target.value + '°';
    reset(false); sync();
  };
  $('sl-h0').oninput = e => {
    S.h0 = parseFloat(e.target.value);
    $('lb-h0').textContent = S.h0.toFixed(2) + ' m';
    reset(false); sync();
  };

  document.querySelectorAll('#speeds .chip').forEach(c => {
    c.onclick = () => {
      document.querySelectorAll('#speeds .chip').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      S.speed = parseFloat(c.dataset.sp);
    };
  });

  document.querySelectorAll('#steps .step').forEach(b => {
    b.onclick = () => {
      if (S.auto) return;
      const n = +b.dataset.step;
      if (S.timer) clearTimeout(S.timer);
      if (n === 1){ S.mi = 0; S.theta2 = 18 * Math.PI / 180; }
      if (n === 2){ S.mi = 3; S.theta2 = 18 * Math.PI / 180; }
      if (n === 3){ S.mi = 4; S.theta2 = 18 * Math.PI / 180; }
      if (n === 4){ S.mi = 4; S.theta2 = 0; }
      $('sl-th').value = Math.round(S.theta2 * 180 / Math.PI);
      $('lb-th').textContent = S.theta2 === 0 ? '0°（水平面）' : Math.round(S.theta2 * 180 / Math.PI) + '°';
      buildMeds(); reset(false); launch(); sync();
    };
  });

  window.addEventListener('resize', () => { fit(); render(); });

  /* ---- 启动 ---- */
  fit();
  buildMeds();
  reset(false);
  sync();
  requestAnimationFrame(loop);
})();
</script>


</body></html>
