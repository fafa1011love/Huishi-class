<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>质点 · 参考系 · 位移与路程 ｜ 3D 交互演示</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    color:#0f172a;
    background:linear-gradient(165deg,#f4f8fd 0%,#e9f1fa 42%,#dde9f6 100%);
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  #c{display:block;width:100%;height:100%;outline:none}

  /* ---------- 顶层 HUD ---------- */
  .hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
  .hud > *{pointer-events:auto}

  .topbar{
    position:absolute;top:0;left:0;right:0;height:70px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(140deg,#3b82f6,#1d4ed8);
    box-shadow:0 6px 16px -4px rgba(37,99,235,.55), inset 0 1px 0 rgba(255,255,255,.35);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;
  }
  .brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:11.5px;color:#7c8ba1;letter-spacing:.3px}
  .topnote{
    pointer-events:none;font-size:11.5px;color:#8595ab;
    background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);
    padding:6px 12px;border-radius:99px;backdrop-filter:blur(8px);
  }

  .panel{
    position:absolute;
    background:rgba(255,255,255,.80);
    border:1px solid rgba(255,255,255,.95);
    border-radius:16px;
    backdrop-filter:blur(16px) saturate(1.15);
    box-shadow:0 12px 34px -12px rgba(23,49,88,.20), 0 2px 6px -2px rgba(23,49,88,.07);
    padding:14px;
  }

  /* ---------- 左：参考系 ---------- */
  .left{top:80px;left:24px;width:246px}
  .panel-title{
    font-size:11px;font-weight:700;letter-spacing:1.4px;color:#8fa0b6;
    text-transform:uppercase;margin:0 0 10px 2px;display:flex;align-items:center;gap:6px;
  }
  .panel-title::before{content:'';width:3px;height:11px;border-radius:2px;background:#3b82f6}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef3f9;padding:4px;border-radius:11px}
  .seg button{
    border:0;background:transparent;padding:9px 6px;border-radius:8px;
    font-size:13px;font-weight:600;color:#6b7c93;cursor:pointer;
    transition:.22s cubic-bezier(.4,0,.2,1);font-family:inherit;
  }
  .seg button:hover{color:#334155}
  .seg button.active{
    background:#fff;color:#1d4ed8;
    box-shadow:0 2px 8px -2px rgba(37,99,235,.30), 0 0 0 1px rgba(37,99,235,.10);
  }
  .refhint{
    margin:11px 2px 2px;font-size:12px;line-height:1.65;color:#64748b;min-height:60px;
  }
  .refhint b{color:#1e293b;font-weight:650}
  .refhint .hl{color:#1d4ed8;font-weight:650}

  /* ---------- 右上：数据 ---------- */
  .right{top:80px;right:24px;width:272px}
  .row{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:8px 2px;border-bottom:1px dashed #e6edf5;
  }
  .row:last-child{border-bottom:0}
  .row .k{font-size:12px;color:#7b8ba0;display:flex;align-items:center;gap:6px}
  .row .v{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;letter-spacing:-.2px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .v.red{color:#e11d48}
  .v.cyan{color:#0284c7}
  .v.dark{color:#1e293b}

  .cmp{margin-top:12px;border-radius:11px;overflow:hidden;border:1px solid #e6edf5}
  .cmp table{width:100%;border-collapse:collapse;font-size:11.5px}
  .cmp th{
    background:#f4f8fd;color:#8496ad;font-weight:600;padding:6px 8px;text-align:right;
    font-size:10.5px;letter-spacing:.4px;
  }
  .cmp th:first-child{text-align:left}
  .cmp td{padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums;color:#334155;border-top:1px solid #eef3f9}
  .cmp td:first-child{text-align:left;color:#64748b}
  .cmp tr.on td{background:rgba(59,130,246,.06)}
  .cmp tr.on td:first-child{color:#1d4ed8;font-weight:650}

  /* ---------- 左下：选项 ---------- */
  .opts{left:24px;bottom:150px;width:246px;padding:12px 14px}
  .sw{
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 0;cursor:pointer;font-size:12.5px;color:#4a5b70;user-select:none;
  }
  .sw span.lbl{display:flex;align-items:center;gap:8px}
  .sw i{
    width:16px;height:3px;border-radius:2px;display:inline-block;flex:0 0 auto;
  }
  .sw input{display:none}
  .sw .track{
    width:34px;height:19px;border-radius:99px;background:#dbe3ec;position:relative;
    transition:.24s cubic-bezier(.4,0,.2,1);flex:0 0 auto;
  }
  .sw .track::after{
    content:'';position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.28);transition:.24s cubic-bezier(.4,0,.2,1);
  }
  .sw input:checked + .track{background:#3b82f6}
  .sw input:checked + .track::after{transform:translateX(15px)}

  /* ---------- 底部时间轴 ---------- */
  .bottom{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:20px;width:min(880px,calc(100% - 48px));
    background:rgba(255,255,255,.84);
    border:1px solid rgba(255,255,255,.95);
    border-radius:18px;backdrop-filter:blur(18px) saturate(1.15);
    box-shadow:0 16px 40px -16px rgba(23,49,88,.26);
    padding:14px 18px 12px;
  }
  .tl-head{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .play{
    width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;
    background:linear-gradient(140deg,#3b82f6,#1d4ed8);color:#fff;
    display:grid;place-items:center;font-size:13px;
    box-shadow:0 6px 16px -5px rgba(37,99,235,.6);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .play:hover{transform:scale(1.06);box-shadow:0 8px 20px -5px rgba(37,99,235,.7)}
  .play:active{transform:scale(.96)}
  .play svg{width:15px;height:15px;fill:currentColor}
  .tl-meta{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:0}
  .meta-item{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .meta-item .t{font-size:10.5px;color:#93a3b8;letter-spacing:.3px}
  .meta-item .n{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:#1e293b}
  .meta-item .n.em{color:#1d4ed8}
  .meta-item .n.amber{color:#b45309}
  .tl-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  .speeds{display:flex;gap:2px;background:#eef3f9;border-radius:9px;padding:3px}
  .speeds button{
    border:0;background:transparent;font-size:11px;font-weight:600;color:#7b8ba0;
    padding:4px 9px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.18s;
  }
  .speeds button.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 4px rgba(23,49,88,.12)}
  .btn-ghost{
    border:1px solid #e2eaf3;background:#fff;color:#64748b;font-size:11.5px;font-weight:600;
    padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.18s;
  }
  .btn-ghost:hover{border-color:#c8d7e8;color:#334155}

  .tl-track{
    position:relative;height:34px;margin:2px 4px 0;cursor:pointer;
  }
  .tl-rail{
    position:absolute;left:0;right:0;top:16px;height:4px;border-radius:3px;background:#e4ecf5;
  }
  .tl-fill{
    position:absolute;left:0;top:16px;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#93c5fd,#3b82f6);width:0;
  }
  .tl-tick{position:absolute;top:11px;width:1px;height:7px;background:#cfdceb;transform:translateX(-.5px)}
  .tl-tick.major{top:8px;height:13px;background:#b9cade}
  .tl-ticklab{
    position:absolute;top:23px;font-size:9.5px;color:#9aabc0;transform:translateX(-50%);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .tl-event{
    position:absolute;top:9px;width:8px;height:8px;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);
    background:#fbbf24;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(146,90,0,.35);
  }
  .tl-evlab{
    position:absolute;top:-6px;font-size:9.5px;color:#b45309;transform:translateX(-50%);
    white-space:nowrap;font-weight:600;
  }
  .tl-handle{
    position:absolute;top:1px;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid #1d4ed8;transform:translateX(-50%);
    box-shadow:0 3px 10px -1px rgba(37,99,235,.5);pointer-events:none;
  }
  .tl-handle::after{
    content:'';position:absolute;left:50%;top:13px;width:2px;height:16px;
    transform:translateX(-50%);background:linear-gradient(180deg,#1d4ed8,transparent);border-radius:1px;
  }

  .tl-legend{
    display:flex;gap:18px;margin-top:4px;padding-top:8px;border-top:1px dashed #eaf0f7;
    font-size:10.5px;color:#94a3b8;
  }
  .tl-legend b{color:#64748b;font-weight:600}

  /* 提示条 */
  .toast{
    position:absolute;left:50%;top:86px;transform:translate(-50%,-8px);
    background:rgba(30,41,59,.92);color:#fff;font-size:12.5px;
    padding:9px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;
    box-shadow:0 10px 26px -8px rgba(15,23,42,.6);white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:900px){
    .left,.right,.opts{width:200px;padding:11px}
    .opts{bottom:auto;top:auto;display:none}
    .refhint{min-height:0;font-size:11px}
    .topnote{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud">
    <header class="topbar">
      <div class="brand">
        <div class="logo">P</div>
        <div>
          <h1>质点 · 参考系 · 位移与路程</h1>
          <p>高中物理 必修一 · 第一章 运动的描述</p>
        </div>
      </div>
      <div class="topnote">拖动旋转视角 · 空格播放/暂停</div>
    </header>

    <section class="panel left">
      <div class="panel-title">参考系</div>
      <div class="seg" id="segRef">
        <button data-ref="ground" class="active">地面</button>
        <button data-ref="board">移动木板</button>
      </div>
      <div class="refhint" id="refHint"></div>
    </section>

    <section class="panel right">
      <div class="panel-title">实时数据</div>
      <div class="row">
        <div class="k">当前时刻 <span style="color:#c3cfe0">t</span></div>
        <div class="v dark" id="vT">0.00 s</div>
      </div>
      <div class="row">
        <div class="k"><span class="dot" style="background:#e11d48"></span>位移 Δx</div>
        <div class="v red" id="vDisp">0.00 m</div>
      </div>
      <div class="row">
        <div class="k"><span class="dot" style="background:#0891b2"></span>路程 s</div>
        <div class="v cyan" id="vPath">0.00 m</div>
      </div>
      <div class="cmp">
        <table>
          <thead>
            <tr><th>参考系</th><th>位移 / m</th><th>路程 / m</th></tr>
          </thead>
          <tbody>
            <tr id="cmpG"><td>地面</td><td id="cG1">0.00</td><td id="cG2">0.00</td></tr>
            <tr id="cmpB"><td>移动木板</td><td id="cB1">0.00</td><td id="cB2">0.00</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel opts">
      <div class="panel-title">显示与模型</div>
      <label class="sw">
        <span class="lbl"><i style="background:#e11d48"></i>位移矢量</span>
        <input type="checkbox" id="optDisp" checked><span class="track"></span>
      </label>
      <label class="sw">
        <span class="lbl"><i style="background:#0891b2"></i>路程轨迹</span>
        <input type="checkbox" id="optPath" checked><span class="track"></span>
      </label>
      <label class="sw">
        <span class="lbl"><i style="background:#38bdf8"></i>视为质点</span>
        <input type="checkbox" id="optParticle"><span class="track"></span>
      </label>
    </section>

    <footer class="bottom">
      <div class="tl-head">
        <button class="play" id="playBtn" title="播放 / 暂停">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="tl-meta">
          <div class="meta-item">
            <span class="t">时刻 t =</span><span class="n em" id="mT">0.00</span><span class="t">s</span>
          </div>
          <div class="meta-item">
            <span class="t">时间间隔 Δt =</span><span class="n amber" id="mDt">0.00</span><span class="t">s</span>
          </div>
        </div>
        <div class="tl-right">
          <div class="speeds" id="speeds">
            <button data-s="0.5">0.5×</button>
            <button data-s="1" class="active">1×</button>
            <button data-s="2">2×</button>
          </div>
          <button class="btn-ghost" id="resetBtn">重置</button>
        </div>
      </div>

      <div class="tl-track" id="tlTrack">
        <div class="tl-rail"></div>
        <div class="tl-fill" id="tlFill"></div>
        <div id="tlTicks"></div>
        <div class="tl-handle" id="tlHandle"></div>
      </div>

      <div class="tl-legend">
        <span><b>时刻</b>：时间轴上的一个点，如「第 2.0 s 末」</span>
        <span><b>时间间隔</b>：时间轴上的一段，如「前 2.0 s 内」</span>
      </div>
    </footer>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* ============================================================
   1. 运动学内核
   ------------------------------------------------------------
   小车相对地面：0~2s 匀速前进 0.6 m/s（与木板同速）
                 2~4s 减速后退 0.4 m/s
                 4~6s 静止
   木板相对地面：全程匀速前进 0.6 m/s
   → 前 2 秒，小车相对木板「完全静止」
   ============================================================ */
const T_END = 6.0;
const BOARD_LEN = 6.6;
const BOARD_WID = 3.0;
const BOARD_THK = 0.14;
const BOARD_X0 = -1.6;
const BOARD_V = 0.6;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function carX(t){
  t = clamp(t, 0, T_END);
  if (t <= 2) return 0.6 * t;
  if (t <= 4) return 1.2 - 0.4 * (t - 2);
  return 0.4;
}
function boardX(t){
  return BOARD_X0 + BOARD_V * clamp(t, 0, T_END);
}

/* 路程：数值积分预计算（分别在地面系 / 木板系） */
const NS = 1200;
const DT = T_END / NS;
const distGround = new Float32Array(NS + 1);
const distBoard  = new Float32Array(NS + 1);
(function(){
  let dg = 0, db = 0;
  let pg = carX(0), pb = carX(0) - boardX(0);
  for (let i = 1; i <= NS; i++){
    const tt = i * DT;
    const g = carX(tt);
    const b = g - boardX(tt);
    dg += Math.abs(g - pg); pg = g;
    db += Math.abs(b - pb); pb = b;
    distGround[i] = dg;
    distBoard[i]  = db;
  }
})();
const distAt = (arr, t) => arr[clamp(Math.round(t / DT), 0, NS)];

/* ============================================================
   2. 渲染器 / 场景 / 相机
   ============================================================ */
const stageEl = document.getElementById('stage');
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9f0f9, 30, 62);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(-3.4, 8.4, 13.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.465;
controls.minPolarAngle = 0.12;
controls.enablePan = false;
controls.rotateSpeed = 0.75;
controls.update();

/* 光照 */
scene.add(new THREE.HemisphereLight(0xffffff, 0xd5e0ee, 1.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.28));

const sun = new THREE.DirectionalLight(0xfff6e8, 1.95);
sun.position.set(-9, 17, 11);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16;
sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16;
sun.shadow.camera.bottom = -16;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.018;
scene.add(sun);

/* ============================================================
   3. 文字贴图工具
   ============================================================ */
const labelCache = new Map();
function makeTextTexture(text, { color = '#8899aa', font = 'bold 100px system-ui,sans-serif', pad = 22 } = {}){
  const key = text + '|' + color + '|' + font;
  if (labelCache.has(key)) return labelCache.get(key);

  const mc = document.createElement('canvas').getContext('2d');
  mc.font = font;
  const tw = Math.ceil(mc.measureText(text).width);
  const h = 132, w = tw + pad * 2;

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, h / 2 + 5);

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;

  const res = { tex, aspect: w / h };
  labelCache.set(key, res);
  return res;
}

function makeTextPlane(text, size, opts){
  const { tex, aspect } = makeTextTexture(text, opts);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(size * aspect, size),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.renderOrder = 2;
  return mesh;
}

/* ============================================================
   4. 地面 + 刻度底板
   ============================================================ */
const groundGroup = new THREE.Group();
scene.add(groundGroup);

const GROUND_LEN = 24;
const GROUND_WID = 9;

const groundMat = new THREE.MeshStandardMaterial({ color: 0xf7fafd, roughness: 0.94, metalness: 0.0 });
const groundSlab = new THREE.Mesh(new THREE.BoxGeometry(GROUND_LEN, 0.34, GROUND_WID), groundMat);
groundSlab.position.y = -0.17;
groundSlab.receiveShadow = true;
groundGroup.add(groundSlab);

/* 边缘 */
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xdfe8f2, roughness: 0.8 });
[[0, 0.02, GROUND_WID / 2], [0, 0.02, -GROUND_WID / 2]].forEach(([x, y, z]) => {
  const e = new THREE.Mesh(new THREE.BoxGeometry(GROUND_LEN, 0.05, 0.06), edgeMat);
  e.position.set(x, y, z);
  groundGroup.add(e);
});

/* 刻度线 */
{
  const minor = [], major = [];
  const Z0s = 2.55, Z1 = 3.85;
  for (let x = -11; x <= 11; x++){
    const isMajor = x % 5 === 0;
    const z0 = isMajor ? 2.1 : Z0s;
    (isMajor ? major : minor).push(x, 0.006, z0, x, 0.006, Z1);
  }
  // 上下基线
  minor.push(-11, 0.006, Z1, 11, 0.006, Z1);
  minor.push(-11, 0.006, 2.55, 11, 0.006, 2.55);

  const mk = (arr, color, op) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: op }));

class ArrowX {
  constructor(color){
    this.group = new THREE.Group();
    this.mat = new THREE.MeshStandardMaterial({
      color, roughness: 0.42, metalness: 0.05,
      emissive: color, emissiveIntensity: 0.28
    });
    this.shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 1, 14), this.mat);
    this.shaft.rotation.z = -Math.PI / 2;
    this.shaft.castShadow = true;
    this.head = new THREE.Mesh(new THREE.ConeGeometry(0.115, 0.32, 20), this.mat);
    this.head.castShadow = true;
    this.group.add(this.shaft, this.head);
  }
  set(x1, x2, y, z = 0){
    const dx = x2 - x1;
    const L = Math.abs(dx);
    if (L < 0.05){ this.group.visible = false; return; }
    this.group.visible = true;
    const dir = Math.sign(dx);
    const hl = Math.min(0.34, L * 0.46);
    const sl = L - hl;

    this.shaft.scale.y = Math.max(sl, 0.001);
    this.shaft.position.x = x1 + dir * sl / 2;

    this.head.scale.set(1, hl / 0.32, 1);
    this.head.rotation.z = dir > 0 ? -Math.PI / 2 : Math.PI / 2;
    this.head.position.x = x1 + dir * (sl + hl / 2);

    this.group.position.set(0, y, z);
  }
}

  speed: 1,

  particle: false
};

/* ============================================================
   11. 每帧更新
   ============================================================ */
const trailPts = [];

function updateScene(){
  const t = state.t;
  const rf = state.refF;

  /* --- 参考系平移 --- */
  groundGroup.position.x = -rf * boardX(t);
  boardGroup.position.x = boardX(t) - rf * boardX(t);
  const carWorld = carX(t) - rf * boardX(t);
  carGroup.position.set(carWorld, BOARD_THK + 0.022, 0);

  /* 木板高亮 */
  const glowTarget = rf > 0.02 ? (0.05 + 0.10 * rf) : 0;
  boardGlowMat.opacity += (glowTarget - boardGlowMat.opacity) * 0.12;

  /* --- 小车 / 质点 --- */
  const showCar = !state.particle;
  carGroup.visible = showCar;
  particleGroup.visible = state.particle;
  particleGroup.position.x = carWorld;

  /* --- 起点 --- */
  const startWorld = carX(0) - rf * boardX(0);   // 0 - rf*(-1.6) = 1.6*rf
  startGroup.position.x = startWorld;
  startGroup.visible = state.showDisp || state.showPath;

  /* --- 位移矢量 --- */
  const dx = carWorld - startWorld;
  if (state.showDisp){
    dispArrow.group.visible = true;
    dispArrow.set(startWorld, carWorld, 0.86, 0);
    dispCapA.visible = dispCapB.visible = true;
    dispCapA.position.set(startWorld, 0.86, 0);
    dispCapB.position.set(carWorld, 0.86, 0);
  } else {
    dispArrow.group.visible = false;
    dispCapA.visible = dispCapB.visible = false;
  }

  /* --- 路程轨迹（沿实际路径） --- */
  trail.visible = state.showPath;
  barMat.opacity = distBar.visible ? .95 : 0;
  if (state.showPath){
    trailPts.length = 0;
    const N = 96;
    const tm = Math.max(t, 0.0015);
    for (let i = 0; i <= N; i++){
      const tt = tm * i / N;
      trailPts.push(carX(tt) - rf * boardX(tt), 0.205, 0);
    }
    trail.geometry.setPositions(trailPts);
    trail.geometry.instanceCount = N;
    trail.computeLineDistances();

    /* 路程尺：从起点沿 +x 展开，长度 = 路程 */
    const dist = distAt(distGround, t) * (1 - rf) + distAt(distBoard, t) * rf;
    const barEnd = startWorld + dist;
    distBar.visible = dist > 0.03;
    barCap.visible = distBar.visible;
    barPost.visible = true;
    if (distBar.visible){
      const bpts = [];
      const M = 24;
      for (let i = 0; i <= M; i++){
        bpts.push(startWorld + dist * i / M, 0.022, 2.05);
      }
      distBar.geometry.setPositions(bpts);
      distBar.geometry.instanceCount = M;
      barCap.position.set(barEnd, 0.09, 2.05);
      barPost.position.set(startWorld, 0.11, 2.05);
    }
  } else {
    distBar.visible = false;
    barCap.visible = false;
    barPost.visible = false;
  }

  /* --- 数据 --- */
  updateHUD(dx, startWorld);
}

  const t = state.t;

  const dist = distAt(distGround, t) * (1 - rf) + distAt(distBoard, t) * rf;
  const distG = distAt(distGround, t);
  const distB = distAt(distBoard, t);

  vPath.innerHTML = fmt(dist) + ' <span style="font-size:11px;font-weight:600;color:#94a3b8">m</span>';

  const pct = t / T_END;

  tlHandle.style.left = (pct * 100) + '%';
  mT.textContent = t.toFixed(2);

  const dG = carX(t) - carX(0);

function seekFromEvent(e){
  const r = trackEl.getBoundingClientRect();

  state.t = clamp((x / r.width) * T_END, 0, T_END);
}

  dragging = true;
  trackEl.setPointerCapture(e.pointerId);

});

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  /* 时间推进 */
  if (state.playing && !dragging){
    state.t += dt * state.speed;
    if (state.t >= T_END){
      state.t = T_END;
      setPlaying(false);
    }
  }

  /* 参考系平滑过渡 */
  const target = state.ref === 'board' ? 1 : 0;
  state.refF += (target - state.refF) * Math.min(1, dt * 6.5);
  if (Math.abs(target - state.refF) < 0.0015) state.refF = target;

  updateScene();

  /* 质点脉动 */
  const s = 1 + Math.sin(performance.now() * 0.0035) * 0.09;
  glowSprite.scale.set(1.15 * s, 1.15 * s, 1);

  controls.update();
  renderer.render(scene, camera);
}
loop();

/* 首帧提示 */
setTimeout(() => toast('点击「移动木板」切换参考系，观察同一辆车的不同描述'), 900);
</script>
</body>
</html>
